<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Architecture Editor — Visual Learning</title>
<meta name="description" content="An Eraser.io-style architecture editor for practicing System Design — infinite canvas, drag &amp; drop components, connectors, templates and export." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./styles/editor.css" />
<link rel="stylesheet" href="./styles/components.css" />
<link rel="stylesheet" href="./styles/canvas.css" />
<script src="../assets/analytics.js"></script>
</head>
<body>
<div id="fade"></div>

<!-- ======================= HEADER / TOOLBAR ======================= -->
<header id="ed-header">
  <div class="hd-group brand-group">
    <a class="back" href="../index.html" title="Back to Hub">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <span>Hub</span>
    </a>
    <div class="brand">
      <span class="brand-logo">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><path d="M10 6.5h4a3 3 0 0 1 3 3V14"/></svg>
      </span>
      <div class="brand-txt">
        <strong>Architecture Editor</strong>
        <span id="doc-name">Untitled diagram</span>
      </div>
    </div>
  </div>

  <div class="hd-group toolbar" id="toolbar">
    <div class="tb-cluster">
      <button class="tb-btn" data-action="undo" title="Undo (Ctrl+Z)" aria-label="Undo">
        <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg>
      </button>
      <button class="tb-btn" data-action="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">
        <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h1"/></svg>
      </button>
    </div>

    <div class="tb-cluster">
      <button class="tb-btn" data-action="zoom-out" title="Zoom out" aria-label="Zoom out">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M21 21l-4.3-4.3"/></svg>
      </button>
      <button class="tb-btn zoom-label" data-action="zoom-reset" id="zoom-reset" title="Reset zoom">100%</button>
      <button class="tb-btn" data-action="zoom-in" title="Zoom in" aria-label="Zoom in">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M21 21l-4.3-4.3"/></svg>
      </button>
      <button class="tb-btn" data-action="fit" title="Fit to screen (Shift+1)" aria-label="Fit to screen">
        <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M16 21h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
      <button class="tb-btn" data-action="toggle-grid" id="btn-grid" title="Toggle grid (G)" aria-label="Toggle grid">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>
      </button>
    </div>

    <div class="tb-cluster">
      <button class="tb-btn" data-action="edge-kind" id="btn-edge-kind" title="Connector style">
        <svg viewBox="0 0 24 24"><path d="M4 18c6 0 4-12 16-12"/><circle cx="4" cy="18" r="1.6" fill="currentColor" stroke="none"/><circle cx="20" cy="6" r="1.6" fill="currentColor" stroke="none"/></svg>
        <span class="tb-btn-txt" id="edge-kind-label">Curved</span>
      </button>
      <button class="tb-btn" data-action="toggle-animated" id="btn-animated" title="Animate connectors">
        <svg viewBox="0 0 24 24"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>
      </button>
      <button class="tb-btn" data-action="auto-layout" title="Auto layout">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="6" rx="1"/><rect x="14" y="4" width="7" height="6" rx="1"/><rect x="8.5" y="14" width="7" height="6" rx="1"/><path d="M6.5 10v2a2 2 0 0 0 2 2h.5M17.5 10v2a2 2 0 0 1-2 2H15"/></svg>
        <span class="tb-btn-txt">Layout</span>
      </button>
    </div>

    <div class="tb-cluster">
      <button class="tb-btn has-menu" data-action="templates" id="btn-templates" title="Templates">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        <span class="tb-btn-txt">Templates</span>
        <svg class="caret" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <button class="tb-btn has-menu" data-action="export" id="btn-export" title="Export">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        <span class="tb-btn-txt">Export</span>
        <svg class="caret" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <button class="tb-btn" data-action="import-json" title="Import JSON">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 8l5-5 5 5M12 3v12"/></svg>
      </button>
    </div>
  </div>

  <div class="hd-group right-group">
    <button class="tb-btn" data-action="clear" title="Clear canvas">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
    </button>
    <button class="tb-btn" data-action="theme" id="btn-theme" title="Toggle theme">
      <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
  </div>
</header>

<!-- ======================= BODY ======================= -->
<div id="ed-body">

  <!-- ---------- LEFT: COMPONENT PALETTE ---------- -->
  <aside id="ed-left" class="panel">
    <div class="panel-head">
      <span>Components</span>
      <button class="icon-btn" id="collapse-left" title="Collapse panel">
        <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
      </button>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" class="search-ico"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="component-search" type="text" placeholder="Search components…" autocomplete="off" spellcheck="false" />
    </div>
    <div id="palette" class="palette"></div>
    <div class="panel-foot">Drag onto the canvas to add · Vanilla JS · No build</div>
  </aside>

  <!-- ---------- CENTER: INFINITE CANVAS ---------- -->
  <div id="ed-canvas-wrap">
    <div id="viewport">
      <div id="world">
        <svg id="edge-layer" xmlns="http://www.w3.org/2000/svg">
          <defs id="edge-defs"></defs>
          <g id="edge-group"></g>
          <path id="temp-edge" class="temp-edge" />
        </svg>
        <div id="node-layer"></div>
      </div>
    </div>
    <div id="marquee" class="marquee" hidden></div>
    <div id="context-menu" class="context-menu" hidden></div>
    <div id="canvas-empty" class="canvas-empty">
      <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><path d="M10 6.5h4a3 3 0 0 1 3 3V14"/></svg>
      <h3>Start designing</h3>
      <p>Drag a component from the left, or load a template to begin.</p>
    </div>
    <div id="mini-hint" class="mini-hint">
      <kbd>Space</kbd>+drag to pan · <kbd>Scroll</kbd> to zoom · <kbd>Del</kbd> to remove
    </div>
  </div>

  <!-- ---------- RIGHT: PROPERTIES ---------- -->
  <aside id="ed-right" class="panel">
    <div class="panel-head">
      <span>Properties</span>
      <button class="icon-btn" id="collapse-right" title="Collapse panel">
        <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>
    <div id="properties" class="properties"></div>
  </aside>
</div>

<!-- ======================= STATUS BAR ======================= -->
<footer id="ed-status">
  <div class="st-group">
    <span class="st-item" id="st-nodes">0 nodes</span>
    <span class="st-sep"></span>
    <span class="st-item" id="st-edges">0 edges</span>
    <span class="st-sep"></span>
    <span class="st-item" id="st-selection">No selection</span>
  </div>
  <div class="st-group">
    <span class="st-item st-save" id="st-save">Saved</span>
    <span class="st-sep"></span>
    <span class="st-item" id="st-zoom">100%</span>
  </div>
</footer>

<script type="module" src="./main.js"></script>
</body>
</html>
