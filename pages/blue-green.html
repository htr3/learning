<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blue-Green Deployment — System Design Concepts</title>
<link rel="stylesheet" href="../assets/concept.css" />
<script src="../assets/analytics.js"></script>
</head>
<body>
<script src="../assets/concept.js"></script>
<script>
"use strict";

function arrow(parent,x1,y1,x2,y2,c){
  parent.appendChild(S("line",{x1,y1,x2,y2,stroke:c,"stroke-width":2}));
  const a=Math.atan2(y2-y1,x2-x1),h=7;
  const p1=[x2-h*Math.cos(a-0.5),y2-h*Math.sin(a-0.5)],p2=[x2-h*Math.cos(a+0.5),y2-h*Math.sin(a+0.5)];
  parent.appendChild(S("polygon",{points:x2+","+y2+" "+p1[0]+","+p1[1]+" "+p2[0]+","+p2[1],fill:c}));
}

function diagram(host){
  const svg=S("svg",{viewBox:"0 0 640 210"});host.appendChild(svg);
  const lbl=TX(320,18,"",{fill:"#c4a2ff","font-size":13,"text-anchor":"middle","font-weight":700});svg.appendChild(lbl);
  const sub=TX(320,200,"",{fill:"#8b8b93","font-size":11,"text-anchor":"middle"});svg.appendChild(sub);
  const g=S("g",{});svg.appendChild(g);
  function env(x,y,name,ver,c,live){g.appendChild(S("rect",{x:x-70,y:y-24,width:140,height:48,rx:10,fill:c+(live?"33":"12"),stroke:c,"stroke-width":live?2.6:1.2}));
    g.appendChild(TX(x,y-4,name,{fill:"#e4e4e7","font-size":12,"text-anchor":"middle","font-weight":700}));g.appendChild(TX(x,y+14,ver,{fill:"#8b8b93","font-size":10,"text-anchor":"middle"}));}
  let phase=0,timer=0,running=false,raf,last;
  function render(){g.innerHTML="";
    g.appendChild(S("rect",{x:270,y:40,width:100,height:26,rx:7,fill:"rgba(124,58,237,.2)",stroke:"#a78bfa"}));g.appendChild(TX(320,57,"🔀 router",{fill:"#e4e4e7","font-size":11,"text-anchor":"middle","font-weight":700}));
    const liveBlue=phase<2;
    env(150,140,"BLUE",liveBlue?"v1.2 (live)":"v1.2 (idle)","#38bdf8",liveBlue);
    env(490,140,"GREEN",phase===0?"— (empty)":phase===1?"v1.3 (staged)":"v1.3 (live)","#34d399",!liveBlue);
    arrow(g,320,66,liveBlue?150:490,116,liveBlue?"#38bdf8":"#34d399");
    if(phase===0){lbl.textContent="1 — BLUE serves 100% of production traffic";lbl.setAttribute("fill","#38bdf8");sub.textContent="GREEN is idle; two identical production environments exist side by side";}
    else if(phase===1){g.appendChild(TX(490,180,"deploy + smoke-test here",{fill:"#34d399","font-size":9.5,"text-anchor":"middle"}));
      lbl.textContent="2 — deploy the new version to GREEN (no live traffic)";lbl.setAttribute("fill","#34d399");sub.textContent="test GREEN in isolation; users are still safely on BLUE";}
    else if(phase===2){g.appendChild(TX(320,88,"flip router →",{fill:"#fbbf24","font-size":10,"text-anchor":"middle"}));
      lbl.textContent="3 — flip the router: GREEN becomes live instantly";lbl.setAttribute("fill","#fbbf24");sub.textContent="atomic cutover, zero downtime; BLUE kept warm for instant rollback";}
    else{env(150,140,"BLUE","v1.2 (rollback ready)","#38bdf8",false);env(490,140,"GREEN","v1.3 (live)","#34d399",true);
      g.appendChild(TX(150,180,"⟲ flip back if issues",{fill:"#f87171","font-size":9.5,"text-anchor":"middle"}));
      lbl.textContent="rollback — a problem? flip the router back to BLUE";lbl.setAttribute("fill","#f87171");sub.textContent="rollback is as fast as the cutover — no rebuild/redeploy needed";}}
  function step(){phase=(phase+1)%4;timer=3.2;render();}
  function loop(now){if(!running)return;const dt=(now-last)/1000;last=now;timer-=dt;if(timer<=0)step();raf=requestAnimationFrame(loop);}
  const io=new IntersectionObserver(e=>{if(e[0].isIntersecting){if(!running){running=true;last=performance.now();raf=requestAnimationFrame(loop);}}else{running=false;cancelAnimationFrame(raf);}},{threshold:.15});
  io.observe(host);render();
}

function sim(root){
  root.innerHTML=`<p class="lead" style="margin-bottom:14px">Run a blue-green release. You keep <b>two identical environments</b>; only one is live. Deploy the new version to the idle one, test it with no user impact, then <b>flip the router</b> for an instant, zero-downtime cutover — and flip back just as fast if something breaks.</p>
  <div class="pg">
    <div class="pg-controls">
      <div class="pg-field"><label><input type="checkbox" id="pgBug"> new version has a bug (fails smoke test)</label></div>
      <button class="pg-btn" id="pgDeploy">1 · deploy to idle env</button>
      <button class="pg-btn secondary" id="pgTest">2 · smoke-test idle env</button>
      <button class="pg-btn secondary" id="pgFlip">3 · flip router (cutover)</button>
      <button class="pg-btn secondary" id="pgRollback">⟲ rollback</button>
      <button class="pg-btn secondary" id="pgReset">reset</button>
    </div>
    <div class="pg-stage">
      <div class="pg-stats">
        <div class="pg-stat"><div class="k">Live env</div><div class="v ac" id="pgLive">BLUE v1.2</div></div>
        <div class="pg-stat"><div class="k">Idle env</div><div class="v" id="pgIdle">GREEN —</div></div>
        <div class="pg-stat"><div class="k">User downtime</div><div class="v ok" id="pgDown">0 ms</div></div>
        <div class="pg-stat"><div class="k">Users on buggy build</div><div class="v wa" id="pgHit">0</div></div>
      </div>
      <div id="pgViz"></div>
      <div class="pg-log" id="pgLog"></div>
    </div>
  </div>`;

  const W=560,H=120;const svg=S("svg",{viewBox:"0 0 "+W+" "+H});$("pgViz").appendChild(svg);
  let liveColor="blue",blueVer="v1.2",greenVer="—",idleTested=false,hit=0;
  function idleColor(){return liveColor==="blue"?"green":"blue";}
  function idleVer(){return idleColor()==="green"?greenVer:blueVer;}
  function draw(){svg.innerHTML="";
    [["BLUE",140,"#38bdf8","blue",blueVer],["GREEN",420,"#34d399","green",greenVer]].forEach(([n,x,c,col,ver])=>{
      const live=liveColor===col;
      svg.appendChild(S("rect",{x:x-70,y:30,width:140,height:50,rx:10,fill:c+(live?"33":"10"),stroke:c,"stroke-width":live?2.6:1.2}));
      svg.appendChild(TX(x,52,n,{fill:"#e4e4e7","font-size":13,"text-anchor":"middle","font-weight":700}));
      svg.appendChild(TX(x,70,ver+(live?" · LIVE":" · idle"),{fill:live?c:"#8b8b93","font-size":10,"text-anchor":"middle"}));});
    svg.appendChild(TX(280,18,"🔀 router → "+(liveColor==="blue"?"BLUE":"GREEN"),{fill:"#a78bfa","font-size":11,"text-anchor":"middle","font-weight":700}));
    arrow(svg,280,22,liveColor==="blue"?140:420,28,"#a78bfa");}
  function stats(){$("pgLive").textContent=(liveColor==="blue"?"BLUE ":"GREEN ")+(liveColor==="blue"?blueVer:greenVer);
    $("pgIdle").textContent=(idleColor()==="blue"?"BLUE ":"GREEN ")+idleVer();$("pgHit").textContent=hit;draw();}
  function log(m,c){const l=$("pgLog");const d=el("div",c||"",m);l.insertBefore(d,l.firstChild);while(l.children.length>22)l.removeChild(l.lastChild);}
  function deploy(){const c=idleColor();if(c==="green")greenVer="v1.3";else blueVer="v1.3";idleTested=false;
    log("deployed v1.3 to idle "+c.toUpperCase()+" — receiving NO user traffic yet","ac");stats();}
  function test(){if(idleVer()==="—"){log("nothing deployed to idle env yet","wa");return;}
    if($("pgBug").checked){idleTested=false;log("smoke test on idle env FAILED — bug detected before any user saw it ✓","ok");}
    else{idleTested=true;log("smoke test on idle env PASSED — safe to cut over","ok");}stats();}
  function flip(){if(idleVer()==="—"){log("deploy to the idle env first","wa");return;}
    if(!idleTested&&$("pgBug").checked){log("⚠ flipping to an UNTESTED buggy build — users will hit the bug!","bad");hit+=100;}
    liveColor=idleColor();$("pgDown").textContent="0 ms";log("🔀 router flipped — "+liveColor.toUpperCase()+" is now LIVE (atomic, zero downtime)","ac");
    if(liveColor==="green"&&greenVer==="v1.3"&&$("pgBug").checked&&!idleTested)log("   users now on buggy v1.3 — rollback to instantly recover","bad");stats();}
  function rollback(){liveColor=idleColor();log("⟲ rolled back — flipped router to "+liveColor.toUpperCase()+" (old version still warm, instant)","ok");stats();}
  $("pgDeploy").onclick=deploy;$("pgTest").onclick=test;$("pgFlip").onclick=flip;$("pgRollback").onclick=rollback;
  $("pgReset").onclick=()=>{liveColor="blue";blueVer="v1.2";greenVer="—";idleTested=false;hit=0;$("pgDown").textContent="0 ms";log("reset — BLUE v1.2 live, GREEN idle","ac");stats();};
  stats();log("BLUE v1.2 is live. deploy v1.3 to GREEN, test, then flip →","ac");
}

const DATA={
  badge:"🔵",title:"Blue-Green Deployment",category:"Traffic Management",difficulty:"Medium",readingTime:"8 min",
  eyebrow:"Zero-Downtime Releases via Two Environments",
  tagline:"Blue-green keeps <b>two identical production environments</b> — only one is live. You deploy the new version to the idle one, test it in isolation, then <b>flip a router</b> for an instant, atomic cutover with <b>zero downtime</b> — and roll back just as fast by flipping back.",
  pills:["Two identical <b>environments</b>","Deploy to the <b>idle</b> one","<b>Atomic</b> router cutover","<b>Instant rollback</b>"],
  overview:"<b>Blue-green deployment</b> is a release strategy that eliminates downtime and makes rollback trivial by maintaining <b>two identical production environments</b>, conventionally named <em>blue</em> and <em>green</em>. At any moment, only one (say blue) is <b>live</b> and serving all users; the other (green) is idle. To release a new version, you deploy it to the <b>idle</b> environment, run smoke tests and validation against it while real users remain safely on the live one, then perform the <b>cutover</b> by switching the router / load balancer / DNS to point at green. Because the switch is <b>atomic</b> and green is already fully warmed and tested, users experience <b>zero downtime</b>. If a problem surfaces, <b>rollback</b> is as simple and fast as flipping the router back to blue — no rebuild or redeploy required, since the old version is still running. After the release is confirmed healthy, the now-idle blue environment becomes the target for the next release (the roles alternate). The main costs are <b>doubled infrastructure</b> during the release (two full environments) and careful handling of <b>stateful concerns</b> — chiefly database schema changes, which must be <b>backward-compatible</b> so both versions can run against the same database across the cutover, and in-flight sessions/connections that need to drain. Blue-green contrasts with <b>rolling</b> deployments (gradually replace instances in place — cheaper, but a mixed-version window and slower rollback) and <b>canary</b> (shift a small percentage of traffic first — finer-grained risk control, but more complex routing).",
  problem:"Deploying a new version by replacing the running one risks downtime (the app is briefly unavailable) and slow, painful rollback (you must redeploy the old build if something breaks). Teams need to ship frequently without user-visible interruptions and with a fast, reliable escape hatch when a release goes wrong.",
  diagram,diagramCaption:"Deploy to the idle environment, validate, flip the router for an atomic cutover; flip back to roll back.",
  how:[
    "Run two identical production environments (blue = live, green = idle) behind a router/LB.",
    "Deploy the new version to the idle environment; it receives no user traffic.",
    "Smoke-test and validate the idle environment in isolation.",
    "Flip the router to the idle environment — an atomic, zero-downtime cutover.",
    "Keep the old environment warm for instant rollback; on the next release, roles swap."
  ],
  complexity:[["Environments","2 × production"],["Cutover","atomic (seconds)"],["Rollback","flip back, instant"],["DB schema","must be backward-compatible"]],
  advantages:["Zero downtime — atomic traffic switch","Instant rollback (flip back, no redeploy)","New version tested in real prod before cutover","No mixed-version window at cutover moment","Simple mental model: two envs, one router"],
  disadvantages:["Doubles infrastructure cost during releases","Database migrations must be backward-compatible","Stateful sessions/connections need draining","All-or-nothing cutover — no gradual exposure","Data stores are usually shared, complicating true isolation"],
  tradeoffs:"Blue-green trades <b>cost and all-or-nothing exposure</b> for <b>simplicity and rollback speed</b>. Compared to a <b>rolling</b> update (replace instances in place), blue-green avoids a prolonged mixed-version window and gives near-instant rollback, but it requires running <b>two full environments</b> during the release, which can be expensive at scale (mitigated by only doubling briefly, or scaling the idle env just before cutover). Compared to <b>canary</b>, blue-green is simpler to operate — one router flip versus weighted traffic and continuous metric analysis — but it's <b>all-or-nothing</b>: at cutover, 100% of users move at once, so if validation missed a problem, everyone is affected until you flip back (canary would have exposed only a small slice). The dominant real-world constraint is <b>shared state</b>: the two environments almost always share a database, so schema changes must be <b>backward- and forward-compatible</b> (expand/contract pattern) to let both versions coexist across the cutover and enable rollback; a destructive migration breaks the ability to flip back. In-flight sessions and long-lived connections also need <b>draining</b>. So blue-green is cleanest for stateless services with disciplined, additive database migrations.",
  whenNot:"Blue-green is a poor fit when doubling the environment is prohibitively expensive (very large fleets) — prefer rolling or canary there. It struggles when you truly need <b>gradual</b> exposure and per-cohort metric analysis (use canary), or when a release involves a <b>destructive, non-backward-compatible</b> schema change that prevents both versions from sharing the data store (you'd lose instant rollback). It also adds little value for internal tools where brief downtime is acceptable and a simple in-place deploy is cheaper to run.",
  sim,
  code:{
"Router cutover (weighted → flip)":`# Live traffic points at BLUE. Deploy new version to GREEN, validate, then flip.\n\n# 1) Deploy + smoke test GREEN (no user traffic)\n$ deploy v1.3 --target green\n$ smoke-test https://green.internal   # 200s? key flows pass?\n\n# 2) Atomic cutover: point the router/LB/DNS at GREEN\n$ router set-live green                # all users move at once, zero downtime\n\n# 3) Watch metrics. Problem? Instant rollback:\n$ router set-live blue                 # BLUE still warm -> immediate recovery`,
"Backward-compatible DB migration":`-- Both BLUE (old) and GREEN (new) share ONE database across the cutover,\n-- so migrations MUST be additive (expand/contract), never destructive.\n\n-- EXPAND (before deploying new code): add nullable column, both versions OK\nALTER TABLE users ADD COLUMN full_name TEXT;      -- old code ignores it\n\n-- deploy GREEN (writes full_name), flip router, confirm healthy...\n\n-- CONTRACT (only after old version is fully retired & rollback window closed)\nALTER TABLE users DROP COLUMN legacy_name;         -- safe now\n-- A destructive change up front would break rollback to BLUE.`,
"Kubernetes service selector flip":`# Two Deployments (blue, green); a Service selects one via a label.\napiVersion: v1\nkind: Service\nmetadata: { name: app }\nspec:\n  selector: { app: myapp, slot: blue }   # <-- live slot\n  ports: [{ port: 80, targetPort: 8080 }]\n\n# Cutover = patch the selector to the other slot (atomic):\n#   kubectl patch svc app -p '{"spec":{"selector":{"slot":"green"}}}'\n# Rollback = patch it back to "blue".`
  },
  realWorld:[
    ["AWS CodeDeploy / Elastic Beanstalk","Native blue-green with automatic traffic shifting & rollback."],
    ["Kubernetes","Blue-green via two Deployments and a Service selector flip."],
    ["Load balancer / DNS switch","Classic implementation by repointing the LB target group."],
    ["Spinnaker / Argo Rollouts","Deployment tooling supporting blue-green strategies."],
    ["Feature flags","Often paired to decouple deploy from release."]
  ],
  interview:[
    ["basic","What is blue-green deployment?","A release strategy using two identical production environments, blue and green, where only one is live at a time. You deploy the new version to the idle environment, test it, then switch the router so it becomes live — achieving zero downtime. If something goes wrong, you flip back to the previous environment for an instant rollback. The roles alternate on each release."],
    ["basic","How does blue-green achieve zero downtime and fast rollback?","Zero downtime comes from the atomic cutover: the new version is fully deployed and warmed in the idle environment before any traffic moves, so switching the router is instantaneous with no gap. Fast rollback comes from keeping the old environment running and unchanged — reverting is just flipping the router back, with no rebuild or redeploy needed since the previous version is still live and warm."],
    ["inter","What's the biggest challenge with blue-green, and how do you handle it?","Shared state, especially the database. Both environments usually share one database across the cutover, so schema changes must be backward- and forward-compatible using the expand/contract pattern: first add additive, non-breaking changes (nullable columns, new tables) so old and new code both work; deploy and cut over; only later remove old columns after the rollback window closes. A destructive migration up front would break the ability to roll back to the old version."],
    ["inter","Blue-green vs rolling vs canary — when would you choose each?","Blue-green: two full environments with an atomic switch — best for zero downtime and instant rollback on stateless services with additive migrations, at the cost of double infrastructure and all-or-nothing exposure. Rolling: replace instances in place gradually — cheaper (no duplicate env) but has a mixed-version window and slower rollback. Canary: shift a small % of traffic to the new version and watch metrics before full rollout — finest-grained risk control, best for high-risk changes, but the most complex routing/automation."],
    ["adv","How do you handle in-flight requests and sessions during a cutover?","Use connection draining: stop sending new requests to the old environment while letting existing ones finish before it's idled. Keep sessions externalized (shared store like Redis) so both environments can serve any user without sticky local state. For long-lived connections (WebSockets), plan graceful drain/reconnect. Ensure the new version can read data written by the old and vice versa so nothing breaks for requests straddling the switch."],
    ["adv","Can you do partial/gradual traffic shifting with blue-green?","Pure blue-green is all-or-nothing, but many implementations layer weighted routing on top — shifting, say, 10% then 50% then 100% of traffic from blue to green while monitoring — which effectively turns it into a canary. The distinction blurs in practice: the blue-green part is having two complete environments and instant rollback; adding weighted, metric-gated traffic shifting gives you canary-style gradual exposure with the blue-green rollback safety net."],
    ["sd","Design a zero-downtime deployment pipeline for a web service.","Run stateless app instances in two environments (blue/green) behind a load balancer, with sessions in Redis and additive-only DB migrations (expand/contract). CI builds and deploys to the idle environment; automated smoke/integration tests and health checks gate it. Cutover shifts the LB target (optionally weighted for canary-style ramp) with connection draining; monitor error rate and latency (SLOs). Auto-rollback (flip back) on regression. After a soak period, run contract migrations and mark the old environment as next release's target. Pair with feature flags to decouple deploy from release."]
  ],
  mistakes:["Destructive DB migrations that break rollback to the old version.","Cutting over without smoke-testing the idle environment first.","Ignoring connection draining → dropped in-flight requests.","Local/sticky sessions that don't survive the environment switch.","Forgetting the environments share data stores (not truly isolated)."],
  best:["Deploy and fully validate the idle env before any cutover.","Keep DB migrations backward-compatible (expand/contract).","Externalize sessions/state so either env can serve any user.","Automate the flip + health-gated auto-rollback.","Keep the old env warm through the rollback window; drain connections."],
  related:[["Canary Deployment","🐤","Gradual traffic shift alternative","canary.html"],["Health Checks","❤️","Gate cutover on healthy instances","health-checks.html"],["Auto-Scaling","📈","Scale envs around releases","auto-scaling.html"],["Failover","🔀","Related traffic-switching pattern","failover.html"],["High Availability","🟢","Uptime objectives","high-availability.html"],["Load Balancing","⚖️","Router that performs the flip","system-designed.html"]]
};
renderConcept(DATA);
</script>
