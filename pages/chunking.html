<head>
<meta charset="UTF-8" />

<title>Chunking — System Design Concepts</title>
<link rel="stylesheet" href="../assets/concept.css" />

<body>
<script src="../assets/concept.js"></script>
<script>
"use strict";

function arrow(parent,x1,y1,x2,y2,c){
  parent.appendChild(S("line",{x1,y1,x2,y2,stroke:c,"stroke-width":2}));
  const a=Math.atan2(y2-y1,x2-x1),h=7;
  const p1=[x2-h*Math.cos(a-0.5),y2-h*Math.sin(a-0.5)],p2=[x2-h*Math.cos(a+0.5),y2-h*Math.sin(a+0.5)];
  parent.appendChild(S("polygon",{points:x2+","+y2+" "+p1[0]+","+p1[1]+" "+p2[0]+","+p2[1],fill:c}));
}

function diagram(host){
  const svg=S("svg",{viewBox:"0 0 640 210"});host.appendChild(svg);
  const lbl=TX(320,18,"",{fill:"#c4a2ff","font-size":13,"text-anchor":"middle","font-weight":700});svg.appendChild(lbl);
  const sub=TX(320,200,"",{fill:"#8b8b93","font-size":11,"text-anchor":"middle"});svg.appendChild(sub);
  const g=S("g",{});svg.appendChild(g);
  let phase=0,timer=0,running=false,raf,last;
  function render(){g.innerHTML="";
    g.appendChild(S("rect",{x:200,y:44,width:240,height:26,rx:6,fill:"rgba(56,189,248,.2)",stroke:"#38bdf8"}));g.appendChild(TX(320,61,"📄 large file (4 GB video)",{fill:"#e4e4e7","font-size":11,"text-anchor":"middle","font-weight":700}));
    if(phase===0){for(let i=0;i<8;i++){const x=140+i*45;g.appendChild(S("rect",{x,y:100,width:38,height:30,rx:4,fill:"rgba(52,211,153,.25)",stroke:"#34d399"}));g.appendChild(TX(x+19,y0(120),"c"+(i+1),{fill:"#e4e4e7","font-size":9,"text-anchor":"middle"}));arrow(g,320,72,x+19,96,"#3a3a42");}
      function y0(v){return v;}
      lbl.textContent="split the file into fixed-size chunks (e.g. 4 MB each)";lbl.setAttribute("fill","#38bdf8");sub.textContent="each chunk is uploaded / stored / transferred independently";}
    else if(phase===1){for(let i=0;i<8;i++){const x=140+i*45;const done=i<5;const c=done?"#34d399":i===5?"#fbbf24":"#3a3a42";g.appendChild(S("rect",{x,y:100,width:38,height:30,rx:4,fill:c+"22",stroke:c}));g.appendChild(TX(x+19,118,done?"✓":i===5?"↑":"…",{fill:c,"font-size":12,"text-anchor":"middle"}));}
      g.appendChild(TX(320,170,"chunk 6 failed → retry JUST that chunk, not the whole file",{fill:"#fbbf24","font-size":10,"text-anchor":"middle"}));
      lbl.textContent="resumable & parallel: chunks upload concurrently";lbl.setAttribute("fill","#34d399");sub.textContent="a failure only re-sends one chunk; upload can pause and resume";}
    else{for(let i=0;i<8;i++){const x=140+i*45;g.appendChild(S("rect",{x,y:100,width:38,height:30,rx:4,fill:"rgba(167,139,250,.25)",stroke:"#a78bfa"}));g.appendChild(TX(x+19,118,"c"+(i+1),{fill:"#e4e4e7","font-size":9,"text-anchor":"middle"}));}
      g.appendChild(TX(320,168,"manifest: [c1,c2,c3,c4,c5,c6,c7,c8] → reassemble in order",{fill:"#a78bfa","font-size":9.5,"text-anchor":"middle"}));
      lbl.textContent="a manifest records chunk order + hashes for reassembly";lbl.setAttribute("fill","#a78bfa");sub.textContent="enables dedup, integrity checks, range reads, and CDN caching per chunk";}}
  function step(){phase=(phase+1)%3;timer=3.2;render();}
  function loop(now){if(!running)return;const dt=(now-last)/1000;last=now;timer-=dt;if(timer<=0)step();raf=requestAnimationFrame(loop);}
  const io=new IntersectionObserver(e=>{if(e[0].isIntersecting){if(!running){running=true;last=performance.now();raf=requestAnimationFrame(loop);}}else{running=false;cancelAnimationFrame(raf);}},{threshold:.15});
  io.observe(host);render();
}

function sim(root){
  root.innerHTML=`<p class="lead" style="margin-bottom:14px">Upload a large file over a flaky network. With <b>no chunking</b>, any failure restarts the whole transfer. With <b>chunking</b>, the file is split into pieces uploaded independently — so a failure only retries that one chunk, and chunks can go in <b>parallel</b>. Set the file size, chunk size, and failure rate and compare bytes actually transferred.</p>
  <div class="pg">
    <div class="pg-controls">
      <div class="pg-field"><label>File size (MB): <b id="pgFileV">100</b></label><input id="pgFile" type="range" min="20" max="500" value="100" step="20"></div>
      <div class="pg-field"><label>Chunk size (MB): <b id="pgChV">5</b></label><input id="pgCh" type="range" min="1" max="25" value="5" step="1"></div>
      <div class="pg-field"><label>Per-attempt failure rate: <b id="pgFailV">20</b>%</label><input id="pgFail" type="range" min="0" max="60" value="20" step="5"></div>
      <button class="pg-btn" id="pgGo">upload</button>
      <p style="font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.5">Smaller chunks = cheaper retries but more requests/overhead. Bigger chunks = fewer requests but each failure wastes more.</p>
    </div>
    <div class="pg-stage">
      <div class="pg-stats">
        <div class="pg-stat"><div class="k">Chunks</div><div class="v ac" id="pgN">0</div></div>
        <div class="pg-stat"><div class="k">No-chunk bytes sent</div><div class="v wa" id="pgNo">—</div></div>
        <div class="pg-stat"><div class="k">Chunked bytes sent</div><div class="v ok" id="pgYes">—</div></div>
        <div class="pg-stat"><div class="k">Waste avoided</div><div class="v" id="pgSave">—</div></div>
      </div>
      <div id="pgViz"></div>
      <div class="pg-log" id="pgLog"></div>
    </div>
  </div>`;

  const W=560,H=110;const svg=S("svg",{viewBox:"0 0 "+W+" "+H});$("pgViz").appendChild(svg);
  let chunkStates=[];
  function draw(){svg.innerHTML="";
    svg.appendChild(TX(20,16,"chunk transfer (green=ok, amber=retried, count=attempts):",{fill:"#8b8b93","font-size":9.5}));
    const n=chunkStates.length;if(!n){svg.appendChild(TX(W/2,60,"press upload",{fill:"#5b5b63","font-size":12,"text-anchor":"middle"}));return;}
    const perRow=Math.ceil(Math.sqrt(n*2.5));const bw=Math.min(40,(W-40)/perRow);
    chunkStates.forEach((s,i)=>{const x=20+(i%perRow)*(bw+3),y=26+Math.floor(i/perRow)*(bw*0.7+6);const c=s>1?"#fbbf24":"#34d399";
      svg.appendChild(S("rect",{x,y,width:bw,height:bw*0.7,rx:3,fill:c+"33",stroke:c}));
      svg.appendChild(TX(x+bw/2,y+bw*0.45,"×"+s,{fill:c,"font-size":8,"text-anchor":"middle"}));});}
  function log(m,c){const l=$("pgLog");const d=el("div",c||"",m);l.insertBefore(d,l.firstChild);while(l.children.length>22)l.removeChild(l.lastChild);}
  function go(){const file=+$("pgFile").value||100,ch=+$("pgCh").value||5,fail=(+$("pgFail").value||0)/100;
    const n=Math.ceil(file/ch);chunkStates=[];let chunkedBytes=0;
    for(let i=0;i<n;i++){let attempts=1;while(Math.random()<fail)attempts++;chunkStates.push(attempts);
      const sz=(i===n-1)?(file-ch*(n-1)):ch;chunkedBytes+=sz*attempts;}
    // no-chunk: retry whole file until one success
    let wholeAttempts=1;while(Math.random()<(1-Math.pow(1-fail,n)))wholeAttempts++;
    const noBytes=file*wholeAttempts;
    $("pgN").textContent=n;$("pgNo").textContent=noBytes+" MB";$("pgYes").textContent=Math.round(chunkedBytes)+" MB";
    const saved=noBytes-chunkedBytes;$("pgSave").textContent=(saved>0?"~"+Math.round(saved)+" MB":"—");
    draw();
    const retried=chunkStates.filter(s=>s>1).length;
    log("split into "+n+" chunks; "+retried+" needed a retry. chunked sent ~"+Math.round(chunkedBytes)+"MB vs no-chunk "+noBytes+"MB",saved>0?"ok":"ac");}
  $("pgGo").onclick=go;
  ["pgFile","pgCh","pgFail"].forEach(id=>$(id).oninput=()=>{$(id+"V").textContent=$(id).value;});
  draw();log("set file/chunk sizes and failure rate, then upload to compare wasted bytes","ac");
}

const DATA={
  badge:"🧩",title:"Chunking",category:"Storage",difficulty:"Easy",readingTime:"8 min",
  eyebrow:"Splitting Data Into Manageable Pieces",
  tagline:"Chunking breaks large data (files, uploads, streams) into smaller independent <b>pieces</b> that can be transferred, stored, cached, verified, and processed separately. It unlocks <b>resumable & parallel</b> transfers, per-chunk <b>integrity checks</b>, <b>deduplication</b>, and streaming — the backbone of large-file systems.",
  pills:["Independent <b>pieces</b>","<b>Resumable</b> + <b>parallel</b>","<b>Fixed</b> vs <b>content-defined</b>","<b>Manifest</b> reassembles"],
  overview:"<b>Chunking</b> is the practice of dividing a large piece of data into smaller, independently-handled <b>chunks</b> (also called blocks, parts, or segments). Rather than treating a 4 GB video or a huge upload as one monolithic blob, the system splits it into pieces — say 4 MB each — and manages each piece separately, along with a <b>manifest</b> that records the ordered list of chunks (and usually their hashes) so the original can be reassembled and verified. This simple idea powers a lot of large-scale storage and transfer behavior. <b>Resumable and reliable uploads/downloads</b>: if the network drops, only the failed chunk is retried, not the whole file — and a transfer can pause and resume. <b>Parallelism</b>: chunks can be uploaded/downloaded/processed concurrently, saturating bandwidth and cores (S3 multipart upload, download accelerators). <b>Deduplication and delta sync</b>: because chunks are addressed by content hash, identical chunks are stored/transferred once, and editing a file only re-sends changed chunks (rsync, Dropbox). <b>Integrity</b>: each chunk carries a checksum/hash, so corruption is detected and localized (Merkle trees over chunks let you verify efficiently). <b>Streaming</b>: media is delivered as chunks/segments so playback starts before the whole file arrives, and adaptive bitrate switches quality per segment (HLS/DASH). <b>Range reads</b>: you can fetch just the chunks you need. Two chunking strategies matter: <b>fixed-size</b> (simple, predictable, but a single inserted byte shifts all subsequent boundaries and breaks dedup matching) and <b>content-defined / variable-size</b> chunking (a rolling hash sets boundaries by content, so edits only affect nearby chunks — robust to <b>boundary shift</b>). Chunk size is the key tuning knob: smaller chunks give finer resumability and better dedup but more requests/metadata overhead; larger chunks reduce overhead but make retries and dedup coarser.",
  problem:"Large files and streams are unwieldy to move and store as single units: a transfer failure wastes the entire effort, you can't parallelize, you can't start using data until it fully arrives, and you can't detect where corruption occurred or avoid re-sending unchanged data. Chunking decomposes the problem so each piece can be transferred, retried, cached, verified, deduplicated, and processed on its own.",
  diagram,diagramCaption:"A large file is split into independent chunks; failures retry one chunk, and a manifest reassembles them.",
  how:[
    "Split the data into chunks (fixed-size or content-defined variable-size).",
    "Optionally hash each chunk for integrity and content-addressing (dedup).",
    "Transfer/store/process chunks independently — in parallel and resumably.",
    "Record an ordered manifest of chunk IDs/hashes for the whole object.",
    "Reassemble from the manifest, verifying each chunk; refetch only missing/failed/changed chunks."
  ],
  complexity:[["Chunk size","tuning knob"],["Retry cost","one chunk"],["Fixed","simple, shift-fragile"],["Content-defined","edit-robust"]],
  advantages:["Resumable transfers — retry only the failed chunk","Parallelism across chunks (bandwidth/CPU saturation)","Per-chunk integrity checks (localize corruption)","Enables dedup and delta sync (content-addressed chunks)","Streaming & range reads (use data before it fully arrives)"],
  disadvantages:["Metadata/manifest overhead per chunk","Too-small chunks → many requests, high overhead","Fixed-size chunking breaks on inserts (boundary shift)","Reassembly/ordering complexity","Read fragmentation if chunks are scattered"],
  tradeoffs:"The central tuning decision is <b>chunk size</b>, a direct trade-off between <b>granularity and overhead</b>. <b>Smaller chunks</b> give finer-grained resumability (a failure wastes less), better parallelism, and higher deduplication hit rates (more chances for a chunk to match), but multiply the number of requests, round-trips, and manifest/metadata entries — and past a point the per-chunk overhead (request headers, hashing, index size) dominates and hurts throughput. <b>Larger chunks</b> cut overhead and are efficient on reliable, high-bandwidth links, but make retries expensive (a single failure re-sends a lot), reduce dedup effectiveness, and coarsen resumability. The second trade-off is <b>fixed vs content-defined</b> boundaries: fixed-size chunking is trivial to implement and index and is fine for append-only or transfer-only use, but suffers the <b>boundary-shift problem</b> — inserting or removing bytes near the front shifts every later boundary, so no downstream chunk matches and dedup/delta-sync collapse; content-defined chunking (rolling-hash boundaries) is robust to insertions and yields far better dedup on edited data, at the cost of extra CPU to compute boundaries and variable chunk sizes that complicate storage layout. There's also a <b>locality</b> cost: splitting an object into many chunks scattered across a store fragments sequential reads (mitigated by keeping related chunks together and caching). Finally, chunking adds <b>coordination complexity</b> — you must track ordering, handle partial/duplicate chunks idempotently, and reassemble/verify — which is well worth it for large objects but pure overhead for small ones.",
  whenNot:"Chunking adds overhead that isn't justified for small objects that transfer reliably in a single request — splitting a 10 KB file wastes effort on manifests and extra round-trips. It's unnecessary on fast, reliable networks where whole-object transfer rarely fails and you don't need parallelism, dedup, or streaming. Fixed-size chunking specifically is a poor choice when data is frequently edited in the middle (use content-defined). And if strict sequential-read throughput matters more than any chunking benefit, a contiguous layout may beat a heavily chunked one.",
  sim,
  code:{
"Multipart / resumable upload":`# Split, upload parts independently (parallel + resumable), then complete.\nupload = s3.create_multipart_upload(Bucket=b, Key=k)   # get an upload id\nparts = []\nfor i, chunk in enumerate(chunker(file, size=8*MB), start=1):\n    # each part uploaded on its own; a failure retries JUST this part\n    etag = retry(lambda: s3.upload_part(Bucket=b, Key=k, PartNumber=i,\n                                        UploadId=upload.id, Body=chunk))\n    parts.append({"PartNumber": i, "ETag": etag})\n# Manifest = ordered part list; server reassembles in order:\ns3.complete_multipart_upload(Bucket=b, Key=k, UploadId=upload.id,\n                             MultipartUpload={"Parts": parts})`,
"Content-defined chunking (dedup/delta)":`# Rolling-hash boundaries so edits only change nearby chunks (not all).\ndef chunks(data, avg=8192, mn=2048, mx=65536):\n    h, start = RollingHash(), 0\n    for i, byte in enumerate(data):\n        h.roll(byte)\n        if (i - start >= mn and h.value % avg == 0) or i - start >= mx:\n            yield data[start:i+1]; start = i+1\n    if start < len(data): yield data[start:]\n# Content-address each chunk -> identical chunks stored/sent once (dedup),\n# and re-sync sends only chunks whose hash changed (delta sync, rsync).`,
"Manifest + integrity (Merkle)":`// A manifest lists ordered chunk hashes; a Merkle root verifies the whole.\nconst chunkHashes = chunks.map(sha256);          // per-chunk integrity\nconst manifest = { size, chunkSize, chunks: chunkHashes };\nconst root = merkleRoot(chunkHashes);            // verify any chunk cheaply\n\n// Download: fetch chunks (parallel), verify each hash, reassemble by order.\n// A corrupted chunk fails its hash -> refetch only that chunk.\n// Streaming: play/segment as chunks arrive (HLS/DASH .ts/.m4s segments).`
  },
  realWorld:[
    ["S3 multipart upload","Large objects uploaded as parallel, resumable parts."],
    ["HLS / MPEG-DASH","Video split into segments for adaptive streaming."],
    ["rsync / Dropbox","Content-defined chunking for delta sync (send only changes)."],
    ["BitTorrent / IPFS","Files split into content-addressed pieces/blocks."],
    ["Git / backup systems","Objects and backups stored as chunks (dedup + integrity)."]
  ],
  interview:[
    ["basic","What is chunking and why is it used?","Chunking splits large data into smaller, independently-handled pieces plus a manifest describing their order. It's used to make transfers resumable (retry only a failed chunk) and parallel, to verify integrity per chunk, to deduplicate and delta-sync (content-addressed chunks), and to stream media so playback starts before the whole file arrives. It turns an unwieldy monolithic blob into manageable units."],
    ["basic","How does chunking make uploads resumable and faster?","Because each chunk is transferred independently, a network failure only requires re-sending the affected chunk rather than restarting the entire file, and the transfer can pause and resume. Chunks can also be uploaded in parallel, saturating available bandwidth. A manifest records the chunk order so the server reassembles them correctly. This is exactly how S3 multipart upload and download accelerators work."],
    ["inter","Fixed-size vs content-defined chunking — what's the difference?","Fixed-size chunking cuts the data at regular byte offsets — simple and predictable, but inserting or deleting bytes near the start shifts every subsequent boundary, so no later chunk matches previously stored ones (breaking dedup/delta sync). Content-defined chunking uses a rolling hash to place boundaries based on content, so an edit only changes the chunk(s) around it and the rest stay identical. Content-defined is robust to boundary shift and far better for dedup, at extra CPU cost and variable chunk sizes."],
    ["inter","How do you choose chunk size?","It's a trade-off between granularity and overhead. Smaller chunks give finer resumability, better parallelism, and higher dedup hit rates, but create more requests, round-trips, and manifest metadata — and eventually per-chunk overhead dominates. Larger chunks reduce overhead and suit reliable high-bandwidth links, but make retries expensive and dedup coarser. You pick based on network reliability, object sizes, and whether dedup/streaming matter (e.g. a few MB for uploads, a few KB–MB for dedup)."],
    ["adv","How does chunking enable deduplication and delta sync?","When each chunk is addressed by its content hash, two identical chunks — within or across files — produce the same hash, so they can be stored or transferred only once (dedup). For sync, you compare the chunk hashes of the local and remote versions and transfer only the chunks whose hashes differ (delta sync), so editing a small part of a large file sends just a few chunks. Content-defined chunking is important here because it keeps unchanged regions aligned to the same chunk boundaries after edits."],
    ["adv","How does chunking relate to integrity verification and Merkle trees?","Each chunk carries a checksum/hash, so corruption is detected and localized to a single chunk that can be refetched. Building a Merkle tree over the chunk hashes gives a single root hash that represents the whole object, and lets you verify that any individual chunk belongs to the object with a small proof (the sibling hashes up the tree) instead of rehashing everything. This is used by BitTorrent, IPFS, Git, ZFS, and backup systems for efficient, tamper-evident integrity checks."],
    ["sd","Design resumable large-file upload and streaming for a media platform.","On upload, split files into chunks (a few MB) with per-chunk hashes; use a multipart/resumable protocol so parts upload in parallel and failures retry only the affected chunk, then commit a manifest (ordered chunk list + Merkle root) that the server uses to reassemble and verify. Store chunks in object storage (enabling dedup via content-addressing and range reads). For playback, transcode into segmented formats (HLS/DASH) so clients fetch small segments, start quickly, and switch bitrate per segment via CDN. Track upload state to resume interrupted uploads, verify integrity on download, and tune chunk size for the network and dedup goals."]
  ],
  mistakes:["Chunk size too small → request/metadata overhead dominates.","Chunk size too large → expensive retries and coarse dedup.","Fixed-size chunking for frequently-edited data (boundary shift).","No manifest/ordering → cannot reassemble reliably.","Ignoring per-chunk integrity, so corruption isn't localized."],
  best:["Tune chunk size to network reliability and object sizes.","Use content-defined chunking when dedup/delta sync matter.","Hash each chunk; use a manifest/Merkle root for integrity.","Upload/download chunks in parallel; retry only failed chunks.","Make chunk handling idempotent (dedupe partial/duplicate parts)."],
  related:[["Deduplication","♻️","Content-addressed chunks","deduplication.html"],["Data Compression","🗜️","Compress per chunk","compression.html"],["Merkle Tree","🌳","Verify chunks efficiently","merkle-tree.html"],["Block vs File vs Object","🧱","Where chunks are stored","block-storage.html"],["Video Streaming","🎬","Segmented media delivery","system-designed.html"],["Cloud File Storage","☁️","Chunked upload & sync","system-designed.html"]]
};
renderConcept(DATA);
</script>
