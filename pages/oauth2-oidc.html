<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OAuth2 &amp; OIDC — System Design Concepts</title>
<link rel="stylesheet" href="../assets/concept.css" />
<script src="../assets/analytics.js"></script>
</head>
<body>
<script src="../assets/concept.js"></script>
<script>
"use strict";

function arrow(parent,x1,y1,x2,y2,c){
  parent.appendChild(S("line",{x1,y1,x2,y2,stroke:c,"stroke-width":2}));
  const a=Math.atan2(y2-y1,x2-x1),h=7;
  const p1=[x2-h*Math.cos(a-0.5),y2-h*Math.sin(a-0.5)],p2=[x2-h*Math.cos(a+0.5),y2-h*Math.sin(a+0.5)];
  parent.appendChild(S("polygon",{points:x2+","+y2+" "+p1[0]+","+p1[1]+" "+p2[0]+","+p2[1],fill:c}));
}

function diagram(host){
  const svg=S("svg",{viewBox:"0 0 660 210"});host.appendChild(svg);
  const lbl=TX(330,18,"",{fill:"#c4a2ff","font-size":13,"text-anchor":"middle","font-weight":700});svg.appendChild(lbl);
  const sub=TX(330,202,"",{fill:"#8b8b93","font-size":11,"text-anchor":"middle"});svg.appendChild(sub);
  const g=S("g",{});svg.appendChild(g);
  const A={x:70,label:"🧑 user"},B={x:250,label:"🖥️ app\n(client)"},C={x:440,label:"🔑 auth server"},D={x:610,label:"📦 API\n(resource)"};
  function col(x,label,c,active){g.appendChild(S("rect",{x:x-52,y:40,width:104,height:34,rx:7,fill:c+(active?"33":"14"),stroke:c,"stroke-width":active?2.4:1.2}));label.split("\n").forEach((t,i)=>g.appendChild(TX(x,label.includes("\n")?(52+i*13):60,t,{fill:"#e4e4e7","font-size":10,"text-anchor":"middle","font-weight":700})));}
  let phase=0,timer=0,running=false,raf,last;
  const steps=[
    ["#38bdf8",B.x,C.x,"redirect to login + scopes","1 — app redirects the user to the authorization server","user authenticates there; the app never sees the password"],
    ["#fbbf24",C.x,B.x,"back with ?code=… (+PKCE)","2 — auth server returns a one-time authorization code","code goes via the browser redirect; PKCE binds it to this client"],
    ["#a78bfa",B.x,C.x,"exchange code (+secret/verifier)","3 — app exchanges the code for tokens (back-channel)","server-to-server: returns access token (+ id_token for OIDC)"],
    ["#34d399",B.x,D.x,"GET /data  Bearer access_token","4 — app calls the API with the access token","API validates the token & scopes — grants only what was consented"]
  ];
  function render(){g.innerHTML="";const s=steps[phase];
    col(A.x,A.label,"#38bdf8",false);col(B.x,B.label,"#38bdf8",s[1]===B.x||s[2]===B.x);col(C.x,C.label,"#fbbf24",s[1]===C.x||s[2]===C.x);col(D.x,D.label,"#34d399",s[2]===D.x);
    const y=110;arrow(g,s[1]+ (s[2]>s[1]?52:-52),y,s[2]+(s[2]>s[1]?-52:52),y,s[0]);
    g.appendChild(TX((s[1]+s[2])/2,y-8,s[3],{fill:s[0],"font-size":8.5,"text-anchor":"middle"}));
    lbl.textContent=s[4];lbl.setAttribute("fill",s[0]);sub.textContent=s[5];}
  function step(){phase=(phase+1)%steps.length;timer=3.2;render();}
  function loop(now){if(!running)return;const dt=(now-last)/1000;last=now;timer-=dt;if(timer<=0)step();raf=requestAnimationFrame(loop);}
  const io=new IntersectionObserver(e=>{if(e[0].isIntersecting){if(!running){running=true;last=performance.now();raf=requestAnimationFrame(loop);}}else{running=false;cancelAnimationFrame(raf);}},{threshold:.15});
  io.observe(host);render();
}

function sim(root){
  root.innerHTML=`<p class="lead" style="margin-bottom:14px">Step through the <b>OAuth 2.0 Authorization Code flow with PKCE</b> — the recommended flow for web/mobile/SPA apps. Notice the key idea: the app gets a <b>delegated access token</b> scoped to exactly what the user consented to, and it <b>never sees the user's password</b>. Add <b>OIDC</b> to also get an <code>id_token</code> proving <em>who</em> the user is. Advance the flow and toggle scopes/PKCE.</p>
  <div class="pg">
    <div class="pg-controls">
      <div class="pg-field"><label>Scopes requested</label>
        <label style="font-weight:400"><input type="checkbox" id="pgSprofile" checked> profile</label>
        <label style="font-weight:400"><input type="checkbox" id="pgSemail" checked> email</label>
        <label style="font-weight:400"><input type="checkbox" id="pgSpay"> payments:write</label>
      </div>
      <div class="pg-field"><label><input type="checkbox" id="pgOidc" checked> OpenID Connect (request id_token)</label></div>
      <div class="pg-field"><label><input type="checkbox" id="pgPkce" checked> PKCE (code_verifier/challenge)</label></div>
      <button class="pg-btn" id="pgNext">▶ next step</button>
      <button class="pg-btn secondary" id="pgReset">reset flow</button>
      <button class="pg-btn secondary" id="pgSteal">😈 attacker intercepts the code</button>
    </div>
    <div class="pg-stage">
      <div class="pg-stats">
        <div class="pg-stat"><div class="k">Step</div><div class="v ac" id="pgStep">0 / 4</div></div>
        <div class="pg-stat"><div class="k">Access token</div><div class="v" id="pgAt">—</div></div>
        <div class="pg-stat"><div class="k">ID token (OIDC)</div><div class="v" id="pgId">—</div></div>
        <div class="pg-stat"><div class="k">App saw password?</div><div class="v ok" id="pgPw">never</div></div>
      </div>
      <div id="pgViz"></div>
      <div class="pg-log" id="pgLog"></div>
    </div>
  </div>`;

  const W=560,H=110;const svg=S("svg",{viewBox:"0 0 "+W+" "+H});$("pgViz").appendChild(svg);
  let step=0,gotCode=false;
  const names=["","user → auth server: login","auth server → app: authorization code","app → auth server: exchange code for tokens","app → API: call with access token"];
  function scopes(){const s=[];if($("pgSprofile").checked)s.push("profile");if($("pgSemail").checked)s.push("email");if($("pgSpay").checked)s.push("payments:write");return s;}
  function draw(){svg.innerHTML="";const cols=[["🧑 user",60,"#38bdf8"],["🖥️ app",200,"#38bdf8"],["🔑 auth",360,"#fbbf24"],["📦 API",500,"#34d399"]];
    cols.forEach((c,i)=>{const active=step>0&&((step===1&&(i===0||i===2))||(step===2&&(i===1||i===2))||(step===3&&(i===1||i===2))||(step===4&&(i===1||i===3)));
      svg.appendChild(S("rect",{x:c[1]-42,y:20,width:84,height:30,rx:7,fill:c[2]+(active?"33":"14"),stroke:c[2],"stroke-width":active?2.2:1}));
      svg.appendChild(TX(c[1],40,c[0],{fill:"#e4e4e7","font-size":11,"text-anchor":"middle","font-weight":700}));});
    if(step>=1&&step<=4){const map={1:[60,360],2:[360,200],3:[200,360],4:[200,500]};const[x1,x2]=map[step];const c=step===4?"#34d399":step===2?"#fbbf24":"#a78bfa";
      arrow(svg,x1+(x2>x1?42:-42),75,x2+(x2>x1?-42:42),75,c);
      svg.appendChild(TX((x1+x2)/2,67,names[step].split(": ")[1]||"",{fill:c,"font-size":8.5,"text-anchor":"middle"}));}}
  function stats(){$("pgStep").textContent=step+" / 4";$("pgPw").textContent="never";draw();}
  function log(m,c){const l=$("pgLog");const d=el("div",c||"",m);l.insertBefore(d,l.firstChild);while(l.children.length>22)l.removeChild(l.lastChild);}
  function next(){if(step>=4){log("flow complete — app holds a scoped token; re-run or reset","ac");return;}step++;
    if(step===1){gotCode=false;log("① redirect → auth server /authorize?scope="+scopes().join("+")+(($("pgPkce").checked)?"&code_challenge=…":"")+(($("pgOidc").checked)?"&scope+=openid":""),"ac");log("   user logs in AT the auth server — app never receives the password","ok");}
    else if(step===2){gotCode=true;log("② auth server redirects back with a one-time ?code=Ab12… "+($("pgPkce").checked?"(bound to PKCE challenge)":""),"ac");}
    else if(step===3){const oidc=$("pgOidc").checked;
      log("③ back-channel: POST /token  code + "+($("pgPkce").checked?"code_verifier":"client_secret")+" → tokens returned","ac");
      $("pgAt").textContent="scoped ✓";$("pgAt").className="v ok";
      if(oidc){$("pgId").textContent="issued ✓";$("pgId").className="v ok";log("   OIDC: id_token (JWT) returned — proves the user's identity (sub, name, email)","ok");}
      else log("   no openid scope → no id_token (OAuth2 is authorization, not authentication)","wa");}
    else if(step===4){log("④ app → API: Authorization: Bearer <access_token> — scopes: "+scopes().join(", "),"ac");
      log(scopes().includes("payments:write")?"   API allows payment write (user consented to that scope)":"   API allows only "+scopes().join("/")+" — payment write NOT granted","ok");}
    stats();}
  function steal(){if(!gotCode){log("no code in flight yet — advance to step 2 first","wa");return;}
    if($("pgPkce").checked)log("😈 attacker stole the code — but WITHOUT the code_verifier the exchange FAILS (PKCE)","ok");
    else log("💀 attacker stole the code — no PKCE, so they can redeem it for tokens! (why PKCE exists)","bad");}
  $("pgNext").onclick=next;
  $("pgReset").onclick=()=>{step=0;gotCode=false;$("pgAt").textContent="—";$("pgAt").className="v";$("pgId").textContent="—";$("pgId").className="v";stats();log("flow reset — press next to begin","ac");};
  $("pgSteal").onclick=steal;
  stats();log("press ▶ next to walk through the Authorization Code + PKCE flow","ac");
}

const DATA={
  badge:"🔑",title:"OAuth 2.0 & OIDC",category:"Security",difficulty:"Hard",readingTime:"11 min",
  eyebrow:"Delegated Authorization & Identity",
  tagline:"<b>OAuth 2.0</b> lets a user grant an app <b>delegated, scoped access</b> to their resources without sharing their password — the app receives an <b>access token</b>, not credentials. <b>OpenID Connect (OIDC)</b> adds an identity layer on top, returning an <b>id_token</b> that proves <em>who</em> the user is (the basis of 'Log in with Google').",
  pills:["<b>Authorization</b>, not just login","<b>Access token</b> + <b>scopes</b>","<b>Auth Code + PKCE</b> flow","<b>OIDC</b> adds <b>id_token</b>"],
  overview:"<b>OAuth 2.0</b> is a <b>delegated authorization</b> framework: it lets a user (the <em>resource owner</em>) allow a third-party app (the <em>client</em>) to access their data on another service (the <em>resource server</em>) — without giving the app their password. Instead, an <b>authorization server</b> issues the app a scoped, time-limited <b>access token</b>. The recommended flow for interactive apps is the <b>Authorization Code flow with PKCE</b>: (1) the app redirects the user to the authorization server, where they authenticate and consent to specific <b>scopes</b>; (2) the server redirects back with a one-time <b>authorization code</b>; (3) the app exchanges that code — plus a secret or a PKCE <b>code_verifier</b> — for tokens over a secure back channel; (4) the app calls the API with <code>Authorization: Bearer &lt;access_token&gt;</code>, and the API grants only the consented scopes. <b>PKCE</b> (Proof Key for Code Exchange) binds the code to the app instance so an intercepted code is useless — essential for public clients (SPAs, mobile). Crucially, OAuth 2.0 is about <b>authorization</b> (what an app may do), not <b>authentication</b> (who the user is). <b>OpenID Connect</b> layers authentication on top: by adding the <code>openid</code> scope, the app also receives an <b>id_token</b> — a signed JWT with verified identity claims (<code>sub</code>, name, email) — which is what powers 'Sign in with Google/Apple/Microsoft.' Tokens are typically short-lived <b>access tokens</b> paired with longer-lived <b>refresh tokens</b> to obtain new ones without re-prompting.",
  problem:"Users want to let apps act on their behalf (read your calendar, post on your feed, charge a card) — but handing over your password is catastrophic: the app gets unlimited, non-revocable, un-scoped access forever. OAuth solves this by letting the user delegate narrow, revocable, expiring access via a trusted authorization server, so the app never sees the password and gets only the specific permissions consented to. OIDC then provides a standard, secure way to also learn who the user is.",
  diagram,diagramCaption:"Authorization Code + PKCE: redirect, code, back-channel token exchange, then scoped API access.",
  how:[
    "Client redirects the user to the authorization server with requested scopes (and PKCE challenge).",
    "User authenticates and consents there; the app never handles the password.",
    "Auth server redirects back with a one-time authorization code.",
    "Client exchanges the code (+ secret or PKCE verifier) for an access token — and an id_token if OIDC.",
    "Client calls the resource API with the bearer access token; the API enforces the granted scopes; refresh tokens renew access."
  ],
  complexity:[["Access token TTL","short (mins)"],["Refresh token","longer, revocable"],["PKCE","public clients"],["OIDC token","signed JWT id_token"]],
  advantages:["App never sees the user's password (delegation)","Scoped, least-privilege access with user consent","Tokens are revocable and expire (limited blast radius)","PKCE secures public clients (SPA/mobile)","OIDC gives standardized, federated identity (SSO)"],
  disadvantages:["Complex, many flows/params — easy to misconfigure","Bearer tokens are stealable if not protected/short-lived","Redirect URIs, state, PKCE must be validated correctly","Access tokens can't be revoked mid-life (like JWTs)","Confusing OAuth (authz) with OIDC (authn) causes vulns"],
  tradeoffs:"OAuth/OIDC trade <b>simplicity for safety and flexibility</b>. Compared to just handing over a password or a static API key, the flow is far more secure (delegated, scoped, revocable, expiring) but also far more <b>complex</b> — multiple grant types, redirect URIs, the <code>state</code> parameter (CSRF protection), PKCE, token endpoints — and most real-world vulnerabilities come from <b>misconfiguration</b> (open redirect URIs, missing state/PKCE, accepting the wrong token). A key design tension is <b>token lifetime</b>: like any bearer token, an access token is a 'whoever-holds-it-wins' credential, so short TTLs limit theft damage but force refreshes; the standard resolution is short-lived access tokens plus a longer-lived, <b>revocable</b> refresh token (ideally rotated). Choosing where to run the flow matters too: <b>confidential clients</b> (server-side) can safely hold a client secret; <b>public clients</b> (SPA/mobile) can't, so PKCE replaces the secret to prevent code interception. Finally, a subtle but critical trade-off is <b>authorization vs authentication</b>: OAuth alone tells you an app may access a resource, not who the user is — using an access token as proof of identity is a classic flaw, which is exactly why OIDC's dedicated, audience-bound id_token exists.",
  whenNot:"Don't reach for OAuth when a simpler model fits: first-party login to your own single app is often better served by plain session management; pure server-to-server/machine access is the <b>client credentials</b> grant (no user, no redirect) or an API key/mTLS. Avoid the deprecated <b>implicit</b> and <b>resource owner password</b> grants entirely. And never use OAuth 2.0 by itself to authenticate users (treating an access token as identity) — use OIDC's id_token for that. If you don't need delegation across parties, the overhead of a full OAuth stack may not be worth it.",
  sim,
  code:{
"Authorization Code + PKCE":`// 1) Client creates a PKCE pair and redirects the user to /authorize\ncode_verifier  = random(64)                       // kept secret by the app\ncode_challenge = base64url(sha256(code_verifier))\n\nGET https://auth.example.com/authorize?\n    response_type=code&\n    client_id=APP&\n    redirect_uri=https://app/cb&\n    scope=openid profile email&                   // openid -> OIDC id_token\n    state=xyz&                                     // CSRF protection\n    code_challenge=CHALLENGE&code_challenge_method=S256\n\n// 2) User logs in + consents -> auth server redirects back:\n//    https://app/cb?code=ONE_TIME_CODE&state=xyz   (verify state!)`,
"Exchange code for tokens":`// 3) Back-channel POST — proves possession of the verifier (no interception replay)\nPOST https://auth.example.com/token\n  grant_type=authorization_code&\n  code=ONE_TIME_CODE&\n  redirect_uri=https://app/cb&\n  client_id=APP&\n  code_verifier=code_verifier          // PKCE: server re-derives the challenge\n\n// Response:\n{\n  "access_token": "eyJ...",     // call the API with this (Bearer), short TTL\n  "id_token":     "eyJ...",     // OIDC: signed JWT identity (sub, email, ...)\n  "refresh_token":"def...",     // get new access tokens without re-login\n  "expires_in": 900, "token_type": "Bearer"\n}`,
"Use & verify tokens":`// 4) Call the resource API with the access token\nGET https://api.example.com/me\nAuthorization: Bearer eyJ...           // API checks signature/introspect + scopes\n\n// OIDC id_token verification (identity) — do NOT skip these:\nverify(id_token.signature, jwks)       // signed by the IdP\nassert id_token.iss  === "https://auth.example.com"   // issuer\nassert id_token.aud  === "APP"                        // audience = your client\nassert id_token.exp  >  now && id_token.nonce === sent_nonce\nuserId = id_token.sub                  // stable user identifier`
  },
  realWorld:[
    ["Sign in with Google / Apple / Microsoft","Consumer SSO built on OIDC on top of OAuth 2.0."],
    ["Okta / Auth0 / Keycloak / Cognito","Identity providers implementing OAuth2 + OIDC."],
    ["GitHub / Slack app authorizations","Third-party apps get scoped API access via OAuth."],
    ["Mobile & SPA apps","Authorization Code + PKCE is the recommended flow."],
    ["Enterprise SSO","OIDC (and SAML) federate identity across many apps."]
  ],
  interview:[
    ["basic","What problem does OAuth 2.0 solve?","It lets a user grant a third-party app limited, scoped access to their resources on another service without sharing their password. Instead of credentials, the app receives a short-lived access token restricted to consented scopes. This means the app never sees the password, access is least-privilege, and it can be revoked and expires — unlike handing over a password."],
    ["basic","What's the difference between OAuth 2.0 and OpenID Connect?","OAuth 2.0 is about authorization — granting an app permission (scopes) to access resources; it deliberately says nothing about who the user is. OpenID Connect is an identity layer on top of OAuth 2.0: by adding the openid scope, the app also gets an id_token (a signed JWT with identity claims like sub, name, email), providing standardized authentication. In short: OAuth = what an app can do, OIDC = who the user is."],
    ["inter","Walk through the Authorization Code flow with PKCE.","The client redirects the user to the authorization server with the requested scopes, a state value, and a PKCE code_challenge. The user authenticates and consents there. The server redirects back with a one-time authorization code. The client then POSTs that code plus the PKCE code_verifier (and client secret if confidential) to the token endpoint over the back channel, receiving an access token (and id_token for OIDC). Finally the client calls the API with the bearer access token."],
    ["inter","What is PKCE and why is it needed?","PKCE (Proof Key for Code Exchange) protects the authorization code from interception. The client generates a random code_verifier and sends its hash (code_challenge) on the initial request; at token exchange it sends the original verifier, which the server hashes and compares. This binds the code to the specific client instance, so an attacker who intercepts the code can't redeem it without the verifier. It's essential for public clients (SPAs, mobile) that can't safely hold a client secret."],
    ["adv","Why shouldn't you use an OAuth access token to authenticate the user?","Because an access token proves an app is authorized to access a resource — not who the user is, and it isn't audience-bound to your client. Accepting a token that was minted for a different app (the 'confused deputy'/token substitution problem) can let an attacker impersonate a user. OIDC solves this with a dedicated id_token that has an audience (aud) claim you must verify equals your client, plus issuer, expiry, and nonce checks — that's the correct way to authenticate."],
    ["adv","How are access tokens and refresh tokens used together, and how do you handle revocation?","Access tokens are short-lived bearer credentials sent to APIs; keeping them short limits the damage if stolen, and like JWTs they generally can't be revoked mid-life. Refresh tokens are longer-lived and used only against the token endpoint to obtain new access tokens without re-prompting the user. Refresh tokens are stored server-side/securely, are revocable, and should be rotated on each use (with reuse detection) so a leaked refresh token can be detected and invalidated. For emergency access-token revocation you rely on short TTLs or token introspection/denylists."],
    ["sd","Design authentication and API authorization for a web + mobile product using OAuth/OIDC.","Use an identity provider (Auth0/Okta/Keycloak/Cognito) with the Authorization Code + PKCE flow for both SPA and mobile. Request openid plus the minimal scopes; validate state and PKCE, and verify the id_token (signature via JWKS, iss, aud, exp, nonce) for login. Issue short-lived access tokens with fine-grained scopes for the API, plus rotating refresh tokens stored securely (HttpOnly cookie or secure storage). APIs validate the bearer token (signature/introspection) and enforce scopes. Add SSO across apps via OIDC, centralized logout, token revocation, and least-privilege scopes per client."]
  ],
  mistakes:["Using OAuth access tokens as proof of identity instead of an OIDC id_token.","Not validating the state parameter (CSRF on the redirect).","Skipping PKCE for SPA/mobile (public) clients.","Overly-broad scopes or wildcard/unregistered redirect URIs.","Not verifying id_token aud/iss/exp/signature — accepting forged/foreign tokens."],
  best:["Use Authorization Code + PKCE; avoid implicit & password grants.","Request least-privilege scopes; validate state and exact redirect URIs.","Verify id_token signature, iss, aud, exp, and nonce for authentication.","Keep access tokens short-lived; use rotating, revocable refresh tokens.","Store tokens securely (HttpOnly cookies / secure storage); support revocation & logout."],
  related:[["Session Management","🎫","Tokens vs server sessions","session-management.html"],["CSRF","🎭","state param defends the redirect","csrf.html"],["XSS","💉","Can steal bearer tokens","xss.html"],["Secrets Management","🔐","Protect client secrets/keys","secrets-management.html"],["REST API","🌐","Where bearer tokens are used","rest.html"],["TLS Handshake","🔒","Secures token transport","tls-handshake.html"]]
};
renderConcept(DATA);
</script>
