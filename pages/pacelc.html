<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PACELC Theorem — System Design Concepts</title>
<link rel="stylesheet" href="../assets/concept.css" />
</head>
<body>
<script src="../assets/concept.js"></script>
<script>
"use strict";

function diagram(host){
  const svg=S("svg",{viewBox:"0 0 620 200"});host.appendChild(svg);
  const lbl=TX(310,22,"",{fill:"#c4a2ff","font-size":13,"text-anchor":"middle","font-weight":700});svg.appendChild(lbl);
  const sub=TX(310,186,"",{fill:"#8b8b93","font-size":11,"text-anchor":"middle"});svg.appendChild(sub);
  function pill(x,txt,fill){const g=S("g",{});svg.appendChild(g);const w=118;
    g.appendChild(S("rect",{x:x-w/2,y:70,width:w,height:44,rx:8,fill:fill||"#161619",stroke:"#3a3a42"}));
    g.appendChild(TX(x,90,txt.split("|")[0],{fill:"#e4e4e7","font-size":12,"text-anchor":"middle","font-weight":700}));
    g.appendChild(TX(x,106,txt.split("|")[1],{fill:"#8b8b93","font-size":9.5,"text-anchor":"middle"}));return g;}
  let phase=0,timer=0,running=false,raf,last;
  function render(){svg.querySelectorAll("g,line").forEach(n=>n.remove());
    if(phase===0){lbl.textContent="IF there is a Partition (P) …";lbl.setAttribute("fill","#f87171");
      pill(180,"Availability|answer, maybe stale","rgba(52,211,153,.16)");pill(440,"Consistency|error, stay correct","rgba(248,113,113,.16)");
      svg.appendChild(TX(310,150,"choose A or C",{fill:"#8b8b93","font-size":11,"text-anchor":"middle"}));sub.textContent="a network split forces a choice — same as CAP";}
    else{lbl.textContent="ELSE (E), normal operation …";lbl.setAttribute("fill","#34d399");
      pill(180,"Latency|reply fast, maybe stale","rgba(56,189,248,.16)");pill(440,"Consistency|wait, confirm latest","rgba(124,58,237,.2)");
      svg.appendChild(TX(310,150,"choose L or C",{fill:"#8b8b93","font-size":11,"text-anchor":"middle"}));sub.textContent="even with no partition, you still trade latency vs consistency";}}
  function step(){phase=(phase+1)%2;timer=2.6;render();}
  function loop(now){if(!running)return;const dt=(now-last)/1000;last=now;timer-=dt;if(timer<=0)step();raf=requestAnimationFrame(loop);}
  const io=new IntersectionObserver(e=>{if(e[0].isIntersecting){if(!running){running=true;last=performance.now();raf=requestAnimationFrame(loop);}}else{running=false;cancelAnimationFrame(raf);}},{threshold:.15});
  io.observe(host);render();
}

function sim(holder){
  holder.innerHTML=`<p class="lead" style="margin-bottom:14px">Pick a database and fire a read. Toggle a network partition to see the <b>P→A/C</b> choice, and note that <b>even with no partition</b> the system still makes the <b>E→L/C</b> latency-vs-consistency trade-off. Each real system sits in one PACELC quadrant.</p>
  <div class="pg">
    <div class="pg-controls">
      <div class="pg-field"><label>System</label>
        <select id="pgSys">
          <option value="PA/EL">Cassandra / Dynamo (PA/EL)</option>
          <option value="PA/EC">MongoDB default (PA/EC)</option>
          <option value="PC/EC">Spanner / VoltDB (PC/EC)</option>
          <option value="PC/EL">PNUTS / some HBase (PC/EL)</option>
        </select></div>
      <div class="pg-field"><label>Network partition <b id="pgPV">off</b></label>
        <div class="pg-btns"><button id="pgPart">Toggle partition</button></div></div>
      <div class="pg-btns" style="margin-top:4px"><button id="pgRead" class="go">Read key</button><button id="pgWrite">Write key</button></div>
      <p style="font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.5">PACELC = "if Partition then A or C, Else L or C." It extends CAP by naming the everyday latency/consistency trade-off CAP ignores.</p>
    </div>
    <div class="pg-stage">
      <div class="pg-stats">
        <div class="pg-stat"><div class="k">Partition</div><div class="v" id="pgP">no</div></div>
        <div class="pg-stat"><div class="k">Active branch</div><div class="v ac" id="pgBranch">E (else)</div></div>
        <div class="pg-stat"><div class="k">Behaviour</div><div class="v ok" id="pgBeh">Latency</div></div>
        <div class="pg-stat"><div class="k">Last read</div><div class="v wa" id="pgResult">—</div></div>
      </div>
      <div id="pgViz"></div>
      <div class="pg-log" id="pgLog"></div>
    </div>
  </div>`;

  const W=560,H=250;const svg=S("svg",{viewBox:"0 0 "+W+" "+H});$("pgViz").appendChild(svg);
  let partition=false, latest="v1", replicated="v1";
  const nodes=[{x:120,y:80,side:0},{x:120,y:180,side:0},{x:440,y:130,side:1}];
  const client={x:290,y:20};
  function draw(msg,color){svg.innerHTML="";
    if(partition)svg.appendChild(S("line",{x1:290,y1:40,x2:290,y2:H-10,stroke:"#f87171","stroke-width":2.5,"stroke-dasharray":"7 5"}));
    // links
    if(!partition){nodes.forEach(n=>svg.appendChild(S("line",{x1:client.x,y1:client.y+8,x2:n.x,y2:n.y,stroke:"#2f3742","stroke-width":1})));}
    svg.appendChild(S("rect",{x:client.x-34,y:client.y-6,width:68,height:26,rx:6,fill:"rgba(124,58,237,.2)",stroke:"#7C3AED"}));
    svg.appendChild(TX(client.x,client.y+11,"client",{fill:"#e4e4e7","font-size":11,"text-anchor":"middle"}));
    nodes.forEach((n,i)=>{const reach=!partition||n.side===0;
      svg.appendChild(S("circle",{cx:n.x,cy:n.y,r:26,fill:reach?"rgba(52,211,153,.14)":"rgba(248,113,113,.12)",stroke:reach?"#34d399":"#f87171","stroke-width":2}));
      svg.appendChild(TX(n.x,n.y-2,"node "+(i+1),{fill:"#e4e4e7","font-size":10,"text-anchor":"middle"}));
      svg.appendChild(TX(n.x,n.y+13,(n.side===0?latest:replicated),{fill:"#8b8b93","font-size":10,"text-anchor":"middle"}));});
    if(msg)svg.appendChild(TX(W/2,H-6,msg,{fill:color||"#8b8b93","font-size":12,"text-anchor":"middle","font-weight":700}));}
  function cfg(){return $("pgSys").value||"PA/EL";}
  function status(){const[p,e]=cfg().split("/");$("pgP").textContent=partition?"yes":"no";$("pgP").className="v"+(partition?" bad":"");
    $("pgBranch").textContent=partition?"P (partition)":"E (else)";
    const choice=partition?p[1]:e[1];const kind=choice==="A"?"Availability":choice==="C"?"Consistency":choice==="L"?"Latency":"?";
    $("pgBeh").textContent=kind;$("pgBeh").className="v "+(kind==="Consistency"?"ac":"ok");}
  function log(m,c){const l=$("pgLog");const d=el("div",c||"",m);l.insertBefore(d,l.firstChild);while(l.children.length>20)l.removeChild(l.lastChild);}
  function write(){latest="v"+(parseInt(latest.slice(1))+1);if(!partition){replicated=latest;log("write → "+latest+" (replicated to all)","ok");}
    else{log("write → "+latest+" on majority side; node 3 is isolated (stale)","wa");}draw("write "+latest,"#c4a2ff");status();}
  function read(){const[p,e]=cfg().split("/");
    if(partition){ // read from isolated minority (node 3)
      if(p==="A"){$("pgResult").textContent=replicated+" (stale)";log("PARTITION + PA → node 3 answers with STALE "+replicated+" (available)","wa");draw("PA: available but stale ("+replicated+")","#fbbf24");}
      else{$("pgResult").textContent="ERROR";log("PARTITION + PC → node 3 refuses (not in majority) → error, stays correct","bad");draw("PC: unavailable to stay consistent","#f87171");}
    } else {
      if(e==="L"){$("pgResult").textContent=latest+" (fast)";log("no partition + EL → nearest replica answers FAST (may be slightly stale)","ok");draw("EL: fast local read","#38bdf8");}
      else{$("pgResult").textContent=latest+" (confirmed)";log("no partition + EC → coordinate quorum, return CONFIRMED latest (higher latency)","ac");draw("EC: confirmed latest, slower","#7C3AED");}
    }status();}
  $("pgPart").onclick=()=>{partition=!partition;$("pgPV").textContent=partition?"on":"off";log(partition?"⚡ network partition — node 3 isolated":"partition healed","ac");draw();status();};
  $("pgRead").onclick=read;$("pgWrite").onclick=write;$("pgSys").onchange=()=>{log("system → "+cfg(),"ac");status();};
  draw();status();log("pick a system and read/write; toggle a partition","ac");
}

const DATA={
  badge:"🔀",title:"PACELC Theorem",category:"Distributed Systems",difficulty:"Medium",readingTime:"7 min",
  eyebrow:"Consistency Trade-off Model",
  tagline:"An extension of CAP: <b>if Partition (P)</b> a system trades Availability vs Consistency, <b>Else (E)</b> — in normal operation — it still trades <b>Latency vs Consistency</b>. It captures the everyday trade-off CAP ignores.",
  pills:["<b>P →</b> A or C","<b>E →</b> L or C","<b>Extends</b> CAP","<b>Classifies</b> real DBs"],
  overview:"CAP only talks about behavior <i>during</i> a network partition, which is rare. PACELC (Abadi, 2010) adds the common case: <b>even when the network is healthy</b>, a distributed database must choose between low <b>Latency</b> and strong <b>Consistency</b>, because confirming that a read reflects the latest write requires coordinating replicas (which costs time). So every system has two labels: what it does under Partition (A or C) and what it does Else (L or C) — e.g., Cassandra is PA/EL (stays available under partition, favors latency normally), while Google Spanner is PC/EC (favors consistency in both regimes).",
  problem:"CAP misleads people into thinking consistency only costs something during partitions. In reality, strong consistency has a constant latency price because replicas must coordinate on every read/write. PACELC makes that always-present latency-vs-consistency trade-off explicit, giving a more honest way to classify and choose databases.",
  diagram,diagramCaption:"Two branches: the partition branch (A vs C) and the normal branch (L vs C) — every system picks one of each.",
  how:[
    "Ask: what happens during a network partition? Stay Available (serve possibly-stale data) or stay Consistent (reject requests)? → P side is A or C.",
    "Ask: what happens with no partition? Reply with low Latency (from the nearest replica, maybe slightly stale) or enforce Consistency (coordinate replicas, higher latency)? → E side is L or C.",
    "Combine into a label like PA/EL, PC/EC, PA/EC, or PC/EL.",
    "Strong consistency in the E branch means every read confirms it sees the latest write via quorum/leader coordination.",
    "Latency in the E branch means reads/writes complete without waiting for global agreement."
  ],
  complexity:[["Regimes","Partition + Else"],["P choices","A or C"],["E choices","L or C"],["Combos","4 labels"]],
  advantages:["Names the everyday latency/consistency trade-off","More complete than CAP","Great for classifying and comparing databases","Guides tunable-consistency decisions"],
  disadvantages:["Still a simplification (consistency is a spectrum)","Doesn't quantify how much latency/staleness","Labels vary by configuration, not fixed","No guidance on availability degrees"],
  tradeoffs:"The core tension is coordination cost: strong consistency (C in either branch) requires replicas to agree before responding, adding round trips and reducing availability under failure. Choosing L/A reduces latency and increases availability but exposes stale reads and conflict resolution. Many systems are tunable (Cassandra/Dynamo let you pick consistency level per query), so their PACELC label depends on configuration — you're really choosing a point on a spectrum per operation.",
  whenNot:"PACELC is a mental model, not a runtime mechanism — 'don't use it' doesn't apply. But don't over-rely on the labels: they're coarse. For real decisions, measure actual staleness bounds, quorum settings, and latency SLAs rather than trusting a two-letter tag.",
  simIntro:"",
  sim,
  code:{
"Cassandra":`-- Cassandra is PA/EL by default, but consistency is tunable per query.\n-- Favor latency (EL): read from one replica (may be stale)\nSELECT * FROM users WHERE id = 42;                 -- CL = ONE\n-- Favor consistency (move toward EC): require a quorum\nCONSISTENCY QUORUM;\nSELECT * FROM users WHERE id = 42;   -- reads confirmed by majority\n-- strong read-your-writes: R + W > N\n-- write QUORUM + read QUORUM on RF=3  ->  2 + 2 > 3`,
"MongoDB":`// MongoDB: choose read/write concern to slide along PACELC\n// EL-ish: fast, may read stale from a secondary\ndb.users.find({_id: 42}).readPref("secondaryPreferred")\n// EC / PC-ish: majority write + linearizable read = confirmed latest\ndb.users.updateOne({_id:42}, {$set:{x:1}}, {writeConcern:{w:"majority"}})\ndb.users.find({_id:42}).readConcern("linearizable")   // slower, correct`,
"Labels":`# PACELC classification of common systems\n# label = (during Partition) / (Else, normal operation)\nDynamoDB / Cassandra / Riak ....... PA/EL   # available + low latency\nCosmos DB (tunable) ............... PA/EL .. PC/EC\nMongoDB (defaults) ................ PA/EC   # available, but consistent when up\nGoogle Spanner / VoltDB ........... PC/EC   # consistency in both regimes\nPNUTS (Yahoo) ..................... PC/EL   # consistent under partition, low latency else`
  },
  realWorld:[
    ["Cassandra / DynamoDB (PA/EL)","Stay available and fast; accept eventual consistency and conflict resolution — chosen for high-write, always-on workloads."],
    ["Google Spanner (PC/EC)","TrueTime + Paxos give strong consistency in both regimes, paying latency for globally correct transactions."],
    ["MongoDB (PA/EC)","Available under partition on secondaries, but with majority concerns behaves consistently when healthy."],
    ["Cosmos DB (tunable)","Five consistency levels let you pick a PACELC point per workload, from strong to eventual."],
    ["PNUTS (Yahoo, PC/EL)","Prioritized low latency in normal operation while keeping per-record timeline consistency."]
  ],
  interview:[
    ["basic","What does PACELC stand for?","If there is a Partition (P), a system chooses between Availability (A) and Consistency (C); Else (E), in normal operation, it chooses between Latency (L) and Consistency (C). It's written as a label like PA/EL."],
    ["basic","How is PACELC different from CAP?","CAP only describes behavior during a partition. PACELC adds the far more common no-partition case, pointing out that even a healthy system trades latency for consistency because confirming the latest value requires replica coordination."],
    ["inter","Why does strong consistency cost latency even without partitions?","To guarantee a read reflects the latest write, replicas must coordinate — via a leader or a quorum — which adds network round trips. That coordination is unavoidable overhead present in normal operation, not just during failures, which is exactly the 'ELC' the theorem highlights."],
    ["inter","Give PACELC labels for Cassandra and Spanner.","Cassandra is PA/EL: during a partition it stays available (serving possibly-stale data), and normally it favors low latency over strong consistency (tunable). Spanner is PC/EC: it favors consistency during partitions (may become unavailable) and enforces consistency normally, paying latency via TrueTime + Paxos."],
    ["adv","Is a system's PACELC label fixed?","Not necessarily. Many systems expose tunable consistency (Cassandra/Dynamo consistency levels, Cosmos DB's five levels, MongoDB read/write concerns), so the effective label depends on per-operation configuration. You're really choosing a point on a spectrum, often differently for different queries."],
    ["adv","How does quorum tuning (R, W, N) map onto PACELC?","With N replicas, requiring R+W>N gives strong (read-your-writes) consistency — pushing you toward the C choices at the cost of latency and reduced availability if nodes are down. Small R and W (e.g., R=W=1) favor L and A but risk stale reads and conflicts. Quorum settings are the concrete knob that positions you in PACELC."],
    ["sd","How would you use PACELC when choosing a datastore?","Decide the partition-time requirement (must it stay available, or must it never serve stale/incorrect data?) and the normal-time requirement (is p99 latency or strict freshness more important?). Map those to a PACELC label, then pick a database (or a per-query consistency level) that matches — e.g., PA/EL for a social feed, PC/EC for payments/ledgers."]
  ],
  mistakes:["Believing consistency only costs something during partitions (the CAP misconception PACELC fixes).","Treating a system's label as immutable when consistency is often tunable.","Assuming 'CP' or 'C' means zero staleness everywhere regardless of config.","Ignoring the latency SLA impact of majority/linearizable reads.","Picking strong consistency globally when only a few operations truly need it."],
  best:["Classify each workload's partition-time and normal-time needs separately.","Use tunable consistency per operation instead of one global setting.","Reserve strong consistency (EC) for correctness-critical paths (payments, inventory).","Measure real staleness and latency, don't rely on labels alone.","Prefer read-your-writes/session guarantees where full linearizability is overkill."],
  related:[["CAP Theorem","🔺","The model PACELC extends","system-designed.html"],["Quorum","🗳️","R + W > N tuning","quorum.html"],["Consensus / Raft","🧭","Coordination for consistency","consensus-raft.html"],["Replication","📑","Where the trade-off lives","system-designed.html"],["Vector Clocks","🕰️","Track causality","vector-clocks.html"],["System Design Lab","🎓","All concepts","system-designed.html"]]
};
renderConcept(DATA);
</script>
