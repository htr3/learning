<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>REST API — System Design Concepts</title>
<link rel="stylesheet" href="../assets/concept.css" />
<script src="../assets/analytics.js"></script>
</head>
<body>
<script src="../assets/concept.js"></script>
<script>
"use strict";

function diagram(host){
  const svg=S("svg",{viewBox:"0 0 620 200"});host.appendChild(svg);
  const lbl=TX(310,18,"",{fill:"#c4a2ff","font-size":13,"text-anchor":"middle","font-weight":700});svg.appendChild(lbl);
  const sub=TX(310,190,"",{fill:"#8b8b93","font-size":11,"text-anchor":"middle"});svg.appendChild(sub);
  const g=S("g",{});svg.appendChild(g);
  const rows=[["GET","/users/42","200 OK","#34d399"],["POST","/users","201 Created","#38bdf8"],["PUT","/users/42","200 OK","#fbbf24"],["DELETE","/users/42","204 No Content","#f87171"]];
  let phase=0,timer=0,running=false,raf,last;
  function box(x,y,w,txt,fill,stroke){g.appendChild(S("rect",{x:x-w/2,y:y-19,width:w,height:38,rx:8,fill:fill,stroke:stroke,"stroke-width":2}));
    const t=S("text",{x:x,y:y+4,fill:"#e4e4e7","font-size":11,"text-anchor":"middle"});t.textContent=txt;g.appendChild(t);}
  function render(){g.innerHTML="";
    box(90,100,110,"Client","#161619","#3a3a42");box(530,100,110,"REST API","rgba(124,58,237,.2)","#7C3AED");
    const r=rows[phase];
    g.appendChild(S("line",{x1:148,y1:82,x2:472,y2:82,stroke:r[3],"stroke-width":2,"marker-end":"url(#a)"}));
    const rt=S("text",{x:310,y:74,fill:r[3],"font-size":12,"text-anchor":"middle","font-weight":700});rt.textContent=r[0]+" "+r[1];g.appendChild(rt);
    g.appendChild(S("line",{x1:472,y1:120,x2:148,y2:120,stroke:"#8b8b93","stroke-width":1.6,"stroke-dasharray":"5 4","marker-end":"url(#a)"}));
    const st=S("text",{x:310,y:138,fill:"#8b8b93","font-size":11,"text-anchor":"middle"});st.textContent=r[2];g.appendChild(st);
    lbl.textContent="uniform interface: verbs + resource URIs";lbl.setAttribute("fill","#c4a2ff");
    sub.textContent="stateless: every request carries all context; the server stores no session";}
  function step(){phase=(phase+1)%rows.length;timer=2;render();}
  function loop(now){if(!running)return;const dt=(now-last)/1000;last=now;timer-=dt;if(timer<=0)step();raf=requestAnimationFrame(loop);}
  const io=new IntersectionObserver(e=>{if(e[0].isIntersecting){if(!running){running=true;last=performance.now();raf=requestAnimationFrame(loop);}}else{running=false;cancelAnimationFrame(raf);}},{threshold:.15});
  io.observe(host);render();
}

function sim(root){
  root.innerHTML=`<p class="lead" style="margin-bottom:14px">A live REST resource — a <code>/users</code> collection. Fire requests and watch the resource state, HTTP status codes, and idempotency: <b>GET</b> is safe, <b>PUT/DELETE</b> are idempotent (repeat = same result), while <b>POST</b> creates a new row every time. Each request is fully self-contained (stateless).</p>
  <div class="pg">
    <div class="pg-controls">
      <div class="pg-field"><label>User id</label><input id="pgId" type="number" value="1" min="1" style="width:80px"></div>
      <div class="pg-btns"><button id="pgGet" class="go">GET /users/:id</button><button id="pgList">GET /users</button></div>
      <div class="pg-btns" style="margin-top:6px"><button id="pgPost" class="go">POST /users</button></div>
      <div class="pg-btns" style="margin-top:6px"><button id="pgPut">PUT /users/:id</button><button id="pgDel">DELETE /users/:id</button></div>
      <div class="pg-btns" style="margin-top:10px"><button id="pgReset">↺ Reset</button></div>
      <p style="font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.5">Try DELETE twice: first → 204, second → 404 (idempotent: end state is the same). POST twice → two different ids (not idempotent).</p>
    </div>
    <div class="pg-stage">
      <div class="pg-stats">
        <div class="pg-stat"><div class="k">Last method</div><div class="v ac" id="pgM">—</div></div>
        <div class="pg-stat"><div class="k">Status</div><div class="v ok" id="pgS">—</div></div>
        <div class="pg-stat"><div class="k">Idempotent?</div><div class="v wa" id="pgI">—</div></div>
        <div class="pg-stat"><div class="k">Rows</div><div class="v" id="pgRows">3</div></div>
      </div>
      <div id="pgViz"></div>
      <div class="pg-log" id="pgLog"></div>
    </div>
  </div>`;

  const W=560,H=150;const svg=S("svg",{viewBox:"0 0 "+W+" "+H});$("pgViz").appendChild(svg);
  let users,nextId;
  function reset(){users={1:{id:1,name:"Ada"},2:{id:2,name:"Linus"},3:{id:3,name:"Grace"}};nextId=4;
    draw();stats("—","—","—");$("pgLog").innerHTML="";log("collection seeded with 3 users","ac");}
  function idv(){return +$("pgId").value||1;}
  function set(m,s,idem,cls){$("pgM").textContent=m;$("pgS").textContent=s;$("pgS").className="v "+(cls||"ok");$("pgI").textContent=idem;}
  function get(){const id=idv();if(users[id]){set("GET","200 OK","yes (safe)","ok");log("GET /users/"+id+" → 200 "+JSON.stringify(users[id]),"ok");}
    else{set("GET","404 Not Found","yes (safe)","bad");log("GET /users/"+id+" → 404 (no such user)","bad");}draw();}
  function list(){set("GET","200 OK","yes (safe)","ok");log("GET /users → 200 ["+Object.keys(users).length+" users]","ok");draw();}
  function post(){const id=nextId++;users[id]={id,name:"User"+id};set("POST","201 Created","no (creates new)","ok");log("POST /users → 201 Created /users/"+id+" (new resource every call)","ok");draw();}
  function put(){const id=idv();const existed=!!users[id];users[id]={id,name:"Updated"+id};
    set("PUT","200 OK","yes","ok");log("PUT /users/"+id+" → "+(existed?"200 OK (updated)":"201 Created (upsert)")+" — repeat gives same state","ok");draw();}
  function del(){const id=idv();if(users[id]){delete users[id];set("DELETE","204 No Content","yes","ok");log("DELETE /users/"+id+" → 204 (removed)","ok");}
    else{set("DELETE","404 Not Found","yes","wa");log("DELETE /users/"+id+" → 404 (already gone — same end state, still idempotent)","wa");}draw();}
  function draw(){svg.innerHTML="";
    const ids=Object.keys(users);
    svg.appendChild(TX(20,24,"GET /users  →  collection:",{fill:"#8b8b93","font-size":11}));
    if(!ids.length)svg.appendChild(TX(W/2,80,"(empty collection)",{fill:"#6b6b73","font-size":12,"text-anchor":"middle"}));
    ids.forEach((id,i)=>{const x=30+(i%5)*105,y=50+Math.floor(i/5)*46;
      svg.appendChild(S("rect",{x:x,y:y,width:96,height:34,rx:7,fill:"rgba(56,189,248,.1)",stroke:"#38bdf8","stroke-width":1.6}));
      svg.appendChild(TX(x+48,y+15,"id "+users[id].id,{fill:"#e4e4e7","font-size":10,"text-anchor":"middle"}));
      svg.appendChild(TX(x+48,y+28,users[id].name,{fill:"#8b8b93","font-size":9,"text-anchor":"middle"}));});
    $("pgRows").textContent=ids.length;}
  function stats(){}
  function log(m,c){const l=$("pgLog");const d=el("div",c||"",m);l.insertBefore(d,l.firstChild);while(l.children.length>22)l.removeChild(l.lastChild);}

  $("pgGet").onclick=get;$("pgList").onclick=list;$("pgPost").onclick=post;$("pgPut").onclick=put;$("pgDel").onclick=del;$("pgReset").onclick=reset;
  reset();
}

const DATA={
  badge:"🌐",title:"REST API",category:"Networking",difficulty:"Easy",readingTime:"9 min",
  eyebrow:"Representational State Transfer",
  tagline:"An architectural style for web APIs built on HTTP: model everything as <b>resources</b> with URIs, act on them with standard <b>verbs</b> (GET/POST/PUT/DELETE), keep requests <b>stateless</b>, and lean on HTTP status codes, caching, and hypermedia.",
  pills:["<b>Resource</b> URIs","<b>Stateless</b>","<b>Uniform</b> interface","<b>Cacheable</b>"],
  overview:"REST (Roy Fielding, 2000) is a set of constraints for designing networked APIs on top of HTTP. Everything is a <b>resource</b> identified by a URI (e.g. <code>/users/42</code>), and you manipulate resources using HTTP's uniform <b>methods</b>: GET (read), POST (create), PUT/PATCH (update), DELETE (remove). Key constraints: <b>statelessness</b> (each request carries all the context it needs — no server-side session), a <b>uniform interface</b> (consistent, predictable URLs and verbs), <b>cacheability</b> (responses declare whether they can be cached), and a <b>client–server</b> separation. Responses use standard status codes (2xx success, 3xx redirect, 4xx client error, 5xx server error) and typically carry JSON. Well-designed REST APIs are also <b>idempotent</b> where it matters: GET/PUT/DELETE can be retried safely; only POST creates new state each time.",
  problem:"Before REST, APIs were often ad-hoc RPC or heavyweight SOAP with tight coupling and complex tooling. Teams needed a simple, scalable, cache-friendly way to expose data over the web that any client (browser, mobile, service) could consume using the HTTP they already speak. REST provides conventions that make APIs predictable, horizontally scalable (thanks to statelessness), and easy to cache at every layer.",
  diagram,diagramCaption:"Resources + standard verbs over stateless HTTP, with meaningful status codes on every response.",
  how:[
    "Model your domain as resources with clean, noun-based URIs (/users, /users/42/orders).",
    "Use HTTP methods for actions: GET (read), POST (create), PUT/PATCH (update), DELETE (remove).",
    "Keep it stateless: each request includes auth and all needed context; the server keeps no session between calls.",
    "Return proper status codes (200/201/204/400/401/404/409/500) and JSON bodies.",
    "Add cache headers (ETag, Cache-Control), pagination, filtering, and versioning (/v1) for real-world scale."
  ],
  complexity:[["Read","GET (safe, cacheable)"],["Create","POST (201)"],["Update","PUT/PATCH (idempotent PUT)"],["Delete","DELETE (204, idempotent)"]],
  advantages:["Simple, uses ubiquitous HTTP semantics","Stateless → easy horizontal scaling","Cacheable at browser/CDN/proxy layers","Language-agnostic; great tooling & docs","Loose coupling via uniform interface"],
  disadvantages:["Over-/under-fetching (fixed response shapes)","Multiple round trips for related data","No built-in streaming / real-time push","Versioning & evolving schemas can be awkward","Weakly typed contracts vs gRPC/GraphQL"],
  tradeoffs:"REST optimizes for simplicity, cacheability, and broad compatibility over efficiency and flexibility. Its fixed endpoints cause over-fetching (getting more fields than you need) or under-fetching (needing several calls to assemble a screen) — the exact pains GraphQL addresses. It rides on human-readable JSON over HTTP/1.1–2, which is easy to debug but less compact and slower than gRPC's binary protobuf over HTTP/2. For request/response CRUD over the public web it's the pragmatic default; for chatty internal microservices or real-time data, gRPC/GraphQL/WebSockets may fit better.",
  whenNot:"Reach for alternatives when REST's shape hurts: use GraphQL when clients need flexible, aggregated queries and want to avoid over/under-fetching; gRPC for high-throughput, low-latency internal service-to-service calls with strict contracts and streaming; WebSockets/SSE for real-time push; and message queues for async, event-driven workflows rather than synchronous request/response.",
  sim,
  code:{
"HTTP":`# REST is just disciplined HTTP. A CRUD lifecycle for a user resource:\nGET    /users            -> 200  [ {..}, {..} ]        # list (safe, cacheable)\nGET    /users/42         -> 200  { "id":42, ... }      # read one\nPOST   /users            -> 201  Location: /users/99   # create (NOT idempotent)\nPUT    /users/42         -> 200  { ...updated... }     # full update (idempotent)\nPATCH  /users/42         -> 200  { ...patched... }     # partial update\nDELETE /users/42         -> 204                         # remove (idempotent)\n# Errors: 400 bad request, 401 unauth, 403 forbidden, 404 not found,\n#         409 conflict, 422 validation, 429 rate-limited, 5xx server`,
"Node/Express":`app.get("/users/:id", (req, res) => {\n  const u = db.find(req.params.id);\n  if (!u) return res.status(404).json({ error: "not found" });\n  res.set("Cache-Control", "public, max-age=60");   // cacheable\n  res.set("ETag", u.version);                         // conditional GETs\n  res.status(200).json(u);\n});\n\napp.post("/users", (req, res) => {\n  const u = db.create(req.body);\n  res.status(201).location(\`/users/\${u.id}\`).json(u);  // 201 + Location\n});\n\napp.delete("/users/:id", (req, res) => {\n  db.remove(req.params.id);      // idempotent: same end state if repeated\n  res.status(204).end();\n});`,
"Best practices":`// Idempotency for safe retries on POST (e.g. payments):\nPOST /payments\nIdempotency-Key: 7f3c...-a91   // server dedups repeats with the same key\n\n// Pagination + filtering instead of returning everything:\nGET /users?status=active&page=2&limit=50&sort=-createdAt\n\n// Versioning so you can evolve without breaking clients:\nGET /v1/users     (or)   Accept: application/vnd.myapp.v1+json\n\n// HATEOAS (hypermedia) — responses link to related actions:\n{ "id":42, "_links": { "orders": "/users/42/orders" } }`
  },
  realWorld:[
    ["Stripe API","A famously well-designed REST API — clean resources, idempotency keys, versioning, great docs."],
    ["GitHub REST API","Resources for repos, issues, users with pagination, conditional requests (ETag), and rate limits."],
    ["Twilio / SendGrid","REST endpoints for sending messages/email, widely used from every language."],
    ["Public cloud APIs","AWS/GCP/Azure expose vast REST (and gRPC) surfaces for provisioning resources."],
    ["Almost every web/mobile backend","CRUD over REST+JSON is the default for app backends and public APIs."]
  ],
  interview:[
    ["basic","What makes an API 'RESTful'?","It follows REST constraints: resources identified by URIs, manipulated with a uniform set of HTTP methods, stateless requests (no server session), cacheable responses, and a client–server separation. In practice: noun-based URLs, correct verbs and status codes, and self-contained requests."],
    ["basic","What do the main HTTP methods do and which are idempotent?","GET reads (safe, no side effects), POST creates (not idempotent — repeats create duplicates), PUT replaces/updates (idempotent — repeating yields the same state), PATCH partially updates, DELETE removes (idempotent — deleting again leaves the same end state). GET, PUT, DELETE, HEAD, OPTIONS are idempotent; POST is not."],
    ["basic","Explain the main HTTP status code classes.","2xx success (200 OK, 201 Created, 204 No Content), 3xx redirection (301 moved, 304 Not Modified for caching), 4xx client errors (400 bad request, 401 unauthenticated, 403 forbidden, 404 not found, 409 conflict, 429 too many requests), and 5xx server errors (500 internal, 503 unavailable)."],
    ["inter","Why is statelessness important in REST?","Because the server keeps no client session, any server instance can handle any request. That makes the API trivially horizontally scalable behind a load balancer, more resilient (no session affinity to lose), and cacheable. The cost is that each request must carry its own context (auth token, parameters), increasing per-request size."],
    ["inter","How do you handle over-fetching and under-fetching in REST?","Mitigate with techniques like sparse fieldsets (?fields=id,name), embedding related resources (?include=orders), pagination and filtering, and dedicated aggregate endpoints or a Backend-for-Frontend. If clients truly need arbitrary, flexible queries, GraphQL is the better fit since REST's fixed response shapes are the root cause."],
    ["inter","How would you version and evolve a REST API safely?","Use URI versioning (/v1/) or content negotiation (Accept header) for breaking changes, and make non-breaking changes additively (new optional fields, new endpoints). Never repurpose existing fields. Communicate deprecations with headers/sunset dates and keep old versions running during migration."],
    ["adv","How do you make a POST endpoint safe to retry?","Support idempotency keys: the client sends a unique Idempotency-Key header; the server records the key with the result and, on a retry with the same key, returns the stored response instead of performing the action again. This prevents double-charges/double-creates when a client retries after a timeout — essential for payments."],
    ["sd","Design a REST API for a blogging platform.","Resources: /posts, /posts/{id}, /posts/{id}/comments, /users/{id}. Use GET for reads (cacheable, ETag), POST to create (201 + Location), PUT/PATCH to edit, DELETE to remove. Add pagination/filtering (?tag=&page=), auth via bearer tokens (stateless), rate limiting (429), idempotency keys on writes, and /v1 versioning. Return consistent error bodies and correct status codes; consider a BFF or ?include= to reduce round trips for the feed screen."]
  ],
  mistakes:["Using verbs in URLs (/getUser, /createUser) instead of nouns + HTTP methods.","Returning 200 for everything (including errors) instead of proper status codes.","Making GET mutate state (breaks safety, caching, and prefetching).","Ignoring pagination and returning huge unbounded collections.","Storing client session on the server, breaking statelessness and scaling."],
  best:["Use noun-based resource URIs and correct HTTP verbs/status codes.","Keep requests stateless; carry auth/context in each request.","Add caching (ETag, Cache-Control), pagination, filtering, and versioning.","Support idempotency keys on unsafe writes for reliable retries.","Return consistent, documented error shapes and use PATCH for partial updates."],
  related:[["GraphQL","◼️","Flexible client-driven queries","graphql.html"],["gRPC","🔗","Binary RPC over HTTP/2","grpc.html"],["HTTP/2 & HTTP/3","🚀","The transport underneath","http2-3.html"],["CORS","🔓","Browser cross-origin rules","cors.html"],["Rate Limiting","🚦","Protect your API","rate-limiting.html"],["API Gateway","🚪","Front door for APIs","system-designed.html"]]
};
renderConcept(DATA);
</script>
