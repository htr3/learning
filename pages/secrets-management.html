<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Secrets Management — System Design Concepts</title>
<link rel="stylesheet" href="../assets/concept.css" />
<script src="../assets/analytics.js"></script>
</head>
<body>
<script src="../assets/concept.js"></script>
<script>
"use strict";

function arrow(parent,x1,y1,x2,y2,c){
  parent.appendChild(S("line",{x1,y1,x2,y2,stroke:c,"stroke-width":2}));
  const a=Math.atan2(y2-y1,x2-x1),h=7;
  const p1=[x2-h*Math.cos(a-0.5),y2-h*Math.sin(a-0.5)],p2=[x2-h*Math.cos(a+0.5),y2-h*Math.sin(a+0.5)];
  parent.appendChild(S("polygon",{points:x2+","+y2+" "+p1[0]+","+p1[1]+" "+p2[0]+","+p2[1],fill:c}));
}

function diagram(host){
  const svg=S("svg",{viewBox:"0 0 660 210"});host.appendChild(svg);
  const lbl=TX(330,18,"",{fill:"#c4a2ff","font-size":13,"text-anchor":"middle","font-weight":700});svg.appendChild(lbl);
  const sub=TX(330,202,"",{fill:"#8b8b93","font-size":11,"text-anchor":"middle"});svg.appendChild(sub);
  const g=S("g",{});svg.appendChild(g);
  function box(x,y,w,t,c){g.appendChild(S("rect",{x:x-w/2,y:y-19,width:w,height:38,rx:8,fill:c+"22",stroke:c,"stroke-width":2}));t.split("\n").forEach((s,i)=>g.appendChild(TX(x,y+(t.includes("\n")?(-2+i*13):5),s,{fill:"#e4e4e7","font-size":11,"text-anchor":"middle","font-weight":700})));}
  let phase=0,timer=0,running=false,raf,last;
  function render(){g.innerHTML="";
    if(phase===0){box(150,95,180,"❌ hardcoded secret\nin source / .env","#f87171");box(500,95,180,"🌍 git repo / image","#f87171");
      arrow(g,240,95,410,95,"#f87171");
      lbl.textContent="the anti-pattern — secrets in code, config, or images";lbl.setAttribute("fill","#f87171");sub.textContent="leaks via git history, logs, backups, CI; impossible to rotate quickly";}
    else if(phase===1){box(120,95,150,"🖥️ app","#38bdf8");box(400,95,190,"🔐 secrets manager\n(Vault/KMS)","#34d399");
      arrow(g,196,88,304,88,"#38bdf8");g.appendChild(TX(250,80,"authenticate (identity)",{fill:"#38bdf8","font-size":9,"text-anchor":"middle"}));
      arrow(g,304,108,196,108,"#34d399");g.appendChild(TX(250,124,"short-lived secret + lease",{fill:"#34d399","font-size":9,"text-anchor":"middle"}));
      lbl.textContent="the pattern — fetch secrets at runtime from a central vault";lbl.setAttribute("fill","#34d399");sub.textContent="app proves its identity, gets a dynamic, time-limited credential";}
    else if(phase===2){box(330,70,220,"🔐 vault","#34d399");
      g.appendChild(TX(330,120,"encrypted at rest (KMS)  •  audit log",{fill:"#c4a2ff","font-size":10,"text-anchor":"middle"}));
      g.appendChild(TX(330,140,"access control per identity + path",{fill:"#8b8b93","font-size":10,"text-anchor":"middle"}));
      lbl.textContent="properties — encryption, least-privilege, full audit trail";lbl.setAttribute("fill","#c4a2ff");sub.textContent="every read is authenticated, authorized, and logged";}
    else{box(160,95,180,"↻ rotate / revoke\nautomatically","#a78bfa");box(500,95,180,"🔑 short TTL leases","#a78bfa");
      arrow(g,250,95,410,95,"#a78bfa");
      lbl.textContent="rotation — short leases + auto-rotation shrink the blast radius";lbl.setAttribute("fill","#a78bfa");sub.textContent="a leaked credential is useless once its short lease expires";}}
  function step(){phase=(phase+1)%4;timer=3.2;render();}
  function loop(now){if(!running)return;const dt=(now-last)/1000;last=now;timer-=dt;if(timer<=0)step();raf=requestAnimationFrame(loop);}
  const io=new IntersectionObserver(e=>{if(e[0].isIntersecting){if(!running){running=true;last=performance.now();raf=requestAnimationFrame(loop);}}else{running=false;cancelAnimationFrame(raf);}},{threshold:.15});
  io.observe(host);render();
}

function sim(root){
  root.innerHTML=`<p class="lead" style="margin-bottom:14px">A database credential leaks (git history, a log, a stolen laptop). How much damage depends entirely on how you manage secrets. Compare a <b>hardcoded static secret</b> against a <b>vault-issued dynamic secret</b> with a short lease and rotation. Run the clock, trigger a leak, and watch the <b>exposure window</b>.</p>
  <div class="pg">
    <div class="pg-controls">
      <div class="pg-field"><label>Strategy</label><select id="pgMode">
        <option value="static">Hardcoded static secret</option>
        <option value="vault">Vault dynamic secret + rotation</option>
      </select></div>
      <div class="pg-field"><label>Lease / rotation (sec): <b id="pgTtlV">6</b></label><input id="pgTtl" type="range" min="2" max="20" value="6" step="1"></div>
      <button class="pg-btn" id="pgRun">▶ run clock</button>
      <button class="pg-btn secondary" id="pgLeak">😈 leak the secret now</button>
      <button class="pg-btn secondary" id="pgReset">reset</button>
      <p style="font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.5">With a static secret, a leak is valid until a human notices and rotates it (often never). A vault lease auto-expires, capping the window an attacker can use it.</p>
    </div>
    <div class="pg-stage">
      <div class="pg-stats">
        <div class="pg-stat"><div class="k">Time</div><div class="v ac" id="pgT">0s</div></div>
        <div class="pg-stat"><div class="k">Current secret</div><div class="v" id="pgSec">—</div></div>
        <div class="pg-stat"><div class="k">Leaked cred valid?</div><div class="v ok" id="pgValid">—</div></div>
        <div class="pg-stat"><div class="k">Exposure window</div><div class="v wa" id="pgExp">0s</div></div>
      </div>
      <div id="pgViz"></div>
      <div class="pg-log" id="pgLog"></div>
    </div>
  </div>`;

  const W=560,H=90;const svg=S("svg",{viewBox:"0 0 "+W+" "+H});$("pgViz").appendChild(svg);
  let t=0,running=false,raf,last,version=1,leaked=false,leakVersion=null,leakStart=null,exposure=0;
  function ttl(){return +$("pgTtl").value||6;}
  function secret(){return $("pgMode").value==="vault"?("db-cred-v"+version):"DB_PASSWORD=hunter2 (static)";}
  function leakValid(){if(!leaked)return null;if($("pgMode").value==="static")return true;return leakVersion===version;}
  function draw(){svg.innerHTML="";
    const vault=$("pgMode").value==="vault";
    svg.appendChild(TX(20,20,vault?"vault rotates the credential each lease:":"one static secret, forever:",{fill:"#8b8b93","font-size":10}));
    const c=leaked?(leakValid()?"#f87171":"#34d399"):"#38bdf8";
    svg.appendChild(S("rect",{x:20,y:32,width:260,height:28,rx:6,fill:c+"22",stroke:c}));
    svg.appendChild(TX(30,50,secret(),{fill:c,"font-size":11,"font-family":"monospace"}));
    if(leaked){svg.appendChild(TX(300,50,leakValid()?"😈 leaked copy STILL WORKS":"😈 leaked copy is now DEAD ✓",{fill:leakValid()?"#f87171":"#34d399","font-size":11,"font-weight":700}));}}
  function stats(){$("pgT").textContent=Math.floor(t)+"s";$("pgSec").textContent=secret();
    const v=leakValid();$("pgValid").textContent=v===null?"—":(v?"YES ✗":"no ✓");$("pgValid").className="v "+(v===null?"":(v?"bad":"ok"));
    $("pgExp").textContent=exposure.toFixed(1)+"s";draw();}
  function log(m,c){const l=$("pgLog");const d=el("div",c||"",m);l.insertBefore(d,l.firstChild);while(l.children.length>22)l.removeChild(l.lastChild);}
  function tick(now){if(!running)return;const dt=(now-last)/1000;last=now;t+=dt;
    if(leaked&&leakValid())exposure+=dt;
    if($("pgMode").value==="vault"&&Math.floor(t/ttl())+1>version){version=Math.floor(t/ttl())+1;
      log("↻ vault rotated credential → db-cred-v"+version+" (old lease expired)","ac");
      if(leaked&&leakVersion!==version)log("   the leaked v"+leakVersion+" credential is now REVOKED — attacker locked out","ok");}
    stats();raf=requestAnimationFrame(tick);}
  function run(){if(running)return;running=true;last=performance.now();log("clock running…","ac");raf=requestAnimationFrame(tick);}
  function leak(){if(leaked){log("already leaked","wa");return;}leaked=true;leakVersion=version;leakStart=t;
    if($("pgMode").value==="static")log("💀 static secret leaked — valid FOREVER until a human manually rotates it","bad");
    else log("😈 vault credential v"+version+" leaked — valid only until this lease expires (~"+ttl()+"s)","wa");stats();}
  function reset(){running=false;cancelAnimationFrame(raf);t=0;version=1;leaked=false;leakVersion=null;exposure=0;
    log("reset — pick a strategy and run the clock, then leak the secret","ac");stats();}
  $("pgRun").onclick=run;$("pgLeak").onclick=leak;$("pgReset").onclick=reset;
  $("pgMode").onchange=reset;$("pgTtl").oninput=()=>{$("pgTtlV").textContent=$("pgTtl").value;};
  stats();log("compare a static secret vs a vault lease — leak each and watch the exposure window","ac");
}

const DATA={
  badge:"🔐",title:"Secrets Management",category:"Security",difficulty:"Medium",readingTime:"9 min",
  eyebrow:"Handling Keys, Tokens & Credentials",
  tagline:"Passwords, API keys, DB credentials, and signing keys are <b>secrets</b> that must never live in source code, images, or logs. A secrets manager stores them <b>encrypted</b>, hands them out to <b>authenticated</b> identities on demand, <b>audits</b> every access, and enables <b>rotation</b> so a leak has a tiny blast radius.",
  pills:["Never <b>hardcode</b> / commit","Centralized <b>encrypted</b> vault","Fetch at <b>runtime</b> by identity","<b>Rotate</b> + short <b>leases</b>"],
  overview:"<b>Secrets</b> are the credentials that grant access to systems: database passwords, API keys, TLS private keys, OAuth client secrets, encryption keys, and tokens. <b>Secrets management</b> is the practice of storing, distributing, rotating, and auditing them safely. The cardinal rule is to <b>never hardcode secrets</b> in source code, commit them to version control, bake them into container images, or print them to logs — because they then leak through git history, backups, CI logs, and image layers, and are nearly impossible to rotate. Instead, secrets live in a dedicated <b>secrets manager / vault</b> (HashiCorp Vault, AWS Secrets Manager, GCP Secret Manager, Azure Key Vault) that provides: <b>encryption at rest</b> (often backed by a KMS/HSM), <b>fine-grained access control</b> per identity and path, a complete <b>audit log</b> of every read, and support for <b>rotation</b>. Applications fetch secrets <b>at runtime</b> by authenticating with their own identity (an IAM role, Kubernetes service account, or short-lived token) rather than holding a long-lived master credential. The most powerful pattern is <b>dynamic secrets</b>: the vault generates a unique, short-lived credential per client on demand (e.g. a database user valid for one hour), so there's no shared static password and leaked credentials expire automatically. Combined with <b>short leases</b> and <b>automatic rotation</b>, this dramatically shrinks the <b>blast radius</b> of any leak. Complementary practices include <b>envelope encryption</b> (encrypt data with a data key, encrypt that key with a KMS master key), secret <b>scanning</b> in CI to catch commits, and least-privilege scoping.",
  problem:"Applications need credentials to talk to databases and services, but those credentials are high-value targets. If they're embedded in code or config, they leak through countless channels (repos, logs, backups, images, laptops) and, once static and shared, can't be rotated without downtime and grant attackers indefinite access. The challenge is delivering the right secret to the right workload at runtime while keeping it encrypted, access-controlled, audited, and rotatable.",
  diagram,diagramCaption:"From hardcoded anti-pattern to a central encrypted vault issuing short-lived, rotated, audited secrets.",
  how:[
    "Store secrets in a central vault, encrypted at rest (KMS/HSM-backed), never in code/config/images.",
    "Applications authenticate to the vault with their own workload identity (IAM role, K8s SA, token).",
    "The vault authorizes by policy (least privilege per identity/path) and returns the secret — logging the access.",
    "Prefer dynamic secrets: unique, short-lived credentials generated per request with a lease.",
    "Rotate secrets automatically and expire leases so leaked credentials quickly become useless."
  ],
  complexity:[["At rest","encrypted (KMS/HSM)"],["Access","authn + authz per identity"],["Dynamic secret","short lease/TTL"],["Audit","every read logged"]],
  advantages:["Secrets out of code/repos/images/logs","Centralized encryption, access control, and audit","Dynamic secrets + rotation shrink the blast radius","Runtime fetch by identity — no long-lived master creds","Fast, automated revocation and rotation"],
  disadvantages:["The vault becomes a critical dependency (HA/DR needed)","Bootstrapping trust (the 'secret-zero' problem)","Added operational complexity and latency on fetch","Misconfigured policies can over-expose secrets","Caching secrets in memory still needs care"],
  tradeoffs:"Secrets management trades <b>operational complexity for a smaller blast radius</b>. Centralizing secrets in a vault removes them from a dozen leaky places but creates a <b>critical dependency</b>: if the vault is down, workloads can't start or renew credentials, so it needs strong HA/DR, and every secret fetch adds latency and a network dependency (usually mitigated by short-lived in-memory caching, which itself must be handled carefully). A subtle chicken-and-egg problem is <b>'secret zero'</b> — the app needs some initial credential to authenticate to the vault; solving it well means leveraging platform identity (IAM instance roles, Kubernetes service-account tokens, cloud metadata) rather than another stored secret. The biggest lever is <b>static vs dynamic secrets</b>: static secrets are simple and universally compatible but shared and long-lived, so a leak is valid until someone notices and rotates (often far too late); dynamic, short-leased secrets auto-expire and are per-client, making leaks nearly worthless — at the cost of vault integration and backends that support generating credentials. Rotation frequency is its own trade-off: shorter leases mean smaller exposure windows but more rotation churn and more load on the vault and downstream systems. The consistent theme is that a little infrastructure investment buys a dramatic reduction in the cost of the inevitable leak.",
  whenNot:"You still need secrets discipline everywhere, but a full dynamic-secrets vault may be overkill for a tiny hobby project — at minimum use environment variables injected at deploy time and keep them out of the repo. Dynamic secrets require backends that support on-demand credential generation, so for third-party APIs that only issue long-lived keys you fall back to stored-and-rotated static secrets. And where ultra-low latency or offline operation is required, you may cache secrets locally with short TTLs rather than fetching per request. The one thing that's never acceptable is hardcoding secrets in code or committing them.",
  sim,
  code:{
"Anti-pattern (never do this)":`# ❌ Hardcoded in source — leaks via git history forever\nDB_PASSWORD = "hunter2"\napi_key     = "sk_live_51H..."         # committed & pushed = compromised\n\n# ❌ Baked into a Docker image layer / printed to logs\nENV STRIPE_KEY=sk_live_51H...\nconsole.log("connecting with", DB_PASSWORD)\n\n# Even if you delete it later, it stays in git history, image layers,\n# CI logs, and backups. Assume it is public. Rotate immediately.`,
"Fetch from a vault at runtime":`// App authenticates with ITS OWN identity (no stored master secret):\n// e.g. AWS IAM role, Kubernetes service-account token, GCP metadata.\nconst client = new SecretsManager();          // uses ambient workload identity\nconst { SecretString } = await client.getSecretValue({\n  SecretId: "prod/db/credentials",\n});\nconst { username, password } = JSON.parse(SecretString);\n// Secret lives in memory only; never written to disk/logs.\n// The vault authorized this call by policy and LOGGED it (audit trail).`,
"Dynamic secrets + rotation":`# HashiCorp Vault issues a UNIQUE, SHORT-LIVED db credential per request:\n$ vault read database/creds/app-role\n  username   v-app-x9f2a1        # generated just now\n  password   A1b2-C3d4-...        # random, unique to this lease\n  lease_id   database/creds/...   \n  lease_duration  1h              # auto-revoked after the lease\n\n# -> no shared static password; a leaked cred dies within the hour.\n# Envelope encryption for data-at-rest:\n#   data_key = KMS.generateDataKey()          # encrypt data with this\n#   store: encrypt(data, data_key) + KMS-encrypted(data_key)\n#   only KMS (with the master key) can unwrap the data key.`
  },
  realWorld:[
    ["HashiCorp Vault","Dynamic secrets, leases, and fine-grained policies."],
    ["AWS Secrets Manager / KMS","Managed secret storage, rotation, and envelope encryption."],
    ["GCP Secret Manager / Azure Key Vault","Cloud-native secret stores with IAM-based access."],
    ["Kubernetes + external-secrets","Sync secrets into pods via workload identity (not in images)."],
    ["git-secrets / TruffleHog / gitleaks","CI scanners that catch committed secrets before they leak."]
  ],
  interview:[
    ["basic","Why shouldn't you hardcode secrets in code or config?","Because they leak through many channels you can't fully control — git history (even after deletion), container image layers, CI/CD logs, backups, and developer machines. Once committed, a secret should be considered public and rotated immediately. Hardcoded secrets are also shared and long-lived, so you can't rotate them without code changes and downtime, and everyone with repo access effectively has production credentials."],
    ["basic","What does a secrets manager provide?","A central, encrypted-at-rest store for credentials with authenticated, authorized access per identity, a full audit log of every read, and rotation support. Applications fetch secrets at runtime using their own workload identity instead of embedding them. Examples include HashiCorp Vault and AWS/GCP/Azure secret managers. It removes secrets from code and gives you central control, visibility, and the ability to rotate and revoke."],
    ["inter","What are dynamic secrets and why are they better?","Dynamic secrets are unique, short-lived credentials the vault generates on demand for each client (for example, a database user valid for one hour), rather than a shared static password. They're better because there's no long-lived shared credential to leak, each client is individually attributable, and leaked credentials auto-expire when their lease ends — drastically shrinking the blast radius and enabling near-instant revocation by revoking the lease."],
    ["inter","How does secret rotation reduce risk?","Rotation replaces a secret periodically (or on demand) so any leaked copy becomes invalid after a short window. Combined with short leases, it caps how long a stolen credential is useful — often minutes to hours instead of forever. Automated rotation avoids the human-latency problem where static secrets stay valid because nobody notices the leak. The trade-off is more rotation churn and coordination with dependent systems, which managed rotation handles."],
    ["adv","What is the 'secret zero' problem and how do you solve it?","It's the bootstrap paradox: to fetch secrets from the vault, the app needs some initial credential to authenticate — but that credential is itself a secret that needs protecting. The solution is to avoid storing any secret by using platform-provided identity: an AWS IAM instance/role, a Kubernetes service-account token, a GCP metadata identity, or SPIFFE/SPIRE workload identity. The vault trusts the platform's attestation of the workload's identity, so no static bootstrap secret is stored anywhere."],
    ["adv","What is envelope encryption and why is it used?","Envelope encryption encrypts data with a locally generated data key, then encrypts (wraps) that data key with a master key held in a KMS/HSM. You store the ciphertext alongside the wrapped data key. To decrypt, you ask the KMS to unwrap the data key (KMS never exposes the master key), then decrypt locally. It's used because it keeps the high-value master key isolated in hardware, allows encrypting large data efficiently, enables key rotation by re-wrapping data keys, and centralizes access control and audit at the KMS."],
    ["sd","Design secrets management for a microservices platform on Kubernetes.","Run a central vault (Vault or a cloud secret manager) as the source of truth, encrypted at rest via KMS/HSM. Give each service a Kubernetes service-account identity; the vault authenticates workloads via that identity (no stored bootstrap secret). Use dynamic, short-leased database and cloud credentials where possible, and rotate static third-party keys on a schedule. Inject secrets at runtime (CSI driver / external-secrets / sidecar) into memory, never into images or env baked at build. Enforce least-privilege policies per service/path, log all access for audit, and add CI secret scanning (gitleaks) plus HA/DR for the vault itself."]
  ],
  mistakes:["Committing secrets to git or baking them into images (leak forever).","Logging or printing secrets (they end up in log aggregation).","Using one long-lived, shared static credential for everything.","Overly-broad vault policies that expose unrelated secrets.","No rotation — a leaked secret stays valid indefinitely."],
  best:["Never hardcode; store secrets in an encrypted, audited vault.","Fetch at runtime via workload identity (no bootstrap secret).","Prefer dynamic, short-leased secrets; rotate automatically.","Apply least-privilege policies per identity and path.","Scan repos/CI for secrets; keep the vault HA and enable audit logs."],
  related:[["Session Management","🎫","Protect signing keys/tokens","session-management.html"],["OAuth2 / OIDC","🔑","Client secrets & keys","oauth2-oidc.html"],["TLS Handshake","🔒","Guards private keys","tls-handshake.html"],["SQL Injection","🗄️","Protect DB credentials","sql-injection.html"],["XSS","💉","Keep secrets out of the client","xss.html"],["Disaster Recovery","🔥","Vault HA/DR planning","disaster-recovery.html"]]
};
renderConcept(DATA);
</script>
