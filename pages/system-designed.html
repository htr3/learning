<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>System Design Lab — Interactive Learning Platform</title>
<style>
  :root{
    --bg:#0f0f11; --panel:#16171b; --panel-2:#1d1e23; --line:#f4f4f5;
    --muted:#8b8b93; --accent:#7C3AED; --accent-soft:rgba(124,58,237,.3);
    --green:#00C853; --green-soft:rgba(0,200,83,.22); --blue:#3b82f6;
    --gray:#24252b; --border:#32333c; --bad:#f8524b; --warn:#fbbf24;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--line);overflow:hidden;user-select:none;
    font-family:"Segoe UI","Inter",system-ui,-apple-system,sans-serif;font-size:14px}
  button,input{font-family:inherit}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
  ::-webkit-scrollbar-thumb:hover{background:#44454f}

  /* ---------------- TOP BAR ---------------- */
  #topbar{position:fixed;top:0;left:0;right:0;height:54px;z-index:50;display:flex;align-items:center;
    gap:12px;padding:0 14px;background:rgba(22,23,27,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;white-space:nowrap}
  .brand .logo{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#a855f7);box-shadow:0 0 14px var(--accent-soft)}
  .brand small{display:block;color:var(--muted);font-weight:500;font-size:10.5px}
  #searchWrap{position:relative;margin-left:8px}
  #search{background:var(--panel-2);border:1px solid var(--border);border-radius:9px;color:var(--line);
    padding:8px 12px 8px 32px;font-size:13px;width:260px;outline:none;transition:border .15s}
  #search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  #searchWrap svg{position:absolute;left:9px;top:8px;width:16px;height:16px;color:var(--muted)}
  .spacer{flex:1}
  .btn{background:var(--panel-2);color:var(--line);border:1px solid var(--border);border-radius:9px;
    padding:8px 13px;font-size:12.5px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
  .btn:hover{border-color:var(--accent);color:#fff;box-shadow:0 0 10px var(--accent-soft)}
  .btn.green{background:var(--green);border-color:var(--green);color:#04210f;font-weight:700}
  .btn.green:hover{background:#00e676}
  .btn.purple{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.purple:hover{background:#8b48f0}
  .zoomlbl{font-size:12px;color:var(--muted);min-width:42px;text-align:center;font-variant-numeric:tabular-nums}

  /* ---------------- LEFT SIDEBAR ---------------- */
  #sidebar{position:fixed;top:54px;left:0;bottom:0;width:230px;z-index:30;background:var(--panel);
    border-right:1px solid var(--border);display:flex;flex-direction:column}
  #sidebar .s-head{padding:12px 14px 8px;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:600}
  #catList{overflow-y:auto;flex:1;padding:0 8px 14px}
  .cat{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:13px;color:#c9c9d1;transition:background .12s,color .12s}
  .cat:hover{background:var(--panel-2);color:#fff}
  .cat.active{background:var(--accent-soft);color:#fff;box-shadow:inset 0 0 0 1px var(--accent)}
  .cat .c-ico{width:24px;height:24px;border-radius:6px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
  .cat.hidden{display:none}
  .cat.match{background:var(--green-soft);color:#fff}

  /* ---------------- TOOLBAR ---------------- */
  #toolbar{position:fixed;left:244px;top:50%;transform:translateY(-50%);z-index:28;display:flex;flex-direction:column;gap:5px;
    background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:7px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .tool{width:36px;height:36px;border-radius:10px;cursor:pointer;border:none;background:transparent;color:var(--muted);
    display:flex;align-items:center;justify-content:center;transition:all .15s}
  .tool:hover{background:var(--panel-2);color:#fff}
  .tool.active{background:var(--accent-soft);color:#fff;box-shadow:inset 0 0 0 1px var(--accent)}
  .tool svg{width:18px;height:18px}
  .tsep{height:1px;background:var(--border);margin:3px 2px}

  /* ---------------- CANVAS ---------------- */
  #viewport{position:fixed;inset:54px 0 0 230px;overflow:hidden;cursor:grab;
    background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.045) 1px,transparent 0);background-size:26px 26px}
  #viewport.grabbing{cursor:grabbing}
  #world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
  #edges{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
  .edge{fill:none;stroke:rgba(244,244,245,.24);stroke-width:1.7;transition:stroke .2s,stroke-width .2s}
  .edge.hot{stroke:var(--accent);stroke-width:2.6;filter:drop-shadow(0 0 6px var(--accent))}
  .packet{filter:drop-shadow(0 0 5px rgba(255,255,255,.9))}

  .node{position:absolute;background:var(--gray);border:1px solid var(--border);border-radius:13px;padding:11px 13px;cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.45);transition:box-shadow .2s,border-color .2s,transform .12s,opacity .2s,background .2s;width:170px}
  .node:hover{transform:translateY(-2px);border-color:var(--accent)}
  .n-head{display:flex;align-items:center;gap:9px}
  .n-ico{width:30px;height:30px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;
    background:var(--panel-2);border:1px solid var(--border);font-size:16px}
  .n-title{font-size:13px;font-weight:600;line-height:1.15}
  .n-sub{font-size:10px;color:var(--muted);margin-top:1px}
  .node.pulse .n-ico{animation:iconpulse 2s ease-in-out infinite}
  @keyframes iconpulse{0%,100%{box-shadow:0 0 0 rgba(124,58,237,0)}50%{box-shadow:0 0 12px var(--accent)}}
  .node.glow{border-color:var(--accent);background:#211833;box-shadow:0 0 0 1px var(--accent),0 0 24px var(--accent-soft)}
  .node.match{border-color:var(--green);background:#12301d;box-shadow:0 0 0 1px var(--green),0 0 26px var(--green-soft)}
  .node.dim{opacity:.22}
  .node.learn{border-color:var(--green);box-shadow:0 0 0 2px var(--green),0 0 34px var(--green-soft);transform:scale(1.06)}
  .section-tag{position:absolute;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:600}

  /* ---------------- RIGHT PANEL ---------------- */
  #panel{position:fixed;top:54px;right:0;bottom:0;width:520px;max-width:94vw;z-index:45;background:var(--panel);
    border-left:1px solid var(--border);transform:translateX(105%);transition:transform .38s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.5)}
  #panel.open{transform:translateX(0)}
  #panel .ph{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border);
    background:linear-gradient(135deg,var(--accent-soft),transparent)}
  #panel .ph .ph-ico{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;
    background:var(--panel-2);border:1px solid var(--border)}
  #panel .ph .ph-title{font-size:19px;font-weight:800}
  #panel .ph .ph-cat{font-size:11.5px;color:var(--accent);text-transform:uppercase;letter-spacing:1px;font-weight:600}
  #panel .ph-close{margin-left:auto;cursor:pointer;color:var(--muted);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:22px}
  #panel .ph-close:hover{background:var(--panel-2);color:#fff}
  #pbody{overflow-y:auto;padding:18px;flex:1}
  .sec{margin-bottom:20px}
  .sec > h4{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:9px;
    display:flex;align-items:center;gap:7px}
  .sec > h4::before{content:"";width:14px;height:2px;background:var(--accent);border-radius:2px}
  .sec p{font-size:13.5px;line-height:1.65;color:#d4d4d8}
  .sec ul{list-style:none;display:flex;flex-direction:column;gap:6px}
  .sec ul li{font-size:13px;line-height:1.5;color:#d4d4d8;padding-left:18px;position:relative}
  .sec ul li::before{content:"▸";position:absolute;left:0;color:var(--accent)}
  .sec ul.good li::before{content:"✓";color:var(--green)}
  .sec ul.bad li::before{content:"✕";color:var(--bad)}
  .sec ul.q li::before{content:"?";color:var(--warn);font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11.5px;background:var(--panel-2);border:1px solid var(--border);border-radius:7px;padding:4px 9px;color:#c9c9d1}
  .chip.link{cursor:pointer}
  .chip.link:hover{border-color:var(--accent);color:#fff}
  .callout{background:var(--panel-2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:9px;padding:11px 13px;font-size:12.5px;color:#c9c9d1;line-height:1.6}
  pre{background:#0b0b0d;border:1px solid var(--border);border-radius:10px;padding:13px;overflow-x:auto;font-size:12px;line-height:1.55;
    font-family:"JetBrains Mono","Consolas",monospace;color:#d4d4d8}
  pre .cm{color:#6b7280}.pre-lang{font-size:10px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:1px}
  .subsec{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px}
  .subsec h5{font-size:13px;color:#fff;margin-bottom:5px;display:flex;align-items:center;gap:7px}
  .subsec p{font-size:12.5px;color:#b3b3bb;line-height:1.55}
  .viz{background:#0b0b0d;border:1px solid var(--border);border-radius:12px;padding:10px;position:relative;overflow:hidden}
  .viz svg{width:100%;height:auto;display:block}
  .viz-ctrl{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
  .viz-ctrl button{background:var(--panel-2);border:1px solid var(--border);color:var(--line);border-radius:7px;padding:5px 10px;font-size:11.5px;cursor:pointer}
  .viz-ctrl button:hover{border-color:var(--accent)}
  .viz-cap{font-size:11.5px;color:var(--muted);margin-top:7px;min-height:16px;line-height:1.5}

  /* ---------------- MINIMAP ---------------- */
  #minimap{position:fixed;right:14px;bottom:14px;z-index:35;width:190px;height:120px;background:rgba(13,13,15,.9);
    border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:right .38s}
  #minimap.shift{right:534px}
  #minimap svg{width:100%;height:100%;display:block}
  #mm-view{fill:rgba(124,58,237,.16);stroke:var(--accent);stroke-width:1.5}

  #zoomctl{position:fixed;right:14px;bottom:146px;z-index:35;display:flex;flex-direction:column;gap:6px;transition:right .38s}
  #zoomctl.shift{right:534px}
  #zoomctl button{width:34px;height:34px;border-radius:9px;cursor:pointer;background:var(--panel);border:1px solid var(--border);
    color:var(--line);font-size:17px;display:flex;align-items:center;justify-content:center}
  #zoomctl button:hover{border-color:var(--accent)}

  /* ---------------- LEARNING OVERLAY ---------------- */
  #learn{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:48;width:560px;max-width:92vw;display:none;
    background:var(--panel);border:1px solid var(--green);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 30px var(--green-soft);overflow:hidden}
  #learn .lh{display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(135deg,var(--green-soft),transparent);border-bottom:1px solid var(--border)}
  #learn .lstep{width:30px;height:30px;border-radius:8px;background:var(--green);color:#04210f;font-weight:800;display:flex;align-items:center;justify-content:center}
  #learn .ltitle{font-size:14px;font-weight:700}
  #learn .lcount{margin-left:auto;font-size:11px;color:var(--muted)}
  #learn .lbody{padding:13px 16px;font-size:13px;line-height:1.55;color:#d4d4d8;min-height:44px}
  #learn .lfoot{display:flex;gap:8px;padding:0 16px 14px}
  #learn .lprog{height:4px;background:var(--panel-2)}
  #learn .lprog>i{display:block;height:100%;background:var(--green);transition:width .3s}

  /* ---------------- INTERVIEW MODAL ---------------- */
  #quiz{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center}
  #quiz .card{width:560px;max-width:92vw;background:var(--panel);border:1px solid var(--accent);border-radius:16px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.7)}
  #quiz .qh{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--accent-soft),transparent)}
  #quiz .qh .badge{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent);font-weight:700}
  #quiz .q-close{margin-left:auto;cursor:pointer;color:var(--muted);font-size:22px}
  #quiz .qbody{padding:20px}
  #quiz .qq{font-size:19px;font-weight:700;line-height:1.4;margin-bottom:16px}
  #quiz .qans{font-size:13.5px;line-height:1.65;color:#c9c9d1;display:none;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:14px;max-height:220px;overflow-y:auto}
  #quiz .qans.show{display:block;animation:fade .3s}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  #quiz .qfoot{display:flex;gap:8px;padding:0 20px 20px}
  .hint{position:fixed;left:244px;bottom:12px;z-index:20;font-size:11px;color:var(--muted)}
  .kbd{font-size:10px;background:var(--panel-2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--muted)}
</style>
<script src="../assets/analytics.js"></script>
</head>
<body>

  <!-- ============ TOP BAR ============ -->
  <div id="topbar">
    <div class="brand"><span class="logo"></span><div>System Design Lab<small>Interactive interview prep</small></div></div>
    <a class="btn" href="../index.html" title="Back to Hub" style="text-decoration:none">← Hub</a>
    <div id="searchWrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="search" placeholder="Search topics… (Kafka, Redis, CAP)" />
    </div>
    <div class="spacer"></div>
    <button class="btn green" id="btnLearn">▶ Start Learning</button>
    <button class="btn purple" id="btnQuiz">🎲 Interview Mode</button>
    <button class="btn" id="btnZin">＋</button>
    <span class="zoomlbl" id="zoomLbl">100%</span>
    <button class="btn" id="btnZout">－</button>
    <button class="btn" id="btnFit">⤢ Fit</button>
  </div>

  <!-- ============ LEFT SIDEBAR ============ -->
  <div id="sidebar">
    <div class="s-head">Concepts</div>
    <div id="catList"></div>
  </div>

  <!-- ============ TOOLBAR ============ -->
  <div id="toolbar">
    <button class="tool active" data-tool="pointer" title="Selection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 3l7 17 2-7 7-2z"/></svg></button>
    <button class="tool" data-tool="hand" title="Hand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 11V6a1.5 1.5 0 013 0v4m0 0V4.5a1.5 1.5 0 013 0V10m0 0V6a1.5 1.5 0 013 0v6c0 4-2 8-6 8s-6-3-6-6l-1.5-3a1.4 1.4 0 012.4-1.4L10 11"/></svg></button>
    <div class="tsep"></div>
    <button class="tool" data-tool="rect" title="Rectangle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="16" height="12" rx="2"/></svg></button>
    <button class="tool" data-tool="circle" title="Circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/></svg></button>
    <button class="tool" data-tool="arrow" title="Arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h14m0 0l-5-5m5 5l-5 5"/></svg></button>
    <button class="tool" data-tool="text" title="Text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 6h14M12 6v12"/></svg></button>
    <div class="tsep"></div>
    <button class="tool" data-tool="fit" title="Fit" id="toolFit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>

  <!-- ============ CANVAS ============ -->
  <div id="viewport"><div id="world"><svg id="edges"></svg></div></div>
  <div class="hint">Drag to pan • Scroll to zoom • Click a node or concept • <span class="kbd">L</span> learn • <span class="kbd">Q</span> quiz • <span class="kbd">Esc</span> close</div>

  <!-- ============ MINIMAP + ZOOM ============ -->
  <div id="zoomctl"><button id="zin2">＋</button><button id="zout2">－</button><button id="zfit2" style="font-size:13px">⤢</button></div>
  <div id="minimap"><svg id="mmSvg"></svg></div>

  <!-- ============ RIGHT PANEL ============ -->
  <div id="panel">
    <div class="ph">
      <div class="ph-ico" id="phIco">⚙️</div>
      <div><div class="ph-cat" id="phCat">Category</div><div class="ph-title" id="phTitle">Topic</div></div>
      <div class="ph-close" id="phClose">×</div>
    </div>
    <div id="pbody"></div>
  </div>

  <!-- ============ LEARNING OVERLAY ============ -->
  <div id="learn">
    <div class="lh"><div class="lstep" id="lStep">1</div><div class="ltitle" id="lTitle">—</div><div class="lcount" id="lCount">1 / 10</div></div>
    <div class="lbody" id="lBody"></div>
    <div class="lfoot"><button class="btn" id="lPrev">◀ Back</button><button class="btn green" id="lNext" style="flex:1">Next ▶</button><button class="btn" id="lExit">Exit</button></div>
    <div class="lprog"><i id="lProg" style="width:10%"></i></div>
  </div>

  <!-- ============ INTERVIEW MODAL ============ -->
  <div id="quiz">
    <div class="card">
      <div class="qh"><span class="badge">Interview Question</span><span id="qTopic" style="font-size:12px;color:var(--muted)"></span><span class="q-close" id="qClose">×</span></div>
      <div class="qbody">
        <div class="qq" id="qQ">—</div>
        <div class="qans" id="qA"></div>
      </div>
      <div class="qfoot"><button class="btn purple" id="qReveal" style="flex:1">Reveal Answer</button><button class="btn" id="qNext">Next Question ▶</button><button class="btn" id="qOpen">Open Topic</button></div>
    </div>
  </div>

<script>
"use strict";
/* =====================================================================
   SYSTEM DESIGN LAB — modular vanilla JS
   Classes: SVGRenderer, Component, TopicManager, DiagramRenderer,
            AnimationEngine, Canvas, PopupPanel, VisualLab,
            SearchEngine, LearningEngine, InterviewEngine, App
   ===================================================================== */
const SVGNS="http://www.w3.org/2000/svg";
const $=id=>document.getElementById(id);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const svg=(t,a={})=>{const e=document.createElementNS(SVGNS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
const rand=(a,b)=>a+Math.random()*(b-a), randi=(a,b)=>Math.floor(rand(a,b+1));

/* =====================================================================
   TOPIC DATA
   ===================================================================== */
const T = {}; // registry
function topic(o){ T[o.id]=o; return o; }

/* ---- helper for code blocks (kept as plain strings) ---- */
const CODE = {
  rate:
`// Spring Boot + Redis (Token Bucket via Lua)
String lua =
  "local tokens = tonumber(redis.call('get', KEYS[1]) or ARGV[1]) " +
  "if tokens > 0 then " +
  "  redis.call('set', KEYS[1], tokens - 1) return 1 " +
  "else return 0 end";

@GetMapping("/api")
ResponseEntity<?> handle(@RequestHeader String clientId){
  Long ok = redis.execute(new DefaultRedisScript<>(lua, Long.class),
              List.of("rl:"+clientId), "100");
  if (ok == 0) return ResponseEntity.status(429).body("Too Many Requests");
  return ResponseEntity.ok(service.process());
}`,
  kafka:
`// Producer
var props = new Properties();
props.put("bootstrap.servers","broker:9092");
props.put("acks","all");            // wait for ISR
var p = new KafkaProducer<String,String>(props);
p.send(new ProducerRecord<>("orders", orderId, payload));

// Consumer (group => partitions auto-assigned)
props.put("group.id","order-processor");
props.put("enable.auto.commit","false");
var c = new KafkaConsumer<String,String>(props);
c.subscribe(List.of("orders"));
while(true){
  var recs = c.poll(Duration.ofMillis(100));
  for (var r : recs) process(r);
  c.commitSync();                   // commit offset after processing
}`,
  lb:
`# NGINX load balancing
upstream backend {
  least_conn;                 # or: ip_hash;  (sticky)
  server app1:8080 weight=3;  # weighted round robin
  server app2:8080;
  server app3:8080 backup;
}
server {
  location / { proxy_pass http://backend; }
}`,
  cache:
`// Cache-Aside (lazy loading)
async function getUser(id){
  let u = await redis.get("user:"+id);

class HashRing {

}`,

    problem:"Some workloads need massive write throughput, flexible/evolving schemas, or global availability more than they need JOINs and strict consistency. NoSQL stores optimize for scale and specific access patterns.",
    mistakes:["Modeling relationally then bolting on a document store","Expecting strong consistency from an AP store","Unbounded document/partition growth (hot partitions)"],
    code:{lang:"JSON · MongoDB",text:"// Denormalize around the read pattern (embed, don't join)\ndb.orders.insertOne({\n  _id: \"o42\", userId: \"u7\",\n  items: [{ sku: \"A1\", qty: 2 }],      // embedded\n  shipTo: { city: \"Pune\", zip: \"411001\" }\n});\ndb.orders.find({ userId: \"u7\" });     // single-doc read, no join"},
    refs:[["MongoDB data modeling","https://www.mongodb.com/docs/manual/core/data-modeling-introduction/"]]},

  "event-driven":{
    problem:"Synchronous request chains couple services tightly: if one downstream is slow or down, the whole call fails and back-pressure cascades. Emitting events lets producers move on and consumers react independently.",
    mistakes:["Non-idempotent consumers → duplicate side effects","Publishing inside a DB transaction without an outbox","No event schema versioning → breaking consumers"],
    code:{lang:"SQL · Outbox",text:"BEGIN;\n  INSERT INTO orders(...) VALUES(...);\n  INSERT INTO outbox(topic, payload) VALUES('orders.created', :json);\nCOMMIT;                       -- a relay publishes the outbox to Kafka reliably"},
    refs:[["microservices.io: Transactional Outbox","https://microservices.io/patterns/data/transactional-outbox.html"]]},

  "circuit-breaker":{
    problem:"When a dependency is failing or slow, naive callers keep sending requests and blocking threads, exhausting resources and turning one failure into a system-wide outage. A breaker trips and fails fast.",
    refs:[["Resilience4j: CircuitBreaker","https://resilience4j.readme.io/docs/circuitbreaker"],["Fowler: CircuitBreaker","https://martinfowler.com/bliki/CircuitBreaker.html"]]},

  retry:{
    problem:"Networks and services fail transiently (a dropped packet, a brief GC pause). Giving up immediately wastes those recoverable failures; retrying with backoff turns blips into successes — if done carefully.",
    code:{lang:"JavaScript",text:"async function withRetry(fn, tries = 4) {\n  for (let i = 0; i < tries; i++) {\n    try { return await fn(); }\n    catch (e) {\n      if (i === tries - 1 || !isTransient(e)) throw e;\n      const backoff = 2 ** i * 100;\n      await sleep(backoff + Math.random() * backoff); // jitter\n    }\n  }\n}"},
    refs:[["AWS: Exponential backoff and jitter","https://aws.amazon.com/blogs/architecture/exponential-backoff-and-jitter/"]]},

  saga:{
    problem:"A business flow that spans services (order → payment → inventory → shipping) can't use one ACID transaction across databases, and 2PC locks don't scale. A saga chains local transactions with compensations to undo on failure.",
    mistakes:["Compensations that aren't truly reversible","Non-idempotent steps replayed on retry","No persisted saga state → stuck workflows"],
    code:{lang:"Concept",text:"// Orchestrated saga\ntry {\n  await payment.charge(order);\n  await inventory.reserve(order);\n  await shipping.schedule(order);\n} catch (e) {\n  await inventory.release(order);   // compensations run in reverse\n  await payment.refund(order);\n}"},
    refs:[["microservices.io: Saga","https://microservices.io/patterns/data/saga.html"]]},

  cqrs:{
    problem:"When a single model serves both complex writes and high-volume varied reads, it satisfies neither well. CQRS splits them so each side scales and is shaped for its job.",
    mistakes:["Adding CQRS where plain CRUD would do","Forgetting reads are eventually consistent","Non-idempotent projections corrupting read models"],
    code:{lang:"Concept",text:"// Write side\nhandle(PlaceOrder cmd) -> store event OrderPlaced\n// Projection builds the read side\non(OrderPlaced e) -> upsert into orders_read_view (denormalized)\n// Query side just reads the view (fast, no joins)"},
    refs:[["Fowler: CQRS","https://martinfowler.com/bliki/CQRS.html"]]},

  "event-sourcing":{
    problem:"Storing only current state loses history and makes auditing, debugging and rebuilding views hard. Event sourcing keeps the full log of what happened, so state is a replayable projection.",
    mistakes:["Mutating or deleting past events","No snapshots → slow replays for big aggregates","Leaking storage/tech concerns into event schemas"],
    code:{lang:"Concept",text:"// State is derived by folding events\nevents = [AccountOpened, Deposited(100), Withdrew(30)]\nbalance = events.reduce(apply, 0)   // => 70\n// snapshot every N events to avoid replaying from zero"},
    refs:[["Fowler: Event Sourcing","https://martinfowler.com/eaaDev/EventSourcing.html"]]},

  docker:{
    problem:"Apps behave differently across dev, CI and prod because of mismatched OS libraries, runtimes and config ('works on my machine'). Containers ship the app with its exact dependencies so it runs identically anywhere.",
    mistakes:["Huge images from fat base + no multi-stage build","Running as root inside the container","Baking secrets into image layers"],
    code:{lang:"Dockerfile",text:"# multi-stage → tiny final image\nFROM node:20 AS build\nWORKDIR /app\nCOPY package*.json ./ && RUN npm ci\nCOPY . . && RUN npm run build\n\nFROM node:20-slim\nWORKDIR /app\nCOPY --from=build /app/dist ./dist\nUSER node\nCMD [\"node\",\"dist/server.js\"]"},
    refs:[["Docker: best practices","https://docs.docker.com/build/building/best-practices/"]]},

  monitoring:{
    problem:"Without metrics you find out about outages from angry users, not systems. Monitoring surfaces failures, saturation and SLO breaches early so you can react before customers are hurt.",
    mistakes:["Alerting on causes (CPU) not symptoms (latency/SLO)","Runaway metric cardinality blowing up cost","So many alerts that real ones get ignored"],
    code:{lang:"PromQL",text:"# p99 latency alert (symptom-based)\nhistogram_quantile(0.99,\n  sum(rate(http_request_duration_seconds_bucket[5m])) by (le)\n) > 0.5\n\n# error rate SLO burn\nsum(rate(http_requests_total{code=~\"5..\"}[5m]))\n  / sum(rate(http_requests_total[5m])) > 0.01"},
    refs:[["Google SRE: Monitoring","https://sre.google/sre-book/monitoring-distributed-systems/"]]},

  logging:{
    problem:"When something breaks in a distributed system, you need to reconstruct exactly what happened across many services. Structured, centralized logs with correlation IDs make that possible.",
    mistakes:["Unstructured free-text logs that can't be queried","Logging secrets / PII","No correlation ID to stitch a request together"],
    code:{lang:"JSON log",text:"{\"ts\":\"2026-07-22T13:10:02Z\",\"level\":\"error\",\n \"traceId\":\"a1b2c3\",\"service\":\"orders\",\n \"msg\":\"payment failed\",\"orderId\":\"o42\",\"code\":\"CARD_DECLINED\"}"},
    refs:[["12-Factor App: Logs","https://12factor.net/logs"]]},

  tracing:{
    problem:"A single user request may touch a dozen services; when it's slow, logs and metrics alone can't tell you which hop caused it. Tracing stitches the whole journey into one timeline of spans.",
    mistakes:["Not propagating trace context across calls","Sampling so aggressively you miss rare errors","Reinventing formats instead of OpenTelemetry"],
    code:{lang:"JavaScript · OTel",text:"const span = tracer.startSpan(\"charge-card\");\ntry { await payments.charge(order); }\ncatch (e) { span.recordException(e); throw e; }\nfinally { span.end(); }   // context auto-propagates to downstream calls"},
    refs:[["OpenTelemetry docs","https://opentelemetry.io/docs/"]]},

  security:{
    problem:"Systems are constantly probed for weak auth, injection, exposed secrets and misconfig. A single gap can leak data or take you down. Defense-in-depth layers controls so one failure isn't catastrophic.",
    mistakes:["Storing secrets in code / env files in git","Trusting client-side validation","Rolling your own crypto / auth"],
    code:{lang:"Concept",text:"// Parameterized query prevents SQL injection\ndb.query(\"SELECT * FROM users WHERE email = $1\", [email]);  // safe\n// NEVER: \"SELECT * FROM users WHERE email = '\" + email + \"'\"\n// Secrets from a vault, never source control\nconst key = await vault.read(\"secret/stripe\");"},
    refs:[["OWASP Top 10","https://owasp.org/www-project-top-ten/"]]},

  rabbitmq:{
    problem:"Services need reliable, decoupled task distribution with flexible routing and per-message acknowledgement — work queues where a message is handed to exactly one worker and retried on failure.",
    mistakes:["Auto-ack before the work is done → lost messages","No dead-letter queue for poison messages","Unbounded queues masking a slow consumer"],
    code:{lang:"Concept · AMQP",text:"ch.assertExchange(\"orders\", \"topic\");\nch.assertQueue(\"email\", { deadLetterExchange: \"dlx\" });\nch.bindQueue(\"email\", \"orders\", \"order.created\");\nch.consume(\"email\", msg => {\n  handle(msg); ch.ack(msg);          // manual ack after processing\n}, { noAck: false });"},
    refs:[["RabbitMQ tutorials","https://www.rabbitmq.com/tutorials"]]},

  users:{
    problem:"Every capacity, latency and availability decision traces back to real user behavior — traffic shape, geography, peak load and tolerance for staleness. Modeling the client is where system design starts.",
    advantages:["Defines the real load & SLAs to design for","Geography drives edge/CDN strategy","Access patterns shape caching & data models"],
    disadvantages:["Traffic is spiky and hard to predict","Diverse clients (web/mobile/IoT) to support","Malicious users require abuse protection"],
    sections:[{title:"Client types",items:["Browsers (web apps)","Mobile apps (intermittent connectivity)","Third-party API consumers","Other internal services"]}],
    interview:["How do you estimate QPS and storage from user counts?","How do read-heavy vs write-heavy patterns change the design?"],
    companies:["Any consumer-facing product"],
    best:["Do back-of-envelope capacity math early","Design for peak, not average, traffic","Assume some clients are hostile"],
    mistakes:["Designing for average load and melting at peak","Ignoring mobile latency/offline cases"]},

  dns:{
    problem:"Humans can't remember server IPs, and IPs change as infrastructure moves. DNS provides a stable naming layer and enables failover and geo/latency-based routing.",
    advantages:["Human-friendly, stable naming","Enables failover & geo routing","Cached globally for speed"],
    disadvantages:["Propagation/TTL delays on changes","Cache poisoning risk (use DNSSEC)","An extra resolution round-trip"],
    best:["Use low TTLs for records you may fail over","Use health-checked, latency/geo routing","Enable DNSSEC"],
    mistakes:["Very high TTLs blocking fast failover","No secondary DNS provider (SPOF)"],
    code:{lang:"Bash",text:"dig +trace app.com        # full delegation path\ndig app.com A +short      # resolved IPs\n# Route 53 weighted / latency / failover routing policies do the rest"},
    refs:[["Cloudflare: What is DNS?","https://www.cloudflare.com/learning/dns/what-is-dns/"]]},

  waf:{
    problem:"Public HTTP endpoints are constantly attacked with injection, XSS, scraping and layer-7 floods. A WAF inspects and filters this traffic at the edge before it ever reaches your application.",
    advantages:["Blocks common web attacks (OWASP)","Managed rulesets updated for you","Bot & L7 DDoS mitigation at the edge"],
    disadvantages:["False positives can block real users","Rule tuning is ongoing work","Not a substitute for secure code"],
    best:["Start in 'count/monitor' mode, then enforce","Combine with rate limiting & bot management","Keep app-level input validation too"],
    mistakes:["Treating WAF as your only defense","Enabling aggressive rules without testing"],
    code:{lang:"Concept",text:"# WAF rule intent (managed rules express these)\nBLOCK if body matches /(union|select).*from/i     # SQLi\nBLOCK if query matches /<script>/i                 # XSS\nRATE-LIMIT /login to 10/min per IP                 # brute force"},
    refs:[["Cloudflare: What is a WAF?","https://www.cloudflare.com/learning/ddos/glossary/web-application-firewall-waf/"]]},

  "object-storage":{
    problem:"Storing large binary files (images, video, backups, logs) in a relational database is expensive and doesn't scale. Object storage offers cheap, virtually unlimited, highly durable blob storage over HTTP.",
    mistakes:["Serving large files directly instead of via a CDN","Public buckets leaking sensitive data","Uploading through your app server instead of pre-signed URLs"],
    code:{lang:"Concept · S3",text:"// Let the client upload straight to storage\nconst url = s3.getSignedUrl(\"putObject\", {\n  Bucket: \"uploads\", Key: `u/${id}.jpg`, Expires: 300\n});\n// browser PUTs to url; app never proxies the bytes"},
    refs:[["AWS S3 best practices","https://docs.aws.amazon.com/AmazonS3/latest/userguide/best-practices.html"]]},

  "monitoring-stack":{
    problem:"Metrics are only useful if collected, stored and made visible with alerting. Prometheus (scrape + store time-series) plus Grafana (dashboards + alerts) is the de-facto open-source stack for exactly that.",
    advantages:["Open-source, cloud-native standard","Powerful PromQL querying","Rich Grafana dashboards & alerting"],
    disadvantages:["Prometheus is not long-term storage by default","High-cardinality labels hurt performance","Pull model needs service discovery"],
    sections:[{title:"How it fits",items:["Exporters/apps expose /metrics","Prometheus scrapes & stores time-series","Grafana queries Prometheus for dashboards","Alertmanager routes alerts (Slack/Pager)"]}],
    interview:["Push vs pull metrics — why does Prometheus pull?","How do you handle long-term metric storage?","What causes a cardinality explosion?"],
    companies:["SoundCloud (origin)","CNCF ecosystem","most Kubernetes shops"],
    best:["Use recording rules for expensive queries","Keep label cardinality bounded","Use Thanos/Mimir/Cortex for long-term storage"],
    mistakes:["Unbounded labels (user IDs as labels)","No alerting, just pretty dashboards"],
    refs:[["Prometheus docs","https://prometheus.io/docs/introduction/overview/"],["Grafana docs","https://grafana.com/docs/"]]},
};
Object.entries(ENRICH).forEach(([id,ex])=>{ if(T[id]) for(const k in ex){ if(T[id][k]==null) T[id][k]=ex[k]; } });

/* =====================================================================
   DiagramRenderer — canvas nodes + edges
   ===================================================================== */
class DiagramRenderer {
  constructor(world,edges){ this.world=world; this.edges=edges; this.nodeEls={}; }
  render(){
    SECTIONS.forEach(s=>{ const d=el("div","section-tag",s.t); d.style.left=s.x+"px"; d.style.top=s.y+"px"; this.world.appendChild(d); });
    NODES.forEach(n=>{
      const t=T[n.id]; const d=el("div","node pulse");
      d.id="cn-"+n.id; d.style.left=n.x+"px"; d.style.top=n.y+"px"; d.dataset.id=n.id;
      d.innerHTML=`<div class="n-head"><div class="n-ico">${t.icon}</div>
        <div><div class="n-title">${t.title}</div><div class="n-sub">${t.cat}</div></div></div>`;
      this.world.appendChild(d); this.nodeEls[n.id]=d; n.el=d;
    });
    this.measure(); this.drawEdges();
  }
  measure(){ NODES.forEach(n=>{ n.w=n.el.offsetWidth; n.h=n.el.offsetHeight; }); }
  anchors(a,b){ const aC=a.x+a.w/2,bC=b.x+b.w/2;
    return bC>=aC?[a.x+a.w,a.y+a.h/2,b.x,b.y+b.h/2]:[a.x,a.y+a.h/2,b.x+b.w,b.y+b.h/2]; }
  nodeById(id){ return NODES.find(n=>n.id===id); }
  drawEdges(){
    this.edges.innerHTML=`<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="rgba(244,244,245,.4)"/></marker></defs>`;
    this.edgePaths=[];
    NEDGES.forEach(([a,b])=>{
      const na=this.nodeById(a),nb=this.nodeById(b); if(!na||!nb)return;
      const [x1,y1,x2,y2]=this.anchors(na,nb),dx=Math.max(50,Math.abs(x2-x1)*0.45);
      const p=svg("path",{d:`M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`,class:"edge","marker-end":"url(#arr)"});
      p.dataset.from=a; p.dataset.to=b; this.edges.appendChild(p); this.edgePaths.push({from:a,to:b,path:p});
    });
  }
}

/* =====================================================================
   AnimationEngine — moving packets on canvas edges
   ===================================================================== */
class AnimationEngine {
  constructor(edges,paths){ this.edges=edges; this.packets=[]; this.last=performance.now(); this.paths=paths; }
  start(){
    this.paths.forEach((e,i)=>{ const len=e.path.getTotalLength();
      const dot=svg("circle",{r:3.4,class:"packet",fill:"#fff"}); this.edges.appendChild(dot);
      this.packets.push({dot,path:e.path,len,off:(i*0.12)%1,speed:0.16+Math.random()*0.05,from:e.from,to:e.to}); });
    requestAnimationFrame(t=>this.loop(t));
  }
  loop(now){ const dt=Math.min(0.05,(now-this.last)/1000); this.last=now;
    this.packets.forEach(p=>{ p.off=(p.off+p.speed*dt)%1; const pt=p.path.getPointAtLength(p.off*p.len);
      p.dot.setAttribute("cx",pt.x); p.dot.setAttribute("cy",pt.y); });
    requestAnimationFrame(t=>this.loop(t)); }
}

/* =====================================================================
   Canvas — pan / zoom / minimap
   ===================================================================== */
class Canvas {
  constructor(app){ this.app=app; this.vp=$("viewport"); this.world=$("world"); this.view={x:20,y:10,scale:0.62}; }
  apply(){ this.world.style.transform=`translate(${this.view.x}px,${this.view.y}px) scale(${this.view.scale})`;
    $("zoomLbl").textContent=Math.round(this.view.scale*100)+"%"; this.updateMinimap(); }
  bind(){
    let pan=false,sx=0,sy=0,ox=0,oy=0;
    this.vp.addEventListener("mousedown",e=>{ if(e.target.closest(".node"))return; pan=true; sx=e.clientX;sy=e.clientY;ox=this.view.x;oy=this.view.y; this.vp.classList.add("grabbing"); });
    window.addEventListener("mousemove",e=>{ if(!pan)return; this.view.x=ox+(e.clientX-sx); this.view.y=oy+(e.clientY-sy); this.apply(); });
    window.addEventListener("mouseup",()=>{ pan=false; this.vp.classList.remove("grabbing"); });
    this.vp.addEventListener("wheel",e=>{ e.preventDefault(); const r=this.vp.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
      const ns=Math.min(2.4,Math.max(0.3,this.view.scale*(1-e.deltaY*0.0015))); const wx=(mx-this.view.x)/this.view.scale,wy=(my-this.view.y)/this.view.scale;
      this.view.scale=ns; this.view.x=mx-wx*ns; this.view.y=my-wy*ns; this.apply(); },{passive:false});
  }
  zoomBy(f){ const r=this.vp.getBoundingClientRect(),mx=r.width/2,my=r.height/2; const wx=(mx-this.view.x)/this.view.scale,wy=(my-this.view.y)/this.view.scale;
    this.view.scale=Math.min(2.4,Math.max(0.3,this.view.scale*f)); this.view.x=mx-wx*this.view.scale; this.view.y=my-wy*this.view.scale; this.apply(); }
  bounds(){ let a=1e9,b=1e9,c=-1e9,d=-1e9; NODES.forEach(n=>{a=Math.min(a,n.x);b=Math.min(b,n.y-50);c=Math.max(c,n.x+n.w);d=Math.max(d,n.y+n.h);}); return {minX:a,minY:b,maxX:c,maxY:d,w:c-a,h:d-b}; }
  fit(){ const bb=this.bounds(),vw=this.vp.clientWidth,vh=this.vp.clientHeight,s=Math.min(vw/(bb.w+80),vh/(bb.h+80),1.2);
    this.view.scale=s; this.view.x=(vw-bb.w*s)/2-bb.minX*s; this.view.y=(vh-bb.h*s)/2-bb.minY*s; this.apply(); }
  focus(id,scale=0.9){ const n=NODES.find(x=>x.id===id); if(!n)return; const s=Math.max(0.7,Math.min(1.1,scale)); this.view.scale=s;
    this.view.x=this.vp.clientWidth/2-(n.x+n.w/2)*s; this.view.y=this.vp.clientHeight/2-(n.y+n.h/2)*s; this.apply(); }
  buildMinimap(){ const mm=$("mmSvg"),bb=this.bounds(),W=190,H=120,pad=6; this.mmS=Math.min((W-pad*2)/bb.w,(H-pad*2)/bb.h);
    this.mmOx=pad-bb.minX*this.mmS; this.mmOy=pad-bb.minY*this.mmS; mm.setAttribute("viewBox",`0 0 ${W} ${H}`);
    let s=""; NODES.forEach(n=>{ s+=`<rect x="${n.x*this.mmS+this.mmOx}" y="${n.y*this.mmS+this.mmOy}" width="${Math.max(2,n.w*this.mmS)}" height="${Math.max(2,n.h*this.mmS)}" rx="1" fill="rgba(255,255,255,.35)"/>`; });
    s+=`<rect id="mm-view" x="0" y="0" width="10" height="10"/>`; mm.innerHTML=s;
    mm.addEventListener("click",e=>{ const r=mm.getBoundingClientRect(),mx=(e.clientX-r.left)*(W/r.width),my=(e.clientY-r.top)*(H/r.height);
      const wx=(mx-this.mmOx)/this.mmS,wy=(my-this.mmOy)/this.mmS; this.view.x=this.vp.clientWidth/2-wx*this.view.scale; this.view.y=this.vp.clientHeight/2-wy*this.view.scale; this.apply(); }); }
  updateMinimap(){ const v=$("mm-view"); if(!v)return; const wx=-this.view.x/this.view.scale,wy=-this.view.y/this.view.scale;
    v.setAttribute("x",wx*this.mmS+this.mmOx); v.setAttribute("y",wy*this.mmS+this.mmOy);
    v.setAttribute("width",this.vp.clientWidth/this.view.scale*this.mmS); v.setAttribute("height",this.vp.clientHeight/this.view.scale*this.mmS); }
}

/* =====================================================================
   VisualLab — interactive animated diagrams inside the panel
   ===================================================================== */
class VisualLab {
  constructor(){ this.raf=null; this.timers=[]; }
  stop(){ if(this.raf)cancelAnimationFrame(this.raf); this.raf=null; this.timers.forEach(clearInterval); this.timers=[]; }
  loop(fn){ const step=()=>{ fn(); this.raf=requestAnimationFrame(step); }; this.raf=requestAnimationFrame(step); }
  every(ms,fn){ this.timers.push(setInterval(fn,ms)); }
  cap(txt){ const c=$("vizCap"); if(c)c.textContent=txt; }

  mount(key,host){
    this.stop(); host.innerHTML="";
    const fn=this["v_"+key]; if(!fn){ this.generic(host); return; }
    fn.call(this,host);
  }

  generic(host){
    const s=svg("svg",{viewBox:"0 0 400 120"}); host.appendChild(s);
    const boxes=["Input","Process","Output"]; const bx=[];
    boxes.forEach((b,i)=>{ const x=40+i*130; const g=svg("rect",{x,y:44,width:90,height:34,rx:8,fill:"#1d1e23",stroke:"#32333c"}); s.appendChild(g);
      s.appendChild(SVGRenderer.text(x+45,65,b,{fill:"#d4d4d8","font-size":11,"text-anchor":"middle"})); bx.push(x+90); });
    [0,1].forEach(i=>{ s.appendChild(svg("path",{d:`M ${40+i*130+90} 61 L ${40+(i+1)*130} 61`,stroke:"#7C3AED","stroke-width":1.6,fill:"none"})); });
    const dot=svg("circle",{r:4,fill:"#fff",class:"packet"}); s.appendChild(dot); let t=0;
    this.loop(()=>{ t=(t+0.008)%1; const seg=Math.min(1.999,t*2); const i=Math.floor(seg),f=seg-i;
      const x=(40+i*130+90)+f*40; dot.setAttribute("cx",x); dot.setAttribute("cy",61); });
    this.cap("Requests flow through the pipeline.");
  }

  /* -------- Rate Limiter: token bucket -------- */
  v_rate(host){
    const s=svg("svg",{viewBox:"0 0 400 200"}); host.appendChild(s);
    s.appendChild(SVGRenderer.text(200,16,"Token Bucket",{fill:"#8b8b93","font-size":11,"text-anchor":"middle"}));
    // bucket
    s.appendChild(svg("path",{d:"M250 60 L340 60 L330 150 L260 150 Z",fill:"none",stroke:"#00C853","stroke-width":2}));
    const cap=6; let tokens=cap; const tokenEls=[];
    const drawTokens=()=>{ tokenEls.forEach(e=>e.remove()); tokenEls.length=0;
      for(let i=0;i<tokens;i++){ const c=svg("circle",{cx:270+ (i%3)*22, cy:138-Math.floor(i/3)*22, r:8, fill:"#00C853"}); s.appendChild(c); tokenEls.push(c);} };
    drawTokens();
    const counter=SVGRenderer.text(295,175,`${tokens}/${cap}`,{fill:"#00C853","font-size":12,"text-anchor":"middle"}); s.appendChild(counter);
    // request marker
    const req=svg("rect",{x:20,y:96,width:28,height:20,rx:4,fill:"#7C3AED"}); s.appendChild(req);
    s.appendChild(SVGRenderer.text(34,110,"REQ",{fill:"#fff","font-size":8,"text-anchor":"middle"}));
    let rx=20, moving=true;
    this.every(900,()=>{ if(tokens<cap){ tokens++; drawTokens(); counter.textContent=`${tokens}/${cap}`; } }); // refill
    this.every(1100,()=>{ rx=20; moving=true; }); // new request
    this.loop(()=>{ if(moving){ rx+=2.2; req.setAttribute("x",rx);
        if(rx>=222){ moving=false; if(tokens>0){ tokens--; drawTokens(); counter.textContent=`${tokens}/${cap}`; counter.setAttribute("fill","#00C853"); this.cap("✓ Token available → request ALLOWED. Bucket refills 1 token/s."); req.setAttribute("fill","#00C853"); }
          else { counter.setAttribute("fill","#f8524b"); this.cap("✕ Bucket empty → request REJECTED (HTTP 429)."); req.setAttribute("fill","#f8524b"); }
          setTimeout(()=>req.setAttribute("fill","#7C3AED"),400);
        } } });
    this.cap("Tokens refill every second; each request consumes one.");
  }

  /* -------- CAP triangle -------- */
  v_cap(host){
    const s=svg("svg",{viewBox:"0 0 400 210"}); host.appendChild(s);
    const P={C:[200,30],A:[60,180],P:[340,180]};
    const edge=(a,b,id)=>{const p=svg("path",{d:`M ${P[a][0]} ${P[a][1]} L ${P[b][0]} ${P[b][1]}`,stroke:"#32333c","stroke-width":3,id}); s.appendChild(p); return p;};
    const eCA=edge("C","A","eCA"),eCP=edge("C","P","eCP"),eAP=edge("A","P","eAP");
    const vert=(k,label)=>{ const [x,y]=P[k]; s.appendChild(svg("circle",{cx:x,cy:y,r:26,fill:"#1d1e23",stroke:"#7C3AED","stroke-width":2,id:"v"+k}));
      s.appendChild(SVGRenderer.text(x,y+5,label,{fill:"#fff","font-size":16,"font-weight":700,"text-anchor":"middle"})); };
    vert("C","C"); vert("A","A"); vert("P","P");
    s.appendChild(SVGRenderer.text(200,60,"Consistency",{fill:"#8b8b93","font-size":9,"text-anchor":"middle"}));
    s.appendChild(SVGRenderer.text(60,205,"Availability",{fill:"#8b8b93","font-size":9,"text-anchor":"middle"}));
    s.appendChild(SVGRenderer.text(340,205,"Partition Tol.",{fill:"#8b8b93","font-size":9,"text-anchor":"middle"}));
    const combos=[
      {e:[eCP],c:"#00C853",t:"CP — sacrifice Availability: reject requests to stay consistent (MongoDB, HBase, etcd)."},
      {e:[eAP],c:"#00C853",t:"AP — sacrifice Consistency: stay available, serve possibly-stale data (Cassandra, DynamoDB)."},
      {e:[eCA],c:"#fbbf24",t:"CA — only possible with NO partition (single node). Not realistic for distributed systems."},
    ];
    let i=0; const cycle=()=>{ [eCA,eCP,eAP].forEach(e=>{e.setAttribute("stroke","#32333c");e.setAttribute("stroke-width",3);});
      combos[i].e.forEach(e=>{e.setAttribute("stroke",combos[i].c);e.setAttribute("stroke-width",5);}); this.cap(combos[i].t); i=(i+1)%combos.length; };
    cycle(); this.every(2600,cycle);
  }

  /* -------- Consistent hashing ring -------- */
  v_chash(host){
    const s=svg("svg",{viewBox:"0 0 400 230"}); host.appendChild(s);
    const cx=200,cy=115,R=85; s.appendChild(svg("circle",{cx,cy,r:R,fill:"none",stroke:"#32333c","stroke-width":2}));
    let nodes=[30,150,270]; const keys=[10,80,120,200,300,340];
    const pos=(deg,r=R)=>[cx+r*Math.cos((deg-90)*Math.PI/180), cy+r*Math.sin((deg-90)*Math.PI/180)];
    const layer=svg("g"); s.appendChild(layer);
    const owner=(kdeg)=>{ const sorted=[...nodes].sort((a,b)=>a-b); for(const n of sorted) if(n>=kdeg) return n; return sorted[0]; };
    const colors=["#00C853","#7C3AED","#3b82f6","#fbbf24","#f8524b"];
    const draw=()=>{ layer.innerHTML="";
      nodes.forEach((d,idx)=>{ const[x,y]=pos(d); const c=svg("circle",{cx:x,cy:y,r:11,fill:colors[idx%colors.length],stroke:"#0b0b0d","stroke-width":2}); layer.appendChild(c);
        const t=SVGRenderer.text(x,y+4,"N"+(idx+1),{fill:"#04210f","font-size":9,"font-weight":700,"text-anchor":"middle"}); layer.appendChild(t); });
      keys.forEach(k=>{ const[x,y]=pos(k,R-24); const o=owner(k); const ci=nodes.indexOf(o);
        layer.appendChild(svg("circle",{cx:x,cy:y,r:5,fill:colors[ci%colors.length]})); });
    };
    draw(); this.cap("Keys (small dots) map to the first node clockwise. Nodes use virtual points for balance.");
    host.parentElement.querySelector(".viz-ctrl")?.remove();
    const ctrl=el("div","viz-ctrl"); ctrl.innerHTML=`<button id="chAdd">+ Add Node</button><button id="chRem">– Remove Node</button>`;
    host.after(ctrl);
    ctrl.querySelector("#chAdd").onclick=()=>{ if(nodes.length<5){ nodes.push(randi(0,359)); draw(); this.cap("Node added → only keys between it and its clockwise neighbor move. ≈K/N keys remap."); } };
    ctrl.querySelector("#chRem").onclick=()=>{ if(nodes.length>2){ nodes.pop(); draw(); this.cap("Node removed → its keys pass to the next node clockwise. Other keys are untouched."); } };
  }

  /* -------- Kafka flow -------- */
  v_kafka(host){
    const s=svg("svg",{viewBox:"0 0 400 190"}); host.appendChild(s);
    s.appendChild(svg("rect",{x:14,y:78,width:70,height:34,rx:8,fill:"#1d1e23",stroke:"#7C3AED"}));
    s.appendChild(SVGRenderer.text(49,99,"Producer",{fill:"#fff","font-size":10,"text-anchor":"middle"}));
    const parts=[40,90,140]; parts.forEach((y,i)=>{ s.appendChild(svg("rect",{x:150,y,width:120,height:34,rx:6,fill:"#0b0b0d",stroke:"#00C853"}));
      s.appendChild(SVGRenderer.text(160,y+21,"P"+i,{fill:"#00C853","font-size":9})); });
    s.appendChild(SVGRenderer.text(210,26,"Broker · partitions",{fill:"#8b8b93","font-size":10,"text-anchor":"middle"}));
    s.appendChild(svg("rect",{x:316,y:78,width:70,height:34,rx:8,fill:"#1d1e23",stroke:"#3b82f6"}));
    s.appendChild(SVGRenderer.text(351,93,"Consumer",{fill:"#fff","font-size":10,"text-anchor":"middle"}));
    s.appendChild(SVGRenderer.text(351,106,"Group",{fill:"#8b8b93","font-size":8,"text-anchor":"middle"}));
    const msgs=[]; parts.forEach((y,i)=>{ for(let j=0;j<3;j++){ const m=svg("rect",{x:150,y:y+11,width:11,height:11,rx:2,fill:"#00C853"}); s.appendChild(m); msgs.push({m,x:150+j*40,y:y+11}); } });
    this.loop(()=>{ msgs.forEach(o=>{ o.x+=1.1; if(o.x>262)o.x=152; o.m.setAttribute("x",o.x); o.m.setAttribute("y",o.y); }); });
    this.cap("Producer appends records to partitions; the consumer group reads each partition in order.");
  }

  /* -------- Load balancer round robin -------- */
  v_lb(host){
    const s=svg("svg",{viewBox:"0 0 400 190"}); host.appendChild(s);
    s.appendChild(svg("rect",{x:150,y:78,width:70,height:34,rx:8,fill:"#1d1e23",stroke:"#7C3AED"}));
    s.appendChild(SVGRenderer.text(185,99,"LB",{fill:"#fff","font-size":12,"text-anchor":"middle"}));
    const servers=[40,90,140]; servers.forEach((y,i)=>{ s.appendChild(svg("rect",{x:300,y,width:80,height:34,rx:6,fill:"#0b0b0d",stroke:"#00C853"}));
      s.appendChild(SVGRenderer.text(340,y+21,"Server "+(i+1),{fill:"#d4d4d8","font-size":9,"text-anchor":"middle"}));
      s.appendChild(svg("path",{d:`M 220 95 C 260 95, 260 ${y+17}, 300 ${y+17}`,stroke:"#32333c","stroke-width":1.4,fill:"none"})); });
    const dot=svg("circle",{r:4,fill:"#fff",class:"packet"}); s.appendChild(dot);
    let target=0,t=0,phase=0;
    this.loop(()=>{ t+=0.02; if(phase===0){ // to LB
        const x=40+t*145; dot.setAttribute("cx",Math.min(185,x)); dot.setAttribute("cy",95); if(x>=185){phase=1;t=0;} }
      else { const y=servers[target]+17; const px=185+t*115; const cy=95+(y-95)*Math.min(1,t); dot.setAttribute("cx",Math.min(340,px)); dot.setAttribute("cy",cy);
        if(px>=340){ this.cap("Round Robin → dispatched to Server "+(target+1)+". Next request goes to the next server."); target=(target+1)%3; phase=0; t=0; dot.setAttribute("cx",40); } } });
    this.cap("Round Robin rotates each incoming request across the server pool.");
  }

  /* -------- Cache aside -------- */
  v_cache(host){
    const s=svg("svg",{viewBox:"0 0 400 170"}); host.appendChild(s);
    const box=(x,y,w,label,color)=>{ s.appendChild(svg("rect",{x,y,width:w,height:36,rx:8,fill:"#1d1e23",stroke:color})); s.appendChild(SVGRenderer.text(x+w/2,y+23,label,{fill:"#fff","font-size":10,"text-anchor":"middle"})); };
    box(20,66,70,"App","#7C3AED"); box(160,20,80,"Cache","#00C853"); box(160,110,80,"Database","#3b82f6");
    const dot=svg("circle",{r:5,fill:"#fff",class:"packet"}); s.appendChild(dot);
    const steps=[
      {a:[90,84],b:[160,38],t:"1 ▸ App checks the cache first…"},
      {a:[160,38],b:[90,84],t:"2 ▸ MISS — key not in cache."},
      {a:[90,84],b:[160,128],t:"3 ▸ Load from the database."},
      {a:[160,128],b:[160,38],t:"4 ▸ Populate cache with TTL."},
      {a:[160,38],b:[90,84],t:"5 ▸ Next read is a HIT (fast) ✓"},
    ];
    let i=0,t=0; this.cap(steps[0].t);
    this.loop(()=>{ t+=0.02; const st=steps[i]; const x=st.a[0]+(st.b[0]-st.a[0])*t, y=st.a[1]+(st.b[1]-st.a[1])*t;
      dot.setAttribute("cx",x); dot.setAttribute("cy",y);
      if(t>=1){ t=0; i=(i+1)%steps.length; this.cap(steps[i].t); dot.setAttribute("fill", i===4?"#00C853":"#fff"); } });
  }

  /* -------- API gateway fan -------- */
  v_gateway(host){
    const s=svg("svg",{viewBox:"0 0 400 200"}); host.appendChild(s);
    s.appendChild(svg("rect",{x:150,y:84,width:76,height:36,rx:9,fill:"#1d1e23",stroke:"#7C3AED"}));
    s.appendChild(SVGRenderer.text(188,106,"Gateway",{fill:"#fff","font-size":10,"text-anchor":"middle"}));
    const routes=["/auth","/orders","/pay","/profile"]; const ys=[20,70,120,170];
    routes.forEach((r,i)=>{ s.appendChild(svg("rect",{x:300,y:ys[i]-16,width:80,height:32,rx:6,fill:"#0b0b0d",stroke:"#00C853"}));
      s.appendChild(SVGRenderer.text(340,ys[i]+4,r,{fill:"#d4d4d8","font-size":10,"text-anchor":"middle"}));
      s.appendChild(svg("path",{d:`M 226 102 C 265 102, 265 ${ys[i]}, 300 ${ys[i]}`,stroke:"#32333c","stroke-width":1.3,fill:"none"})); });
    const dot=svg("circle",{r:4,fill:"#fff",class:"packet"}); s.appendChild(dot); let i=0,t=0,phase=0;
    this.loop(()=>{ t+=0.025; if(phase===0){ const x=30+t*158; dot.setAttribute("cx",Math.min(188,x)); dot.setAttribute("cy",102); if(x>=188){phase=1;t=0;} }
      else { const y=ys[i]; const x=188+t*112; dot.setAttribute("cx",Math.min(340,x)); dot.setAttribute("cy",102+(y-102)*Math.min(1,t));
        if(x>=340){ this.cap("Routed "+routes[i]+" → matching service. Gateway also does auth, rate limiting, caching."); i=(i+1)%routes.length; phase=0; t=0; dot.setAttribute("cx",30); } } });
    this.cap("One entry point routes each path to its service.");
  }

  /* -------- JWT auth sequence -------- */
  v_auth(host){
    const s=svg("svg",{viewBox:"0 0 400 190"}); host.appendChild(s);
    const lanes={Client:60,"Auth Server":200,API:340}; Object.entries(lanes).forEach(([k,x])=>{ s.appendChild(svg("line",{x1:x,y1:30,x2:x,y2:180,stroke:"#32333c","stroke-width":1.5}));
      s.appendChild(SVGRenderer.text(x,20,k,{fill:"#8b8b93","font-size":9,"text-anchor":"middle"})); });
    const dot=svg("circle",{r:5,fill:"#7C3AED",class:"packet"}); s.appendChild(dot);
    const steps=[
      {a:[60,50],b:[200,50],t:"1 ▸ Login (username + password) → Auth Server",c:"#7C3AED"},
      {a:[200,80],b:[60,80],t:"2 ▸ Returns signed JWT access + refresh token",c:"#00C853"},
      {a:[60,110],b:[340,110],t:"3 ▸ Call API with Authorization: Bearer <JWT>",c:"#3b82f6"},
      {a:[340,140],b:[340,140],t:"4 ▸ API verifies signature/exp locally → grants access ✓",c:"#00C853"},
    ];
    let i=0,t=0; this.cap(steps[0].t);
    this.loop(()=>{ t+=0.02; const st=steps[i]; const x=st.a[0]+(st.b[0]-st.a[0])*t,y=st.a[1]+(st.b[1]-st.a[1])*t;
      dot.setAttribute("cx",x); dot.setAttribute("cy",y); dot.setAttribute("fill",st.c);
      if(t>=1){ t=0; i=(i+1)%steps.length; this.cap(steps[i].t); } });
  }

  /* -------- Kubernetes scaling -------- */
  v_k8s(host){
    const s=svg("svg",{viewBox:"0 0 400 200"}); host.appendChild(s);
    s.appendChild(svg("rect",{x:20,y:80,width:90,height:40,rx:9,fill:"#1d1e23",stroke:"#7C3AED"}));
    s.appendChild(SVGRenderer.text(65,96,"Deployment",{fill:"#fff","font-size":9,"text-anchor":"middle"}));
    s.appendChild(SVGRenderer.text(65,110,"replicas: N",{fill:"#8b8b93","font-size":8,"text-anchor":"middle"}));
    s.appendChild(svg("rect",{x:150,y:80,width:70,height:40,rx:9,fill:"#1d1e23",stroke:"#3b82f6"}));
    s.appendChild(SVGRenderer.text(185,104,"ReplicaSet",{fill:"#fff","font-size":9,"text-anchor":"middle"}));
    s.appendChild(svg("path",{d:"M110 100 L150 100",stroke:"#32333c","stroke-width":1.5,"marker-end":"url(#arr)"}));
    const podG=svg("g"); s.appendChild(podG); let pods=3;
    const draw=()=>{ podG.innerHTML=""; for(let i=0;i<pods;i++){ const col=i%3, row=Math.floor(i/3); const x=270+col*42, y=50+row*46;
      podG.appendChild(svg("rect",{x,y,width:34,height:34,rx:7,fill:"#12301d",stroke:"#00C853"}));
      podG.appendChild(SVGRenderer.text(x+17,y+21,"🟢",{"font-size":12,"text-anchor":"middle"}));
      podG.appendChild(svg("path",{d:`M220 100 C 245 100, 245 ${y+17}, 270 ${y+17}`,stroke:"#32333c","stroke-width":1,fill:"none"})); } };
    draw(); this.cap("Deployment → ReplicaSet keeps "+pods+" Pods alive. HPA scales on CPU load.");
    let up=true; this.every(1800,()=>{ if(up){ pods++; if(pods>=6)up=false; } else { pods--; if(pods<=3)up=true; } draw();
      this.cap(up?"⬆ Autoscaler adding Pods as load rises ("+pods+" pods).":"⬇ Load dropped → scaling Pods back down ("+pods+" pods)."); });
  }
}

/* =====================================================================
   PopupPanel — renders the right info panel
   ===================================================================== */
class PopupPanel {
  constructor(app){ this.app=app; this.lab=new VisualLab(); this.panel=$("panel"); this.body=$("pbody"); }
  close(){ this.panel.classList.remove("open"); $("minimap").classList.remove("shift"); $("zoomctl").classList.remove("shift"); this.lab.stop(); this.app.clearHighlight(); }
  sec(title,inner){ return `<div class="sec"><h4>${title}</h4>${inner}</div>`; }
  ul(arr,cls=""){ return `<ul class="${cls}">`+arr.map(x=>`<li>${x}</li>`).join("")+`</ul>`; }
  chips(arr,link=false){ return `<div class="chips">`+arr.map(a=>`<span class="chip ${link?'link':''}" ${link?`data-goto="${a}"`:''}>${link?(T[a]?T[a].title:a):a}</span>`).join("")+`</div>`; }

  open(id){
    const t=T[id]; if(!t)return;
    this.app.highlight(id);
    $("phIco").textContent=t.icon; $("phTitle").textContent=t.title; $("phCat").textContent=t.cat;
    let h="";
    if(t.definition) h+=this.sec("Definition",`<p>${t.definition}</p>`);
    if(t.why) h+=this.sec("Why it is used",this.ul(t.why));
    if(t.problem) h+=this.sec("Problem it solves",`<div class="callout">${t.problem}</div>`);
    // visual
    h+=this.sec("Visual Diagram",`<div class="viz"><div id="vizHost"></div><div class="viz-cap" id="vizCap"></div></div>`);
    if(t.sections) t.sections.forEach(sec=> h+=this.sec(sec.title,this.ul(sec.items)));
    if(t.advantages) h+=this.sec("Advantages",this.ul(t.advantages,"good"));
    if(t.disadvantages) h+=this.sec("Disadvantages",this.ul(t.disadvantages,"bad"));
    if(t.best) h+=this.sec("Best Practices",this.ul(t.best,"good"));
    if(t.mistakes) h+=this.sec("Common Mistakes",this.ul(t.mistakes,"bad"));
    if(t.code) h+=this.sec("Code Example",`<div class="pre-lang">${t.code.lang}</div><pre></pre>`);
    if(t.interview) h+=this.sec("Interview Questions",this.ul(t.interview,"q"));
    if(t.companies) h+=this.sec("Real-World Companies",this.chips(t.companies));
    if(t.related) h+=this.sec("Related Concepts",this.chips(t.related,true));
    if(t.refs) h+=this.sec("References",`<div class="chips">`+t.refs.map(r=>`<a class="chip link" href="${r[1]}" target="_blank" rel="noopener">${r[0]} ↗</a>`).join("")+`</div>`);
    this.body.innerHTML=h; this.body.scrollTop=0;
    // set code text safely (avoids HTML escaping issues)
    if(t.code){ const pre=this.body.querySelector("pre"); if(pre)pre.textContent=t.code.text; }
    // related chip navigation
    this.body.querySelectorAll("[data-goto]").forEach(c=>c.onclick=()=>this.open(c.dataset.goto));
    // mount visual
    this.lab.mount(t.visual||"generic", $("vizHost"));
    // open panel
    this.panel.classList.add("open"); $("minimap").classList.add("shift"); $("zoomctl").classList.add("shift");
    this.app.setActiveCat(id);
  }
}

/* =====================================================================
   SearchEngine
   ===================================================================== */
class SearchEngine {
  constructor(app){ this.app=app; }
  run(q){
    q=q.trim().toLowerCase();
    document.querySelectorAll(".cat").forEach(c=>{ const id=c.dataset.id,t=T[id];
      const match=!q||t.title.toLowerCase().includes(q)||t.cat.toLowerCase().includes(q)||id.includes(q);
      c.classList.toggle("hidden",!match); c.classList.toggle("match",!!q&&match); });
    NODES.forEach(n=>{ const t=T[n.id],match=q&&(t.title.toLowerCase().includes(q)||n.id.includes(q));
      n.el.classList.toggle("match",!!match); if(match){ n.el.classList.remove("dim"); } });
    if(q){ const first=NODES.find(n=>{const t=T[n.id];return t.title.toLowerCase().includes(q)||n.id.includes(q);});
      if(first) this.app.canvas.focus(first.id,0.85); }
    else { NODES.forEach(n=>n.el.classList.remove("match")); }
  }
}

/* =====================================================================
   LearningEngine — guided left→right walkthrough
   ===================================================================== */
class LearningEngine {
  constructor(app){ this.app=app; this.on=false;
    this.steps=[
      ["users","Every request starts with a <b>user</b> — a browser, mobile app or another service. Traffic volume drives every design decision downstream."],
      ["dns","<b>DNS</b> resolves the domain (e.g. app.com) into an IP address, and can route users to the nearest / healthiest region."],
      ["cdn","The <b>CDN</b> serves cached static assets from an edge location near the user, cutting latency and offloading the origin."],
      ["load-balancer","The <b>Load Balancer</b> spreads incoming traffic across many servers, health-checks them, and removes failed nodes."],
      ["api-gateway","The <b>API Gateway</b> is the single entry point — handling routing, authentication, rate limiting and request aggregation."],
      ["authentication","<b>Authentication</b> verifies identity using JWT / OAuth2 so downstream services can trust the caller statelessly."],
      ["microservices","<b>Microservices</b> own their domain and data, deploy independently, and communicate via REST/gRPC or events."],
      ["kafka","<b>Kafka</b> decouples services with a durable event log — buffering spikes and enabling async, replayable processing."],
      ["redis","<b>Redis</b> caches hot data in memory for sub-millisecond reads, protecting the database from heavy read load."],
      ["database","The <b>Database</b> is the durable source of truth — scaled with replication (reads) and sharding (writes)."],
      ["monitoring","<b>Monitoring & Observability</b> (metrics, logs, traces) close the loop — detecting incidents and guiding scaling."],
    ]; this.i=0; }
  start(){ this.on=true; this.i=0; $("learn").style.display="block"; this.render(); }
  exit(){ this.on=false; $("learn").style.display="none"; this.app.clearHighlight(); }
  go(i){ this.i=Math.max(0,Math.min(this.steps.length-1,i)); this.render(); }
  render(){ const [id,txt]=this.steps[this.i];
    $("lStep").textContent=this.i+1; $("lTitle").textContent=T[id].title; $("lCount").textContent=`${this.i+1} / ${this.steps.length}`;
    $("lBody").innerHTML=txt; $("lProg").style.width=((this.i+1)/this.steps.length*100)+"%";
    $("lPrev").disabled=this.i===0; $("lNext").textContent=this.i===this.steps.length-1?"Finish ✓":"Next ▶";
    this.app.clearHighlight(); NODES.forEach(n=>n.el.classList.add("dim"));
    const n=NODES.find(x=>x.id===id); if(n){ n.el.classList.remove("dim"); n.el.classList.add("learn"); }
    this.app.canvas.focus(id,0.85);
    this.app.diag.edgePaths.forEach(e=>e.path.classList.toggle("hot",e.to===id||e.from===id));
  }
}

/* =====================================================================
   InterviewEngine — random questions
   ===================================================================== */
class InterviewEngine {
  constructor(app){ this.app=app; this.pool=[];
    Object.values(T).forEach(t=>{ if(t.interview) t.interview.forEach(q=>this.pool.push({q,id:t.id,title:t.title})); });
    this.cur=null; }
  open(){ $("quiz").style.display="flex"; this.next(); }
  close(){ $("quiz").style.display="none"; }
  next(){ this.cur=this.pool[randi(0,this.pool.length-1)]; const t=T[this.cur.id];
    $("qQ").textContent=this.cur.q; $("qTopic").textContent="· "+this.cur.title;
    const a=$("qA"); a.classList.remove("show");
    let ans=`<b>${t.title}</b> — ${t.definition||""}`;
    if(t.sections&&t.sections[0]) ans+="<br><br><b>"+t.sections[0].title+":</b> "+t.sections[0].items.map(x=>x.split("—")[0].trim()).join(", ")+".";
    if(t.best) ans+="<br><br><b>Best practice:</b> "+t.best[0]+".";
    a.innerHTML=ans;
  }
  reveal(){ $("qA").classList.add("show"); }
}

/* =====================================================================
   APP
   ===================================================================== */
class App {
  constructor(){
    this.canvas=new Canvas(this);
    this.diag=new DiagramRenderer($("world"),$("edges"));
    this.panel=new PopupPanel(this);
    this.search=new SearchEngine(this);
    this.learn=new LearningEngine(this);
    this.quiz=new InterviewEngine(this);
  }
  boot(){
    this.buildSidebar();
    this.diag.render();
    this.anim=new AnimationEngine($("edges"),this.diag.edgePaths); this.anim.start();
    this.canvas.bind(); this.canvas.buildMinimap(); this.canvas.apply(); this.canvas.fit();
    this.bindNodes(); this.bindUI(); this.bindKeys();
  }
  buildSidebar(){
    const list=$("catList");
    const order=["networking","api-gateway","load-balancer","caching","database","kafka","rabbitmq","redis","cdn",
      "authentication","authorization","rate-limiting","microservices","service-discovery","reverse-proxy",
      "consistent-hashing","cap-theorem","sharding","replication","indexing","sql","nosql","event-driven",
      "circuit-breaker","retry","saga","cqrs","event-sourcing","kubernetes","docker","monitoring","logging","tracing","security"];
    order.forEach(id=>{ const t=T[id]; if(!t)return; const c=el("div","cat");
      c.dataset.id=id; c.innerHTML=`<span class="c-ico">${t.icon}</span>${t.title}`;
      c.onclick=()=>{ this.panel.open(id); if(NODES.find(n=>n.id===id)) this.canvas.focus(id,0.85); };
      list.appendChild(c); });
  }
  setActiveCat(id){ document.querySelectorAll(".cat").forEach(c=>c.classList.toggle("active",c.dataset.id===id)); }
  bindNodes(){
    NODES.forEach(n=>{ n.el.addEventListener("click",e=>{ e.stopPropagation(); this.panel.open(n.id); });
      n.el.addEventListener("mouseenter",()=>{ if(!this.panel.panel.classList.contains("open")&&!this.learn.on) this.highlight(n.id); });
      n.el.addEventListener("mouseleave",()=>{ if(!this.panel.panel.classList.contains("open")&&!this.learn.on) this.clearHighlight(); });
    });
    $("viewport").addEventListener("mousedown",e=>{ if(!e.target.closest(".node")&&!this.panel.panel.classList.contains("open")) this.clearHighlight(); });
  }
  highlight(id){
    // Concepts in the sidebar that aren't nodes on the architecture canvas
    // (e.g. Sharding, CAP Theorem, SQL) have nothing to highlight — just clear.
    if(!NODES.find(n=>n.id===id)){ this.clearHighlight(); return; }
    const rel=new Set([id]); const out={},inm={};
    NODES.forEach(n=>{out[n.id]=[];inm[n.id]=[];}); NEDGES.forEach(([a,b])=>{out[a]&&out[a].push(b);inm[b]&&inm[b].push(a);});
    const walk=(x,adj)=>adj[x]&&adj[x].forEach(y=>{if(!rel.has(y)){rel.add(y);walk(y,adj);}});
    walk(id,out); walk(id,inm);
    NODES.forEach(n=>{ n.el.classList.remove("glow","dim","learn"); n.el.classList.add(rel.has(n.id)?"glow":"dim"); });
    this.diag.edgePaths.forEach(e=>e.path.classList.toggle("hot",rel.has(e.from)&&rel.has(e.to)));
  }
  clearHighlight(){ NODES.forEach(n=>n.el.classList.remove("glow","dim","learn")); this.diag.edgePaths.forEach(e=>e.path.classList.remove("hot")); }
  bindUI(){
    $("btnZin").onclick=$("zin2").onclick=()=>this.canvas.zoomBy(1.15);
    $("btnZout").onclick=$("zout2").onclick=()=>this.canvas.zoomBy(1/1.15);
    $("btnFit").onclick=$("zfit2").onclick=$("toolFit").onclick=()=>this.canvas.fit();
    $("phClose").onclick=()=>{ this.panel.close(); this.setActiveCat(null); };
    $("search").addEventListener("input",e=>this.search.run(e.target.value));
    document.querySelectorAll(".tool").forEach(t=>t.onclick=()=>{ document.querySelectorAll(".tool").forEach(x=>x.classList.remove("active")); t.classList.add("active"); });
    // learning
    $("btnLearn").onclick=()=>this.learn.start();
    $("lNext").onclick=()=>{ if(this.learn.i===this.learn.steps.length-1) this.learn.exit(); else this.learn.go(this.learn.i+1); };
    $("lPrev").onclick=()=>this.learn.go(this.learn.i-1);
    $("lExit").onclick=()=>this.learn.exit();
    // quiz
    $("btnQuiz").onclick=()=>this.quiz.open();
    $("qClose").onclick=()=>this.quiz.close();
    $("qReveal").onclick=()=>this.quiz.reveal();
    $("qNext").onclick=()=>this.quiz.next();
    $("qOpen").onclick=()=>{ this.quiz.close(); this.panel.open(this.quiz.cur.id); if(NODES.find(n=>n.id===this.quiz.cur.id))this.canvas.focus(this.quiz.cur.id,0.85); };
    $("quiz").addEventListener("click",e=>{ if(e.target.id==="quiz") this.quiz.close(); });
  }
  bindKeys(){
    window.addEventListener("keydown",e=>{ if(e.target.tagName==="INPUT")return;
      if(e.key==="l"||e.key==="L") this.learn.on?this.learn.exit():this.learn.start();
      else if(e.key==="q"||e.key==="Q"){ $("quiz").style.display==="flex"?this.quiz.close():this.quiz.open(); }
      else if(e.key==="+"||e.key==="=") this.canvas.zoomBy(1.15);
      else if(e.key==="-") this.canvas.zoomBy(1/1.15);
      else if(e.key==="Escape"){ this.panel.close(); this.setActiveCat(null); this.quiz.close(); if(this.learn.on)this.learn.exit(); }
      else if(e.key==="ArrowRight"&&this.learn.on) this.learn.go(this.learn.i+1);
      else if(e.key==="ArrowLeft"&&this.learn.on) this.learn.go(this.learn.i-1);
    });
  }
}

const app=new App(); app.boot();
window.addEventListener("resize",()=>app.canvas.updateMinimap());
</script>
</body>
</html>
