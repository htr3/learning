<script src="../assets/concept.js"></script>
<script>
"use strict";

function diagram(host){
  const svg=S("svg",{viewBox:"0 0 620 200"});host.appendChild(svg);
  const lbl=TX(310,18,"",{fill:"#c4a2ff","font-size":13,"text-anchor":"middle","font-weight":700});svg.appendChild(lbl);
  const sub=TX(310,190,"",{fill:"#8b8b93","font-size":11,"text-anchor":"middle"});svg.appendChild(sub);
  const g=S("g",{});svg.appendChild(g);
  let phase=0,timer=0,running=false,raf,last;
  function render(){g.innerHTML="";
    g.appendChild(S("rect",{x:32,y:80,width:110,height:40,rx:8,fill:"#161619",stroke:"#3a3a42","stroke-width":2}));g.appendChild(TX(87,104,"Browser",{fill:"#e4e4e7","font-size":11,"text-anchor":"middle"}));
    g.appendChild(S("rect",{x:478,y:80,width:110,height:40,rx:8,fill:"rgba(124,58,237,.2)",stroke:"#7C3AED","stroke-width":2}));g.appendChild(TX(533,104,"Server",{fill:"#e4e4e7","font-size":11,"text-anchor":"middle"}));
    if(phase===0){g.appendChild(S("line",{x1:142,y1:92,x2:478,y2:92,stroke:"#fbbf24","stroke-width":2,"marker-end":"url(#a)"}));
      g.appendChild(TX(310,84,"GET /chat  Upgrade: websocket",{fill:"#fbbf24","font-size":10,"text-anchor":"middle"}));
      g.appendChild(S("line",{x1:478,y1:112,x2:142,y2:112,stroke:"#fbbf24","stroke-width":1.6,"stroke-dasharray":"5 4","marker-end":"url(#a)"}));
      g.appendChild(TX(310,128,"101 Switching Protocols",{fill:"#8b8b93","font-size":10,"text-anchor":"middle"}));
      lbl.textContent="1) handshake — upgrade HTTP to WebSocket";lbl.setAttribute("fill","#fbbf24");sub.textContent="one HTTP request/response switches the connection to the WS protocol";}
    else{g.appendChild(S("line",{x1:142,y1:100,x2:478,y2:100,stroke:"#34d399","stroke-width":6}));
      g.appendChild(S("circle",{cx:250,cy:88,r:6,fill:"#34d399"}));g.appendChild(S("circle",{cx:370,cy:112,r:6,fill:"#38bdf8"}));
      g.appendChild(TX(310,72,"⇄ full-duplex frames",{fill:"#34d399","font-size":11,"text-anchor":"middle","font-weight":700}));
      lbl.textContent="2) persistent full-duplex channel";lbl.setAttribute("fill","#34d399");sub.textContent="both sides push messages anytime over the same open TCP connection";}}
  function step(){phase=(phase+1)%2;timer=2.6;render();}
  function loop(now){if(!running)return;const dt=(now-last)/1000;last=now;timer-=dt;if(timer<=0)step();raf=requestAnimationFrame(loop);}
  const io=new IntersectionObserver(e=>{if(e[0].isIntersecting){if(!running){running=true;last=performance.now();raf=requestAnimationFrame(loop);}}else{running=false;cancelAnimationFrame(raf);}},{threshold:.15});
  io.observe(host);render();
}

function sim(root){
  root.innerHTML=`<p class="lead" style="margin-bottom:14px">Open a WebSocket, then push messages in both directions over the single persistent connection. Compare the cost against <b>polling</b>: to stay this fresh, polling would fire a brand-new HTTP request every interval — most returning nothing. WebSockets push instantly with almost no overhead.</p>
  <div class="pg">
    <div class="pg-controls">
      <div class="pg-btns"><button id="pgConn" class="go">Open connection</button></div>
      <div class="pg-btns" style="margin-top:8px"><button id="pgSend">Client → send</button><button id="pgPush">Server → push</button></div>
      <div class="pg-btns" style="margin-top:8px"><button id="pgClose">Close</button><button id="pgReset">↺ Reset</button></div>
      <p style="font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.5">A WebSocket frame has only a few bytes of overhead vs a full HTTP request/response (headers, cookies) on every poll. That's why real-time apps use WS/SSE, not polling.</p>
    </div>
    <div class="pg-stage">
      <div class="pg-stats">
        <div class="pg-stat"><div class="k">State</div><div class="v ac" id="pgState">CLOSED</div></div>
        <div class="pg-stat"><div class="k">Messages</div><div class="v ok" id="pgMsgs">0</div></div>
        <div class="pg-stat"><div class="k">WS overhead</div><div class="v" id="pgWS">0 B</div></div>
        <div class="pg-stat"><div class="k">Polling would send</div><div class="v bad" id="pgPoll">0 reqs</div></div>
      </div>
      <div id="pgViz"></div>
      <div class="pg-log" id="pgLog"></div>
    </div>
  </div>`;

  const W=560,H=150,cx1=70,cx2=490,cy=75;const svg=S("svg",{viewBox:"0 0 "+W+" "+H});$("pgViz").appendChild(svg);
  let open,msgs,frames,raf=null,pollReqs;
  function reset(){open=false;msgs=0;frames=[];pollReqs=0;if(raf)cancelAnimationFrame(raf);raf=null;draw();stats();$("pgLog").innerHTML="";log("connection closed — click Open","ac");}
  function connect(){if(open){log("already open","wa");return;}
    log("→ GET /chat  Upgrade: websocket","wa");log("← 101 Switching Protocols — handshake done","ok");open=true;stats();draw();}
  function frame(dir,label){if(!open){log("open the connection first","bad");return;}
    frames.push({dir,p:0,alive:true});msgs++;pollReqs+=0;log((dir>0?"client → server":"server → client")+" frame: \""+label+"\"","ac");stats();animate();}
  function send(){frame(1,"hello #"+(msgs+1));}
  function push(){frame(-1,"update #"+(msgs+1));}
  function close(){if(!open){log("already closed","wa");return;}open=false;log("connection closed (close frame)","bad");stats();draw();}
  function animate(){if(raf)cancelAnimationFrame(raf);let last=performance.now();
    function fr(now){const dt=(now-last)/1000;last=now;frames.forEach(m=>{if(m.p<1){m.p+=dt*0.8;if(m.p>=1)m.p=1;}});draw();
      if(frames.some(m=>m.p<1))raf=requestAnimationFrame(fr);else raf=null;}
    raf=requestAnimationFrame(fr);}
  function draw(){svg.innerHTML="";
    svg.appendChild(S("rect",{x:cx1-42,y:cy-20,width:84,height:40,rx:8,fill:"#161619",stroke:"#3a3a42","stroke-width":2}));
    svg.appendChild(TX(cx1,cy+4,"Client",{fill:"#e4e4e7","font-size":11,"text-anchor":"middle"}));
    svg.appendChild(S("rect",{x:cx2-42,y:cy-20,width:84,height:40,rx:8,fill:"rgba(124,58,237,.2)",stroke:"#7C3AED","stroke-width":2}));
    svg.appendChild(TX(cx2,cy+4,"Server",{fill:"#e4e4e7","font-size":11,"text-anchor":"middle"}));
    svg.appendChild(S("line",{x1:cx1+42,y1:cy,x2:cx2-42,y2:cy,stroke:open?"#34d399":"#242a33","stroke-width":open?5:2,"stroke-dasharray":open?"none":"5 5"}));
    svg.appendChild(TX(W/2,28,open?"● OPEN — full-duplex":"○ closed",{fill:open?"#34d399":"#6b6b73","font-size":11,"text-anchor":"middle","font-weight":700}));
    frames.forEach(m=>{if(m.p>=1)return;const x=m.dir>0?cx1+42+(cx2-cx1-84)*m.p:cx2-42-(cx2-cx1-84)*m.p;
      svg.appendChild(S("circle",{cx:x,cy:cy+(m.dir>0?-8:8),r:6,fill:m.dir>0?"#34d399":"#38bdf8"}));});}
  function stats(){$("pgState").textContent=open?"OPEN":"CLOSED";$("pgState").className="v "+(open?"ok":"ac");
    $("pgMsgs").textContent=msgs;$("pgWS").textContent=(msgs*6)+" B";
    $("pgPoll").textContent=(msgs*1)+" reqs (~"+(msgs*350)+" B)";}
  function log(m,c){const l=$("pgLog");const d=el("div",c||"",m);l.insertBefore(d,l.firstChild);while(l.children.length>22)l.removeChild(l.lastChild);}

  $("pgConn").onclick=connect;$("pgSend").onclick=send;$("pgPush").onclick=push;$("pgClose").onclick=close;$("pgReset").onclick=reset;
  reset();
}

const DATA={
  badge:"🔌",title:"WebSockets",category:"Networking",difficulty:"Medium",readingTime:"9 min",
  eyebrow:"Full-Duplex Real-Time Channel",
  tagline:"A persistent, <b>bidirectional</b> connection between browser and server over a single TCP socket. After a one-time HTTP <b>upgrade</b> handshake, both sides push messages instantly — no polling, minimal overhead — powering chat, live dashboards, games, and collaboration.",
  pills:["<b>Full-duplex</b>","<b>Persistent</b> TCP","<b>Low</b> overhead","<b>ws:// / wss://</b>"],
  overview:"WebSockets provide a long-lived, two-way communication channel over one TCP connection. It starts as a normal HTTP request with an <code>Upgrade: websocket</code> header; the server responds <b>101 Switching Protocols</b>, and from then on the same connection speaks the WebSocket framing protocol instead of HTTP. Both client and server can send <b>messages (frames)</b> at any time — that's <b>full-duplex</b> — without the request/response round-trips or repeated headers of HTTP. Each frame carries only a few bytes of overhead, so it's dramatically cheaper than polling for frequent updates. WebSockets are ideal when the server needs to push data proactively and low latency matters: chat, notifications, live sports/finance tickers, multiplayer games, and collaborative editing.",
  problem:"HTTP is request/response and client-initiated: the server can't push. To simulate real-time, apps used short polling (repeated requests, mostly empty, high overhead) or long polling (hold requests open, complex). Both waste resources and add latency. WebSockets give a genuine push channel with tiny per-message overhead, solving real-time delivery cleanly.",
  diagram,diagramCaption:"An HTTP upgrade handshake switches the connection to a persistent full-duplex WebSocket.",
  how:[
    "Client sends an HTTP GET with Upgrade: websocket and a Sec-WebSocket-Key.",
    "Server validates and responds 101 Switching Protocols with Sec-WebSocket-Accept.",
    "The TCP connection now carries WebSocket frames instead of HTTP.",
    "Either side sends text/binary message frames anytime; ping/pong frames keep it alive.",
    "Either side sends a close frame to end; apps add heartbeats and auto-reconnect for resilience."
  ],
  complexity:[["Handshake","1 HTTP upgrade → 101"],["Direction","full-duplex"],["Per-message overhead","~2–14 B frame"],["Scheme","ws:// / wss:// (TLS)"]],
  advantages:["True server push, low latency","Full-duplex over one connection","Tiny per-message overhead vs polling","Text & binary messages","Widely supported in browsers"],
  disadvantages:["Stateful, long-lived conns are harder to scale","No built-in reconnection/auto-retry (you add it)","Proxies/load balancers need WS support & sticky routing","No automatic request/response semantics or caching","Connection limits & resource use at massive scale"],
  tradeoffs:"WebSockets trade HTTP's stateless simplicity for real-time power. Persistent connections mean the server holds state and memory per client, complicating horizontal scaling, deploys (draining connections), and load balancing (L7-aware, sticky). You also reimplement things HTTP gives free: reconnection, backoff, heartbeats, message acknowledgment, and auth refresh. If you only need server→client updates (not client→server over the same channel), Server-Sent Events (SSE) are simpler and auto-reconnect over plain HTTP. Use WebSockets when you truly need low-latency bidirectional traffic.",
  whenNot:"Don't use WebSockets for one-directional server→client streams where SSE suffices (simpler, auto-reconnect, works over HTTP/2), for classic request/response APIs (use REST/gRPC), for infrequent updates where a periodic fetch is fine, or where infrastructure (proxies, serverless platforms) doesn't handle long-lived connections well.",
  sim,
  code:{
"Browser":`const ws = new WebSocket("wss://example.com/chat");\nws.onopen    = () => ws.send(JSON.stringify({ type: "join", room: "42" }));\nws.onmessage = (e) => render(JSON.parse(e.data));   // server PUSHED this\nws.onclose   = () => scheduleReconnect();            // you add reconnect logic\nws.onerror   = (e) => console.error(e);\n\n// send anytime — full-duplex, no request/response needed\nsendBtn.onclick = () => ws.send(JSON.stringify({ type: "msg", text: input.value }));`,
"Node (ws)":`import { WebSocketServer } from "ws";\nconst wss = new WebSocketServer({ port: 8080 });\nwss.on("connection", (socket) => {\n  socket.on("message", (data) => {\n    const msg = JSON.parse(data);\n    // broadcast to everyone (server push)\n    for (const client of wss.clients)\n      if (client.readyState === 1) client.send(JSON.stringify(msg));\n  });\n  // heartbeat to detect dead peers\n  const t = setInterval(() => socket.ping(), 30000);\n  socket.on("close", () => clearInterval(t));\n});`,
"Handshake":`# The upgrade is a normal HTTP request that switches protocols:\nGET /chat HTTP/1.1\nHost: example.com\nUpgrade: websocket\nConnection: Upgrade\nSec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\nSec-WebSocket-Version: 13\n\nHTTP/1.1 101 Switching Protocols\nUpgrade: websocket\nConnection: Upgrade\nSec-WebSocket-Accept: s3pPLMBiTxaQ9kYGzzhZRbK+xOo=\n# ...after this the TCP connection carries WebSocket frames, not HTTP.`
  },
  realWorld:[
    ["Slack / Discord","Real-time chat, presence, and typing indicators over WebSockets."],
    ["Trading & crypto tickers","Live price streams pushed to browsers with minimal latency."],
    ["Google Docs / Figma","Collaborative editing syncs edits bidirectionally in real time."],
    ["Multiplayer games","Low-latency state updates between players and servers."],
    ["Live dashboards / notifications","Push metrics, alerts, and events instantly to clients."]
  ],
  interview:[
    ["basic","What is a WebSocket and how does it differ from HTTP?","A WebSocket is a persistent, full-duplex connection over a single TCP socket. Unlike HTTP's client-initiated request/response, either side can send messages at any time with minimal overhead. It's designed for real-time, bidirectional communication rather than discrete request/response calls."],
    ["basic","How is a WebSocket connection established?","It begins as an HTTP GET with Upgrade: websocket and Connection: Upgrade headers plus a Sec-WebSocket-Key. The server replies 101 Switching Protocols with a derived Sec-WebSocket-Accept, and the connection then carries WebSocket frames instead of HTTP. This reuses port 443/80 and passes through most proxies."],
    ["inter","WebSockets vs SSE vs long polling — when to use each?","Long polling: emulate push with repeated held HTTP requests — simple but inefficient and higher latency. SSE: one-way server→client stream over HTTP with automatic reconnection and Last-Event-ID — great for feeds/notifications. WebSockets: full bidirectional, lowest latency — use when the client also sends frequently (chat, games, collaboration). Pick the simplest that meets the direction/latency needs."],
    ["inter","Why are WebSockets harder to scale than stateless HTTP?","Each client holds a long-lived connection, so servers keep per-connection state and memory, and you can't freely rebalance requests. You need L7 load balancers that support WS with sticky routing, careful connection draining on deploys, and often a pub/sub backplane (Redis, Kafka) so any node can deliver a message to a client connected elsewhere."],
    ["adv","How do you deliver a message to a user connected to a different server instance?","Use a shared pub/sub backplane. Each app instance subscribes to channels (e.g., per-user or per-room) in Redis/Kafka/NATS. When any instance needs to send to a user, it publishes to that channel; the instance holding that user's WebSocket receives it and pushes it down the socket. This decouples message routing from which node holds the connection."],
    ["adv","What resilience concerns must a WebSocket client handle?","Automatic reconnection with exponential backoff (WS gives none), heartbeats (ping/pong) to detect dead connections, buffering/resending unacked messages, resuming state after reconnect (e.g., request missed events since a last-seen id), and refreshing auth tokens on long-lived connections. Servers must handle idle timeouts and connection draining during deploys."],
    ["sd","Design the real-time layer for a chat app.","Clients connect via wss:// to a fleet of WebSocket gateway servers behind an L7 LB with sticky routing. On connect, authenticate and subscribe the user to their room channels. Use Redis/Kafka pub/sub as a backplane so a message sent on any node reaches the node holding each recipient's socket. Persist messages to a store for history and offline delivery; add heartbeats, reconnection with resume-since-id, and per-room fan-out. Fall back to SSE/long-polling where WS is blocked."]
  ],
  mistakes:["Not implementing reconnection/backoff and heartbeats (connections silently die).","Assuming a stateless load balancer works — WS needs L7 + sticky routing.","No pub/sub backplane, so messages can't reach users on other nodes.","Using WebSockets when one-way SSE would be simpler.","Ignoring auth token expiry on long-lived connections."],
  best:["Use wss:// (TLS) and authenticate at handshake; refresh tokens periodically.","Add heartbeats (ping/pong) and client reconnection with exponential backoff.","Scale out with a Redis/Kafka pub/sub backplane and L7 sticky LB.","Buffer and resume with a last-seen event id after reconnects.","Prefer SSE when you only need server→client updates."],
  related:[["Server-Sent Events","📡","One-way server push","sse.html"],["gRPC","🔗","Bidirectional streaming RPC","grpc.html"],["HTTP/2 & HTTP/3","🚀","Underlying transport","http2-3.html"],["Real-Time Chat","💬","WebSockets in a system","chat-system.html"],["TCP & UDP","📶","The transport beneath","tcp-udp.html"],["Notification System","🔔","Push delivery","notification-system.html"]]
};
renderConcept(DATA);
</script>
