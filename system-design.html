<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>System Design — Architecture Whiteboard</title>
<style>
  :root {
    --bg: #111111;
    --panel: #1a1a1c;
    --panel-2: #202024;
    --line: #f4f4f5;
    --muted: #8b8b93;
    --accent: #7C3AED;
    --accent-soft: rgba(124, 58, 237, 0.35);
    --gray: #2a2a30;
    --gray-border: #3a3a42;
    --ok: #34d399;
    --warn: #fbbf24;
    --bad: #f87171;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--line);
    font-family: "Segoe UI", "Inter", system-ui, -apple-system, sans-serif;
    overflow: hidden;
    user-select: none;
  }

  /* ---------------- TOP BAR ---------------- */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 52px;
    display: flex; align-items: center; gap: 14px;
    padding: 0 16px; z-index: 40;
    background: rgba(20,20,22,0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--gray-border);
  }
  #topbar .brand {
    display: flex; align-items: center; gap: 10px;
    font-weight: 600; font-size: 15px; letter-spacing: .2px;
  }
  #topbar .brand .logo {
    width: 22px; height: 22px; border-radius: 6px;
    background: linear-gradient(135deg, var(--accent), #a855f7);
    box-shadow: 0 0 14px var(--accent-soft);
  }
  #topbar .spacer { flex: 1; }
  .tbtn {
    background: var(--panel-2); color: var(--line);
    border: 1px solid var(--gray-border); border-radius: 8px;
    padding: 7px 12px; font-size: 12.5px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all .15s ease;
  }
  .tbtn:hover { border-color: var(--accent); color: #fff; box-shadow: 0 0 10px var(--accent-soft); }
  .tbtn.primary { background: var(--accent); border-color: var(--accent); }
  .tbtn.primary:hover { background: #8b48f0; }
  #zoomLabel {
    font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted);
    min-width: 46px; text-align: center;
  }

  /* ---------------- LEFT TOOLBAR ---------------- */
  #toolbar {
    position: fixed; left: 14px; top: 50%; transform: translateY(-50%);
    z-index: 30; display: flex; flex-direction: column; gap: 6px;
    background: var(--panel); border: 1px solid var(--gray-border);
    border-radius: 14px; padding: 8px; box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  .tool {
    width: 40px; height: 40px; border-radius: 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); background: transparent; border: none;
    transition: all .15s ease;
  }
  .tool:hover { background: var(--panel-2); color: #fff; }
  .tool.active { background: var(--accent-soft); color: #fff; box-shadow: inset 0 0 0 1px var(--accent); }
  .tool svg { width: 20px; height: 20px; }
  .tool-sep { height: 1px; background: var(--gray-border); margin: 4px 2px; }

  /* ---------------- CANVAS ---------------- */
  #viewport {
    position: fixed; inset: 52px 0 0 0; overflow: hidden;
    cursor: grab;
    background:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,0.045) 1px, transparent 0);
    background-size: 26px 26px;
  }
  #viewport.grabbing { cursor: grabbing; }
  #world {
    position: absolute; top: 0; left: 0;
    transform-origin: 0 0; will-change: transform;
  }
  #edges {
    position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none;
  }

  .edge-path {
    fill: none; stroke: rgba(244,244,245,0.28);
    stroke-width: 1.6; transition: stroke .2s, stroke-width .2s;
  }
  .edge-path.hot { stroke: var(--accent); stroke-width: 2.4; filter: drop-shadow(0 0 6px var(--accent)); }
  .edge-dot { fill: #fff; filter: drop-shadow(0 0 4px rgba(255,255,255,.9)); }
  .edge-dot.hot { fill: #c4a2ff; filter: drop-shadow(0 0 6px var(--accent)); }

  /* ---------------- NODES ---------------- */
  .node {
    position: absolute; background: var(--gray);
    border: 1px solid var(--gray-border); border-radius: 12px;
    padding: 10px 12px; cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,.45);
    transition: box-shadow .2s, border-color .2s, transform .12s, background .2s;
  }
  .node:hover { transform: translateY(-2px); }
  .node .n-head { display: flex; align-items: center; gap: 8px; }
  .node .n-icon {
    width: 26px; height: 26px; border-radius: 7px; flex: none;
    display: flex; align-items: center; justify-content: center;
    background: var(--panel-2); font-size: 15px;
    border: 1px solid var(--gray-border);
  }
  .node .n-title { font-size: 13px; font-weight: 600; line-height: 1.15; }
  .node .n-sub { font-size: 10.5px; color: var(--muted); margin-top: 1px; }
  .node .n-tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
  .node .tag {
    font-size: 9.5px; color: var(--muted); background: var(--panel-2);
    border: 1px solid var(--gray-border); border-radius: 5px; padding: 2px 5px;
  }
  .node .n-metrics {
    margin-top: 8px; display: flex; gap: 8px; font-size: 9.5px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .node .n-metrics b { color: #d4d4d8; font-weight: 600; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .dot.warn { background: var(--warn); box-shadow: 0 0 6px var(--warn); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 6px var(--bad); }

  /* highlight states */
  .node.glow {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 0 24px var(--accent-soft);
    background: #241a33;
  }
  .node.dim { opacity: .28; }
  .node.active-pulse .n-icon { animation: iconpulse 1.8s ease-in-out infinite; }
  @keyframes iconpulse {
    0%,100% { box-shadow: 0 0 0 rgba(124,58,237,0); }
    50% { box-shadow: 0 0 12px var(--accent); }
  }
  @keyframes dbpulse {
    0%,100% { box-shadow: 0 6px 18px rgba(0,0,0,.45); }
    50% { box-shadow: 0 6px 18px rgba(0,0,0,.45), 0 0 18px rgba(52,211,153,.35); }
  }
  .node.db { animation: dbpulse 2.6s ease-in-out infinite; }

  /* section labels */
  .section-label {
    position: absolute; font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--muted);
    font-weight: 600;
  }
  .section-label::before {
    content: ""; display: inline-block; width: 18px; height: 2px;
    background: var(--accent); margin-right: 8px; vertical-align: middle;
    border-radius: 2px;
  }

  /* users cluster */
  .user-ico { font-size: 20px; filter: grayscale(.2); }

  /* ---------------- POPUP ---------------- */
  #popup {
    position: fixed; z-index: 60; width: 300px;
    background: var(--panel); border: 1px solid var(--gray-border);
    border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.6);
    display: none; overflow: hidden;
  }
  #popup .p-head {
    padding: 14px 16px; display: flex; align-items: center; gap: 10px;
    background: linear-gradient(135deg, rgba(124,58,237,.25), transparent);
    border-bottom: 1px solid var(--gray-border);
  }
  #popup .p-head .p-ico {
    width: 34px; height: 34px; border-radius: 9px; display: flex;
    align-items: center; justify-content: center; font-size: 18px;
    background: var(--panel-2); border: 1px solid var(--gray-border);
  }
  #popup .p-title { font-size: 15px; font-weight: 700; }
  #popup .p-cat { font-size: 11px; color: var(--accent); }
  #popup .p-close {
    margin-left: auto; cursor: pointer; color: var(--muted);
    width: 26px; height: 26px; border-radius: 7px; display: flex;
    align-items: center; justify-content: center; font-size: 18px;
  }
  #popup .p-close:hover { background: var(--panel-2); color: #fff; }
  #popup .p-body { padding: 14px 16px; }
  #popup .p-purpose { font-size: 12.5px; color: #d4d4d8; line-height: 1.5; margin-bottom: 12px; }
  #popup .p-row {
    display: flex; justify-content: space-between; font-size: 12px;
    padding: 6px 0; border-top: 1px solid var(--gray);
  }
  #popup .p-row .k { color: var(--muted); }
  #popup .p-row .v { font-weight: 600; font-variant-numeric: tabular-nums; }
  #popup .p-deps { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 5px; }
  #popup .p-deps .dep {
    font-size: 10.5px; background: var(--panel-2); border: 1px solid var(--gray-border);
    border-radius: 6px; padding: 3px 7px; color: #c9c9d1;
  }

  /* ---------------- MINIMAP ---------------- */
  #minimap {
    position: fixed; right: 14px; bottom: 14px; z-index: 30;
    width: 210px; height: 130px; background: rgba(16,16,18,.9);
    border: 1px solid var(--gray-border); border-radius: 10px;
    overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  #minimap svg { width: 100%; height: 100%; display: block; }
  #mm-view { fill: rgba(124,58,237,.18); stroke: var(--accent); stroke-width: 1.5; }
  #mm-node { fill: rgba(255,255,255,.35); }

  /* ---------------- ZOOM CONTROLS ---------------- */
  #zoomctl {
    position: fixed; right: 14px; bottom: 156px; z-index: 30;
    display: flex; flex-direction: column; gap: 6px;
  }
  #zoomctl button {
    width: 36px; height: 36px; border-radius: 9px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--gray-border);
    color: var(--line); font-size: 18px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  #zoomctl button:hover { border-color: var(--accent); box-shadow: 0 0 10px var(--accent-soft); }

  .hint {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    z-index: 20; font-size: 11.5px; color: var(--muted);
    background: rgba(20,20,22,.8); border: 1px solid var(--gray-border);
    padding: 6px 12px; border-radius: 20px; backdrop-filter: blur(6px);
  }

  /* page transition overlay */
  #page-fade {
    position: fixed; inset: 0; z-index: 200; background: var(--bg);
    opacity: 1; pointer-events: none; transition: opacity .45s ease;
  }
  #page-fade.hide { opacity: 0; }
  #page-fade.show { opacity: 1; }

  /* "open page" affordance on nodes that deep-link */
  .node.has-page::after {
    content: "↗"; position: absolute; top: 8px; right: 10px;
    font-size: 12px; color: var(--accent); opacity: .8;
  }
  .node.has-page { border-color: var(--accent); }
</style>
</head>

function applyTransform() {

/* =====================================================================
   RENDERER  — builds section labels and node cards
   ===================================================================== */
function healthDot(h) {
  const cls = h === "bad" ? "bad" : h === "warn" ? "warn" : "ok";
  return `<span class="dot ${cls}"></span>`;
}

function render() {
  // section labels
  SECTIONS.forEach(s => {
    const el = document.createElement("div");
    el.className = "section-label";
    el.textContent = s.t;
    el.style.left = s.x + "px";
    el.style.top = s.y + "px";
    world.appendChild(el);
  });

  // nodes
  NODES.forEach(n => {
    const el = document.createElement("div");
    el.className = "node" + (n.pulse ? " active-pulse" : "") + (n.db ? " db" : "") + (n.page ? " has-page" : "");
    el.id = "node-" + n.id;
    el.style.left = n.x + "px";
    el.style.top = n.y + "px";
    el.style.width = n.w + "px";
    el.dataset.id = n.id;

    let html = `<div class="n-head">
        <div class="n-icon">${n.icon}</div>
        <div>
          <div class="n-title">${healthDot(n.health)} ${n.title}</div>
          ${n.sub ? `<div class="n-sub">${n.sub}</div>` : ""}
        </div>
      </div>`;

    if (n.tags) {
      html += `<div class="n-tags">${n.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>`;
    }
    if (n.metrics) {
      html += `<div class="n-metrics">
        <span>CPU <b>${n.metrics.cpu}%</b></span>
        <span>MEM <b>${n.metrics.mem}%</b></span>
        <span>${n.health.toUpperCase()}</span>
      </div>`;
    }
    el.innerHTML = html;
    world.appendChild(el);

    // events
    el.addEventListener("mouseenter", () => highlightDeps(n.id));
    el.addEventListener("mouseleave", clearHighlight);
    el.addEventListener("click", (e) => { e.stopPropagation(); componentClick(n.id, el); });
  });

  // measure real heights so edges connect precisely
  NODES.forEach(n => {
    const el = document.getElementById("node-" + n.id);
    n.h = el.offsetHeight;
    n.w = el.offsetWidth;
  });

  drawConnections();
  buildMinimap();
}

/* =====================================================================
   drawConnections()  — SVG hand-drawn style bezier paths + arrowheads
   ===================================================================== */
function handPath(x1, y1, x2, y2) {
  // slightly wobbly bezier for a hand-drawn feel
  const dx = (x2 - x1);
  const c = Math.max(40, Math.abs(dx) * 0.45);
  const j = 4; // jitter
  const mx = (x1 + x2) / 2 + (Math.random() * j - j/2);
  const my = (y1 + y2) / 2 + (Math.random() * j*2 - j);
  return `M ${x1} ${y1} C ${x1 + c} ${y1}, ${mx - c*0.3} ${my}, ${mx} ${my} S ${x2 - c} ${y2}, ${x2} ${y2}`;
}

let edgeEls = [];
function drawConnections() {
  edgesSvg.innerHTML = "";
  edgeEls = [];

  // arrowhead marker defs
  const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
  defs.innerHTML = `
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="rgba(244,244,245,0.45)"/>
    </marker>`;
  edgesSvg.appendChild(defs);

  EDGES.forEach(([a, b], i) => {
    const na = nodeMap[a], nb = nodeMap[b];
    if (!na || !nb) return;
    // connect from right-center of source to left-center of target (fallback by geometry)
    let x1, y1, x2, y2;
    const aCx = na.x + na.w/2, bCx = nb.x + nb.w/2;
    if (bCx >= aCx) { x1 = na.x + na.w; y1 = na.y + na.h/2; x2 = nb.x; y2 = nb.y + nb.h/2; }
    else            { x1 = na.x;         y1 = na.y + na.h/2; x2 = nb.x + nb.w; y2 = nb.y + nb.h/2; }

    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", handPath(x1, y1, x2, y2));
    path.setAttribute("class", "edge-path");
    path.setAttribute("marker-end", "url(#arrow)");
    path.dataset.from = a;
    path.dataset.to = b;
    edgesSvg.appendChild(path);
    edgeEls.push({ from:a, to:b, path });
  });

  animateTraffic();
}

/* =====================================================================
   animateTraffic()  — white packets moving along every path
   ===================================================================== */
let packets = [];
function animateTraffic() {
  // remove old packets
  packets.forEach(p => p.dot.remove());
  packets = [];

  edgeEls.forEach((e, i) => {
    const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    dot.setAttribute("r", "3");
    dot.setAttribute("class", "edge-dot");
    edgesSvg.appendChild(dot);
    const len = e.path.getTotalLength();
    packets.push({
      dot, path: e.path, len,
      // stagger so packets fire roughly every 2s, offset per edge
      offset: (i * 0.14) % 1,
      speed: 0.12 + Math.random() * 0.05,   // fraction per second
      from: e.from, to: e.to
    });
  });
}

let lastT = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  packets.forEach(p => {
    p.offset = (p.offset + p.speed * dt) % 1;
    const pt = p.path.getPointAtLength(p.offset * p.len);
    p.dot.setAttribute("cx", pt.x);
    p.dot.setAttribute("cy", pt.y);
  });
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* =====================================================================
   HOVER — highlight upstream + downstream dependencies (glow purple)
   ===================================================================== */
function collect(id, adj, set) {
  adj[id].forEach(next => {
    if (!set.has(next)) { set.add(next); collect(next, adj, set); }
  });
}
function highlightDeps(id) {
  const related = new Set([id]);
  collect(id, outAdj, related); // downstream
  collect(id, inAdj, related);  // upstream

  NODES.forEach(n => {
    const el = document.getElementById("node-" + n.id);
    if (related.has(n.id)) { el.classList.add("glow"); el.classList.remove("dim"); }
    else { el.classList.add("dim"); el.classList.remove("glow"); }
  });

  edgeEls.forEach(e => {
    const hot = related.has(e.from) && related.has(e.to);
    e.path.classList.toggle("hot", hot);
  });
  packets.forEach(p => {
    const hot = related.has(p.from) && related.has(p.to);
    p.dot.classList.toggle("hot", hot);
  });
}
function clearHighlight() {
  NODES.forEach(n => {
    const el = document.getElementById("node-" + n.id);
    el.classList.remove("glow", "dim");
  });
  edgeEls.forEach(e => e.path.classList.remove("hot"));
  packets.forEach(p => p.dot.classList.remove("hot"));
}

  document.getElementById("pDeps").innerHTML =
    deps.length ? deps.map(d => `<span class="dep">${d}</span>`).join("") : `<span class="dep">None</span>`;

/* =====================================================================
   PAN + ZOOM
   ===================================================================== */
let panning = false, sx = 0, sy = 0, startX = 0, startY = 0, moved = false;
viewport.addEventListener("mousedown", (e) => {
  if (e.target.closest(".node")) return;
  panning = true; moved = false;
  sx = e.clientX; sy = e.clientY; startX = view.x; startY = view.y;
  viewport.classList.add("grabbing");
});
window.addEventListener("mousemove", (e) => {
  if (!panning) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
  view.x = startX + dx; view.y = startY + dy;
  applyTransform();
});
window.addEventListener("mouseup", () => { panning = false; viewport.classList.remove("grabbing"); });

viewport.addEventListener("wheel", (e) => {
  e.preventDefault();
  const rect = viewport.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const delta = -e.deltaY * 0.0015;
  const newScale = Math.min(2.2, Math.max(0.25, view.scale * (1 + delta)));
  // zoom around cursor
  const wx = (mx - view.x) / view.scale;
  const wy = (my - view.y) / view.scale;
  view.scale = newScale;
  view.x = mx - wx * view.scale;
  view.y = my - wy * view.scale;
  applyTransform();
}, { passive: false });

/* =====================================================================
   ZOOM CONTROLS + FIT + RESET
   ===================================================================== */
function zoomBy(factor) {
  const rect = viewport.getBoundingClientRect();
  const mx = rect.width/2, my = rect.height/2;
  const wx = (mx - view.x) / view.scale, wy = (my - view.y) / view.scale;
  view.scale = Math.min(2.2, Math.max(0.25, view.scale * factor));
  view.x = mx - wx * view.scale; view.y = my - wy * view.scale;
  applyTransform();
}
document.getElementById("zin").onclick = () => zoomBy(1.15);
document.getElementById("zout").onclick = () => zoomBy(1/1.15);

function worldBounds() {
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  NODES.forEach(n => {
    minX=Math.min(minX,n.x); minY=Math.min(minY,n.y-60);
    maxX=Math.max(maxX,n.x+n.w); maxY=Math.max(maxY,n.y+n.h);
  });
  return {minX,minY,maxX,maxY,w:maxX-minX,h:maxY-minY};
}
function fitView() {
  const b = worldBounds();
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const scale = Math.min(vw/(b.w+120), vh/(b.h+120), 1.4);
  view.scale = scale;
  view.x = (vw - b.w*scale)/2 - b.minX*scale;
  view.y = (vh - b.h*scale)/2 - b.minY*scale;
  applyTransform();
}
document.getElementById("zfit").onclick = fitView;
document.getElementById("btnReset").onclick = () => { view.x=40; view.y=20; view.scale=0.62; applyTransform(); };

/* =====================================================================
   MINIMAP
   ===================================================================== */
const mmSvg = document.getElementById("mmSvg");
let mmScale = 1, mmOx = 0, mmOy = 0;
function buildMinimap() {
  const b = worldBounds();
  const W = 210, H = 130, pad = 6;
  mmScale = Math.min((W-pad*2)/b.w, (H-pad*2)/b.h);
  mmOx = pad - b.minX*mmScale;
  mmOy = pad - b.minY*mmScale;
  mmSvg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  let s = "";
  NODES.forEach(n => {
    s += `<rect id="mm-node" x="${n.x*mmScale+mmOx}" y="${n.y*mmScale+mmOy}" width="${Math.max(2,n.w*mmScale)}" height="${Math.max(2,n.h*mmScale)}" rx="1"/>`;
  });
  s += `<rect id="mm-view" x="0" y="0" width="10" height="10"/>`;
  mmSvg.innerHTML = s;
}
function updateMinimap() {
  const vRect = mmSvg.querySelector("#mm-view");
  if (!vRect) return;
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  // visible world region
  const wx = -view.x / view.scale, wy = -view.y / view.scale;
  const ww = vw / view.scale, wh = vh / view.scale;
  vRect.setAttribute("x", wx*mmScale + mmOx);
  vRect.setAttribute("y", wy*mmScale + mmOy);
  vRect.setAttribute("width", ww*mmScale);
  vRect.setAttribute("height", wh*mmScale);
}
mmSvg.addEventListener("click", (e) => {
  const r = mmSvg.getBoundingClientRect();
  const mx = (e.clientX - r.left) * (210 / r.width);
  const my = (e.clientY - r.top) * (130 / r.height);
  const worldX = (mx - mmOx) / mmScale;
  const worldY = (my - mmOy) / mmScale;
  view.x = viewport.clientWidth/2 - worldX*view.scale;
  view.y = viewport.clientHeight/2 - worldY*view.scale;
  applyTransform();
});

/* =====================================================================
   EXPORT — SVG + PNG (rendered from the data model, no libraries)
   ===================================================================== */
function buildExportSvg() {
  const b = worldBounds();
  const pad = 60;
  const W = b.w + pad*2, H = b.h + pad*2;
  const ox = pad - b.minX, oy = pad - b.minY;
  const NS = "http://www.w3.org/2000/svg";

  let paths = "";
  EDGES.forEach(([a,bId]) => {
    const na = nodeMap[a], nb = nodeMap[bId]; if(!na||!nb) return;
    const aCx = na.x+na.w/2, bCx = nb.x+nb.w/2;
    let x1,y1,x2,y2;
    if (bCx>=aCx){x1=na.x+na.w;y1=na.y+na.h/2;x2=nb.x;y2=nb.y+nb.h/2;}
    else{x1=na.x;y1=na.y+na.h/2;x2=nb.x+nb.w;y2=nb.y+nb.h/2;}
    const c=Math.max(40,Math.abs(x2-x1)*0.45);
    paths += `<path d="M ${x1+ox} ${y1+oy} C ${x1+c+ox} ${y1+oy}, ${x2-c+ox} ${y2+oy}, ${x2+ox} ${y2+oy}" fill="none" stroke="rgba(244,244,245,0.35)" stroke-width="1.6" marker-end="url(#ar)"/>`;
  });

  let rects = "";
  NODES.forEach(n => {
    const x=n.x+ox, y=n.y+oy;
    rects += `<g>
      <rect x="${x}" y="${y}" width="${n.w}" height="${n.h}" rx="12" fill="#2a2a30" stroke="#3a3a42"/>
      <rect x="${x+10}" y="${y+9}" width="26" height="26" rx="7" fill="#202024" stroke="#3a3a42"/>
      <text x="${x+23}" y="${y+27}" font-size="14" text-anchor="middle">${n.icon}</text>
      <text x="${x+44}" y="${y+22}" font-size="13" font-weight="700" fill="#f4f4f5" font-family="Segoe UI,sans-serif">${escapeXml(n.title)}</text>
      ${n.sub?`<text x="${x+44}" y="${y+35}" font-size="10" fill="#8b8b93" font-family="Segoe UI,sans-serif">${escapeXml(n.sub)}</text>`:""}
    </g>`;
  });

  let labels = "";
  SECTIONS.forEach(s => {
    labels += `<text x="${s.x+ox}" y="${s.y+oy}" font-size="11" letter-spacing="2" fill="#8b8b93" font-family="Segoe UI,sans-serif">${escapeXml(s.t.toUpperCase())}</text>`;
  });

  return `<svg xmlns="${NS}" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="rgba(244,244,245,0.5)"/></marker></defs>
    <rect width="${W}" height="${H}" fill="#111111"/>
    ${labels}${paths}${rects}
  </svg>`;
}
function escapeXml(s){return String(s).replace(/[<>&'"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;","'":"&apos;",'"':"&quot;"}[c]));}

function download(name, blob) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
document.getElementById("btnSVG").onclick = () => {
  download("system-design.svg", new Blob([buildExportSvg()], {type:"image/svg+xml"}));
};
document.getElementById("btnPNG").onclick = () => {
  const svg = buildExportSvg();
  const img = new Image();
  const url = URL.createObjectURL(new Blob([svg], {type:"image/svg+xml"}));
  img.onload = () => {
    const scale = 2;
    const canvas = document.createElement("canvas");
    canvas.width = img.width*scale; canvas.height = img.height*scale;
    const ctx = canvas.getContext("2d");
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0);
    canvas.toBlob(b => download("system-design.png", b));
    URL.revokeObjectURL(url);
  };
  img.src = url;
};

/* =====================================================================
   BOOT
   ===================================================================== */
render();
applyTransform();
fitView();
window.addEventListener("resize", updateMinimap);
</script>
</body>
</html>
